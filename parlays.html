<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharp Sim — Parlays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sharp.css">
<meta name="theme-color" content="#0b0d10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="js/bets.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="js/ui.js"></script>
<style>
.leg { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); transition: background .15s; }
.leg:hover { background: var(--surface-3); }
.leg-ico { width: 34px; height: 34px; border-radius: 10px; background: var(--surface); display: grid; place-items: center; font-size: 17px; grid-row: span 2; }
.leg-pick { font-size: 14.5px; font-weight: 600; min-width: 0; }
.leg-match { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: center; min-width: 0; grid-column: 2 / -1; }
.leg-match span.m { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.leg-num { text-align: right; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.leg-num small { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.leg-bar { grid-column: 2 / -1; }
.parlay-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
.parlay-odds { margin-left: auto; text-align: right; }
.parlay-odds .v { font-size: 30px; font-weight: 700; letter-spacing: -0.8px; line-height: 1; font-variant-numeric: tabular-nums; }
.dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 12px; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--track); }
.dots i.w { background: var(--strong); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const SB = window.SharpBets;
const { GradeBadge, RecordCard } = SB;

const UI = window.SharpUI;
const SPORT_META = {
  nfl:  { label:"NFL",              icon:"🏈", page:"nfl.html" },
  cfb:  { label:"College football", icon:"🏟️", page:"cfb.html" },
  mlb:  { label:"MLB",              icon:"⚾", page:"mlb.html" },
  wnba: { label:"WNBA",             icon:"🏀", page:"wnba.html" },
  golf: { label:"Golf",             icon:"⛳", page:"golf.html" },
};
const MAX_POOL = 25;      // legs considered for combos (highest chance first)
const PER_SIZE = 15;      // parlays shown per leg count
const GOLF_DAYS = 4;      // golf picks stay live for the rest of the tournament


const pctFmt = (p) => p < 10 ? p.toFixed(1) + "%" : p.toFixed(0) + "%";
const dayStr = (offset) => { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString("en-CA"); };
const gradeOf = (key) => key ? { key, label: SB.LABELS[key], color: SB.COLORS[key], blurb: SB.BLURBS[key] } : null;

// ── Leg sources ───────────────────────────────────────────────────────────────
// 1) The shared pick record (gist, written by every sport page through SharpBets.logPicks):
//    STRONG and GOOD picks that haven't settled yet and whose game is today or later.
function legsFromRecord(bets) {
  const today = dayStr(0), golfFrom = dayStr(-GOLF_DAYS);
  const out = [];
  (bets || []).forEach(b => {
    const tier = SB.recTier(b.tier);
    if (!tier || b.result !== "pending") return;
    const sport = String(b.sport || "").toLowerCase();
    if (!SPORT_META[sport]) return; // World Cup and anything unknown are left out
    const date = b.gameDate || "";
    if (date < (sport === "golf" ? golfFrom : today)) return;
    const chance = parseFloat(String(b.simPct || "").replace("%", ""));
    if (!(chance > 0 && chance < 100)) return;
    const price = b.price > 0 && b.price < 100 ? +b.price : null;
    const golf = sport === "golf";
    out.push({
      id: b.ticker ? b.ticker + "|" + (b.side || "") : b.gameId + "|" + b.market,
      // golf: one leg per golfer per tournament (his top 10 and top 20 move together)
      gameId: sport + ":" + (golf ? b.awayTeam + "|" + b.homeTeam : b.gameId),
      sport, tier, chance, price, date,
      pick: golf ? `${b.homeTeam} · ${b.market}` : b.market,
      match: golf ? b.awayTeam : `${b.awayTeam} @ ${b.homeTeam}`,
    });
  });
  return out;
}
// 2) Older pages (MLB, WNBA) also leave today's legs in this browser's localStorage when you visit them.
//    Used only if present; LOCK/HIGH count as STRONG/GOOD, LEAN is dropped.
function legsFromLocal() {
  const out = [];
  Object.keys(SPORT_META).forEach(sport => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem("sharp_xsport_legs_" + sport + "_" + dayStr(0)) || "null"); } catch (e) {}
    (d && d.legs || []).forEach(l => {
      const tier = SB.recTier(l.tier);
      const chance = l.prob ? l.prob * 100 : parseFloat(l.probPct);
      if (!tier || !(chance > 0 && chance < 100)) return;
      out.push({ id: sport + "|" + l.matchId + "|" + l.market, gameId: sport + ":" + l.matchId, sport, tier, chance, price: null, date: dayStr(0), pick: l.market, match: l.match });
    });
  });
  return out;
}

// ── Parlays ───────────────────────────────────────────────────────────────────
// One leg per game (legs from the same game move together, so multiplying their chances would overstate it).
function buildParlays(legs) {
  const pool = legs.slice().sort((a, b) => b.chance - a.chance).slice(0, MAX_POOL);
  const out = [];
  for (const size of [2, 3, 4]) {
    const combos = [];
    (function combine(start, cur) {
      if (cur.length === size) { combos.push(cur.slice()); return; }
      for (let i = start; i < pool.length; i++) {
        if (cur.some(l => l.gameId === pool[i].gameId)) continue;
        cur.push(pool[i]); combine(i + 1, cur); cur.pop();
      }
    })(0, []);
    combos.map(c => {
      const chance = c.reduce((a, l) => a * l.chance / 100, 1) * 100;
      const priced = c.every(l => l.price);
      const price = priced ? c.reduce((a, l) => a * l.price / 100, 1) * 100 : null;
      return { legs: c, size, chance, price, edge: priced ? chance - price : null };
    }).sort((a, b) => b.chance - a.chance).slice(0, PER_SIZE).forEach(p => out.push(p));
  }
  return out.sort((a, b) => b.chance - a.chance);
}

function Leg({ leg }) {
  const m = SPORT_META[leg.sport], g = gradeOf(leg.tier);
  const bar = leg.price ? { ...g, chance: leg.chance, price: leg.price, edge: leg.chance - leg.price } : null;
  return (
    <a href={m.page} title={"Open the " + m.label + " page"} className="leg" style={{ "--g": g.color }}>
      <span className="leg-ico" aria-hidden="true">{m.icon}</span>
      <div className="leg-pick">{leg.pick}</div>
      <div className="leg-num">{pctFmt(leg.chance)}{leg.price ? <small>Kalshi {Math.round(leg.price)}¢</small> : null}</div>
      <div className="leg-match"><GradeBadge g={g} small /><span className="m">{leg.match}</span></div>
      {bar && <div className="leg-bar"><SB.ChanceBar g={bar} compact /></div>}
    </a>
  );
}

// "Wins about 1 time in N" as N dots, one filled
function Dots({ chance }) {
  const n = Math.max(2, Math.min(40, Math.round(100 / chance)));
  return <div className="dots" role="img" aria-label={`About 1 win in ${n} tries`}>{Array.from({ length: n }, (_, i) => <i key={i} className={i === 0 ? "w" : ""} />)}</div>;
}

function App() {
  const s = SB.useSettings();
  const [legs, setLegs] = useState(null);
  const [err, setErr] = useState("");
  const [ts, setTs] = useState(null);
  const [filterSize, setFilterSize] = useState("all");
  const [filterSport, setFilterSport] = useState("all");

  async function load() {
    let rec = [];
    try { rec = legsFromRecord(await SB.readBets()); setErr(""); }
    catch (e) { setErr("The shared pick record couldn't load (" + (e.message || e) + ")."); }
    const seen = new Set(), all = [];
    rec.concat(legsFromLocal()).forEach(l => { if (!seen.has(l.id)) { seen.add(l.id); all.push(l); } });
    setLegs(all); setTs(Date.now());
  }
  useEffect(() => { load(); const t = setInterval(load, 5 * 60 * 1000); return () => clearInterval(t); }, []);

  const pool = (legs || []).filter(l => filterSport === "all" || l.sport === filterSport);
  const parlays = buildParlays(pool);
  const shown = filterSize === "all" ? parlays : parlays.filter(p => p.size === +filterSize);
  const sportsIn = Object.keys(SPORT_META).filter(k => (legs || []).some(l => l.sport === k));

  return (
    <UI.Shell active="parlays">
      <UI.PageHead eyebrow="Built from STRONG and GOOD picks" title="Parlays"
        right={<button onClick={load} className="btn btn-sm" title={ts ? "Picks loaded " + new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : ""}>↻ Refresh</button>}
        sub="A parlay cashes only if every leg wins, so its chance is the legs' chances multiplied: two 60% legs make a 36% parlay. No parlay uses two legs from the same game." />
      <div className="note" style={{ marginBottom: 14 }}>Kalshi doesn't sell these as one bet. Bet each leg on its own sport page: tap a leg to go there.</div>

      {err && <div className="note warn" style={{ marginBottom: 14 }}>{err}</div>}

      {legs === null ? <UI.Status>Loading today's picks…</UI.Status>
      : legs.length < 2 ? (
        <div className="card" style={{ textAlign: "center", padding: "28px 18px" }}>
          <div style={{ fontSize: 17, fontWeight: 650, marginBottom: 6 }}>Not enough STRONG or GOOD picks yet</div>
          <div className="small text-2" style={{ maxWidth: 420, margin: "0 auto" }}>
            {legs.length === 1 ? "There's 1 open pick right now; a parlay needs at least 2 from different games." : "No open STRONG or GOOD picks right now."} Picks appear here once a sport page grades them. Open a sport page to load today's board:
          </div>
          <div className="wrap-row" style={{ justifyContent: "center", marginTop: 14 }}>
            {Object.entries(SPORT_META).map(([k, m]) => <a key={k} href={m.page} className="btn btn-sm">{m.icon} {m.label}</a>)}
          </div>
        </div>
      ) : (
        <>
          {sportsIn.length > 1 && <div className="tabs" role="group" aria-label="Sport">
            <button className="tab" aria-selected={filterSport === "all"} onClick={() => setFilterSport("all")}>All sports</button>
            {sportsIn.map(k => <button key={k} className="tab" aria-selected={filterSport === k} onClick={() => setFilterSport(k)}>{SPORT_META[k].icon} {SPORT_META[k].label}</button>)}
          </div>}

          <UI.H2 aside={`${pool.length}`}>Open picks</UI.H2>
          <div className="stack" style={{ gap: 6 }}>
            {pool.slice().sort((a, b) => b.chance - a.chance).map(l => <Leg key={l.id} leg={l} />)}
          </div>

          <UI.H2 aside={`${shown.length} · most likely first`}>Parlays</UI.H2>
          <div style={{ marginBottom: 12 }}><UI.Seg options={[["all", "All"], ["2", "2 legs"], ["3", "3 legs"], ["4", "4 legs"]]} value={filterSize} onChange={setFilterSize} /></div>

          {shown.length === 0 && <div className="note">Not enough picks from different games for {filterSize}-leg parlays.</div>}

          <div className="stack">
            {shown.map((p, i) => {
              const sports = [...new Set(p.legs.map(l => l.sport))];
              return (
                <div key={i} className="card">
                  <div className="parlay-head">
                    <div>
                      <div style={{ fontWeight: 650 }}>{p.size}-leg parlay</div>
                      <div className="small muted">{sports.map(k => SPORT_META[k].icon + " " + SPORT_META[k].label).join(" · ")}</div>
                    </div>
                    <div className="parlay-odds"><div className="v">{pctFmt(p.chance)}</div><div className="tiny muted">chance to cash</div></div>
                  </div>
                  <div className="stack" style={{ gap: 6 }}>{p.legs.map(l => <Leg key={l.id} leg={l} />)}</div>
                  <Dots chance={p.chance} />
                  <div className="small text-2" style={{ marginTop: 8 }}>
                    Wins about <b>1 time in {Math.max(1, Math.round(100 / p.chance))}</b>.
                    {p.price != null && <> Every leg bought on Kalshi at today's prices works out to <b>{pctFmt(p.price)}</b> together, so the model sees <b style={{ color: p.edge > 0 ? "var(--pos)" : "var(--neg)" }}>{p.edge > 0 ? "+" : "−"}{Math.abs(p.edge).toFixed(1)} points</b> of edge.</>}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="ss-foot">Legs are treated as independent (different games). Picks come from the shared STRONG/GOOD record (synced across devices) plus any legs MLB or WNBA left in this browser today. Not professional betting advice.</div>
        </>
      )}

      <UI.H2>Pick record</UI.H2>
      <RecordCard />
    </UI.Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
