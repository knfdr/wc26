<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharp Sim — Parlays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="js/bets.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100vh;background:#070b14;font-family:'IBM Plex Mono','Courier New',monospace;color:#dde5f0;zoom:1.2}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#0c1526}
::-webkit-scrollbar-thumb{background:#1a2a3e;border-radius:3px}
a{text-decoration:none;color:inherit}
#root{min-height:100vh}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const SB = window.SharpBets;
const { GradeBadge, RecordCard } = SB;

const T = {
  bg:"#070b14", navy:"#0c1526", card:"#101d30", border:"#1a2a3e",
  text:"#dde5f0", muted:"#4b6280", gold:"#e8c547", green:"#22c55e",
  red:"#ef4444", purple:"#a78bfa", blue:"#38bdf8",
};
const SPORT_META = {
  nfl:  { label:"NFL",              icon:"🏈", color:"#38bdf8", page:"nfl.html" },
  cfb:  { label:"College football", icon:"🏈", color:"#f97316", page:"cfb.html" },
  mlb:  { label:"MLB",              icon:"⚾", color:"#22c55e", page:"mlb.html" },
  wnba: { label:"WNBA",             icon:"🏀", color:"#e879f9", page:"wnba.html" },
  golf: { label:"Golf",             icon:"⛳", color:"#4ade80", page:"golf.html" },
};
const MAX_POOL = 25;      // legs considered for combos (highest chance first)
const PER_SIZE = 15;      // parlays shown per leg count
const GOLF_DAYS = 4;      // golf picks stay live for the rest of the tournament

const S = {
  sec:  { marginBottom:20 },
  card: { background:T.card, border:`1px solid ${T.border}`, borderRadius:6, padding:"14px 16px" },
  secLabel: { fontSize:9, letterSpacing:"3px", color:T.muted, textTransform:"uppercase", marginBottom:10, paddingBottom:6, borderBottom:`1px solid ${T.border}` },
  disclaimer: { fontSize:9, color:"#2a3a52", lineHeight:1.8, marginTop:16 },
  pill: (on, c) => ({ padding:"5px 12px", fontSize:10, fontWeight:700, letterSpacing:"0.5px", background: on ? c : T.card, color: on ? "#070b14" : T.muted, border:`1px solid ${on ? c : T.border}`, borderRadius:4, cursor:"pointer", fontFamily:"inherit" }),
};

const pctFmt = (p) => p < 10 ? p.toFixed(1) + "%" : p.toFixed(0) + "%";
const dayStr = (offset) => { const d = new Date(); d.setDate(d.getDate() + offset); return d.toLocaleDateString("en-CA"); };
const gradeOf = (key) => key ? { key, label: SB.LABELS[key], color: SB.COLORS[key], blurb: SB.BLURBS[key] } : null;

// ── Leg sources ───────────────────────────────────────────────────────────────
// 1) The shared pick record (gist, written by every sport page through SharpBets.logPicks):
//    STRONG and GOOD picks that haven't settled yet and whose game is today or later.
function legsFromRecord(bets) {
  const today = dayStr(0), golfFrom = dayStr(-GOLF_DAYS);
  const out = [];
  (bets || []).forEach(b => {
    const tier = SB.recTier(b.tier);
    if (!tier || b.result !== "pending") return;
    const sport = String(b.sport || "").toLowerCase();
    if (!SPORT_META[sport]) return; // World Cup and anything unknown are left out
    const date = b.gameDate || "";
    if (date < (sport === "golf" ? golfFrom : today)) return;
    const chance = parseFloat(String(b.simPct || "").replace("%", ""));
    if (!(chance > 0 && chance < 100)) return;
    const price = b.price > 0 && b.price < 100 ? +b.price : null;
    const golf = sport === "golf";
    out.push({
      id: b.ticker ? b.ticker + "|" + (b.side || "") : b.gameId + "|" + b.market,
      // golf: one leg per golfer per tournament (his top 10 and top 20 move together)
      gameId: sport + ":" + (golf ? b.awayTeam + "|" + b.homeTeam : b.gameId),
      sport, tier, chance, price, date,
      pick: golf ? `${b.homeTeam} · ${b.market}` : b.market,
      match: golf ? b.awayTeam : `${b.awayTeam} @ ${b.homeTeam}`,
    });
  });
  return out;
}
// 2) Older pages (MLB, WNBA) also leave today's legs in this browser's localStorage when you visit them.
//    Used only if present; LOCK/HIGH count as STRONG/GOOD, LEAN is dropped.
function legsFromLocal() {
  const out = [];
  Object.keys(SPORT_META).forEach(sport => {
    let d = null;
    try { d = JSON.parse(localStorage.getItem("sharp_xsport_legs_" + sport + "_" + dayStr(0)) || "null"); } catch (e) {}
    (d && d.legs || []).forEach(l => {
      const tier = SB.recTier(l.tier);
      const chance = l.prob ? l.prob * 100 : parseFloat(l.probPct);
      if (!tier || !(chance > 0 && chance < 100)) return;
      out.push({ id: sport + "|" + l.matchId + "|" + l.market, gameId: sport + ":" + l.matchId, sport, tier, chance, price: null, date: dayStr(0), pick: l.market, match: l.match });
    });
  });
  return out;
}

// ── Parlays ───────────────────────────────────────────────────────────────────
// One leg per game (legs from the same game move together, so multiplying their chances would overstate it).
function buildParlays(legs) {
  const pool = legs.slice().sort((a, b) => b.chance - a.chance).slice(0, MAX_POOL);
  const out = [];
  for (const size of [2, 3, 4]) {
    const combos = [];
    (function combine(start, cur) {
      if (cur.length === size) { combos.push(cur.slice()); return; }
      for (let i = start; i < pool.length; i++) {
        if (cur.some(l => l.gameId === pool[i].gameId)) continue;
        cur.push(pool[i]); combine(i + 1, cur); cur.pop();
      }
    })(0, []);
    combos.map(c => {
      const chance = c.reduce((a, l) => a * l.chance / 100, 1) * 100;
      const priced = c.every(l => l.price);
      const price = priced ? c.reduce((a, l) => a * l.price / 100, 1) * 100 : null;
      return { legs: c, size, chance, price, edge: priced ? chance - price : null };
    }).sort((a, b) => b.chance - a.chance).slice(0, PER_SIZE).forEach(p => out.push(p));
  }
  return out.sort((a, b) => b.chance - a.chance);
}

function Leg({ leg }) {
  const m = SPORT_META[leg.sport], g = gradeOf(leg.tier);
  return (
    <a href={m.page} title={"Open the " + m.label + " page"} style={{ display:"flex", alignItems:"center", gap:8, background:T.navy, borderRadius:4, padding:"7px 10px", borderLeft:`2px solid ${g.color}`, flexWrap:"wrap" }}>
      <span style={{ fontSize:13 }}>{m.icon}</span>
      <GradeBadge g={g} small/>
      <div style={{ flex:1, minWidth:150 }}>
        <div style={{ fontSize:11, color:T.text, fontWeight:600 }}>{leg.pick}</div>
        <div style={{ fontSize:9, color:T.muted }}>{leg.match}</div>
      </div>
      <div style={{ fontSize:10, color:g.color, fontWeight:700, textAlign:"right" }}>
        model: {pctFmt(leg.chance)} chance to cash
        {leg.price && <div style={{ fontSize:9, color:T.muted, fontWeight:400 }}>Kalshi {Math.round(leg.price)}¢</div>}
      </div>
    </a>
  );
}

function App() {
  const s = SB.useSettings();
  const [legs, setLegs] = useState(null);
  const [err, setErr] = useState("");
  const [ts, setTs] = useState(null);
  const [filterSize, setFilterSize] = useState("all");
  const [filterSport, setFilterSport] = useState("all");

  async function load() {
    let rec = [];
    try { rec = legsFromRecord(await SB.readBets()); setErr(""); }
    catch (e) { setErr("The shared pick record couldn't load (" + (e.message || e) + ")."); }
    const seen = new Set(), all = [];
    rec.concat(legsFromLocal()).forEach(l => { if (!seen.has(l.id)) { seen.add(l.id); all.push(l); } });
    setLegs(all); setTs(Date.now());
  }
  useEffect(() => { load(); const t = setInterval(load, 5 * 60 * 1000); return () => clearInterval(t); }, []);

  const pool = (legs || []).filter(l => filterSport === "all" || l.sport === filterSport);
  const parlays = buildParlays(pool);
  const shown = filterSize === "all" ? parlays : parlays.filter(p => p.size === +filterSize);
  const sportsIn = Object.keys(SPORT_META).filter(k => (legs || []).some(l => l.sport === k));

  return (
    <div style={{ background:T.bg, minHeight:"100vh" }}>
      <div style={{ background:T.navy, borderBottom:"1px solid "+T.border, padding:"8px 16px", display:"flex", alignItems:"center", gap:12, flexWrap:"wrap" }}>
        <a href="index.html" style={{ fontSize:9, color:T.muted, letterSpacing:"1px" }}>← Sharp Sim</a>
        <div style={{ flex:1 }}/>
        {ts && <span style={{ fontSize:8, color:T.muted }}>picks loaded {new Date(ts).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" })}</span>}
        <a href="settings.html" style={{ fontSize:9, color:T.muted, letterSpacing:1 }}>⚙ SETTINGS</a>
        <button onClick={load} style={{ background:"none", border:"1px solid "+T.border, color:T.muted, fontSize:9, padding:"4px 10px", borderRadius:3, cursor:"pointer", fontFamily:"inherit" }}>⟳ Refresh</button>
      </div>

      <div style={{ background:"linear-gradient(160deg,#0c1526 0%,#070b14 100%)", borderBottom:`1px solid ${T.border}`, padding:"28px 24px 24px", textAlign:"center" }}>
        <div style={{ display:"inline-block", background:"rgba(167,139,250,0.1)", border:"1px solid rgba(167,139,250,0.25)", color:T.purple, fontSize:9, letterSpacing:"3px", padding:"3px 12px", borderRadius:2, marginBottom:14 }}>⚡ SHARP SIM · PARLAYS</div>
        <div style={{ fontSize:"clamp(24px,4vw,38px)", fontWeight:700, letterSpacing:"-1px", marginBottom:6, background:"linear-gradient(135deg,#a78bfa 0%,#dde5f0 60%)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent", backgroundClip:"text" }}>Parlay Builder</div>
        <div style={{ fontSize:10, color:T.muted, letterSpacing:"1px" }}>Built only from STRONG and GOOD picks across every sport</div>
      </div>

      <div style={{ maxWidth:960, margin:"0 auto", padding:"24px 16px 60px" }}>
        <div style={{ ...S.card, marginBottom:16, fontSize:10, color:T.muted, lineHeight:1.8 }}>
          A parlay cashes only if <b style={{ color:T.text }}>every</b> leg wins, so its chance to cash is the legs' chances multiplied together: two 60% legs make a 36% parlay. Each leg here is a STRONG BET or GOOD BET from its sport page, and no parlay uses two legs from the same game. Kalshi doesn't sell these as one bet, so bet the legs on their own pages (tap a leg).
        </div>

        {err && <div style={{ ...S.card, color:T.gold, fontSize:10, marginBottom:16 }}>{err}</div>}

        {legs === null ? (
          <div style={{ ...S.card, textAlign:"center", padding:40, color:T.muted, fontSize:11 }}>Loading today's picks…</div>
        ) : legs.length < 2 ? (
          <div style={{ ...S.card, textAlign:"center", padding:"36px 24px", color:T.muted, fontSize:11, lineHeight:1.9 }}>
            <div style={{ fontSize:12, fontWeight:700, color:T.text, marginBottom:6 }}>Not enough STRONG or GOOD picks yet</div>
            {legs.length === 1 ? "There's 1 open pick right now; a parlay needs at least 2 from different games." : "No open STRONG or GOOD picks right now."}
            <br/>Picks appear here once a sport page grades them. Open a sport page to load today's board:
            <div style={{ display:"flex", gap:8, justifyContent:"center", flexWrap:"wrap", marginTop:12 }}>
              {Object.entries(SPORT_META).map(([k, m]) => <a key={k} href={m.page} style={{ ...S.pill(false, m.color), color:m.color }}>{m.icon} {m.label}</a>)}
            </div>
          </div>
        ) : (
          <>
            <div style={{ ...S.sec, display:"flex", gap:6, flexWrap:"wrap", alignItems:"center" }}>
              <div style={{ fontSize:9, color:T.muted, letterSpacing:"2px", marginRight:4 }}>SPORT</div>
              <button onClick={() => setFilterSport("all")} style={S.pill(filterSport === "all", T.purple)}>ALL</button>
              {sportsIn.map(k => <button key={k} onClick={() => setFilterSport(k)} style={S.pill(filterSport === k, SPORT_META[k].color)}>{SPORT_META[k].icon} {SPORT_META[k].label.toUpperCase()}</button>)}
            </div>

            <div style={S.sec}>
              <div style={S.secLabel}>Open picks ({pool.length})</div>
              <div style={{ display:"flex", flexDirection:"column", gap:5 }}>
                {pool.slice().sort((a, b) => b.chance - a.chance).map(l => <Leg key={l.id} leg={l}/>)}
              </div>
            </div>

            <div style={{ ...S.sec, display:"flex", gap:6, flexWrap:"wrap" }}>
              {["all", "2", "3", "4"].map(v => <button key={v} onClick={() => setFilterSize(v)} style={S.pill(filterSize === v, T.gold)}>{v === "all" ? "ALL" : v + " LEGS"}</button>)}
              <div style={{ marginLeft:"auto", fontSize:10, color:T.muted, alignSelf:"center" }}>{shown.length} parlays · most likely first</div>
            </div>

            {shown.length === 0 && <div style={{ ...S.card, textAlign:"center", padding:28, color:T.muted, fontSize:11 }}>Not enough picks from different games for {filterSize}-leg parlays.</div>}

            {shown.map((p, i) => {
              const sports = [...new Set(p.legs.map(l => l.sport))];
              const c = p.chance >= 40 ? T.green : p.chance >= 20 ? T.gold : T.red;
              return (
                <div key={i} style={{ ...S.card, marginTop:10, borderLeft:`3px solid ${c}` }}>
                  <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:10, flexWrap:"wrap", gap:6 }}>
                    <div style={{ display:"flex", alignItems:"center", gap:8, flexWrap:"wrap" }}>
                      <div style={{ background:T.purple + "1a", border:`1px solid ${T.purple}33`, color:T.purple, fontSize:9, padding:"2px 8px", borderRadius:3, letterSpacing:"1px" }}>{p.size} LEGS</div>
                      {sports.map(k => <div key={k} style={{ color:SPORT_META[k].color, fontSize:9 }}>{SPORT_META[k].icon} {SPORT_META[k].label}</div>)}
                    </div>
                    <div style={{ textAlign:"right" }}>
                      <div style={{ fontSize:22, fontWeight:700, color:c }}>{pctFmt(p.chance)}</div>
                      <div style={{ fontSize:9, color:T.muted }}>model: chance to cash</div>
                    </div>
                  </div>
                  <div style={{ display:"flex", flexDirection:"column", gap:5 }}>{p.legs.map(l => <Leg key={l.id} leg={l}/>)}</div>
                  <div style={{ fontSize:10, color:T.muted, marginTop:10, lineHeight:1.7 }}>
                    Wins about <b style={{ color:T.text }}>1 time in {Math.max(1, Math.round(100 / p.chance))}</b>.
                    {p.price != null && <> Buying every leg on Kalshi at today's prices works out to <b style={{ color:T.text }}>{pctFmt(p.price)}</b> for all of them together, so the model sees <b style={{ color: p.edge > 0 ? T.green : T.red }}>{p.edge > 0 ? "+" : ""}{p.edge.toFixed(1)} points</b> of edge.</>}
                  </div>
                </div>
              );
            })}

            <div style={{ ...S.disclaimer, marginTop:20 }}>
              Legs are treated as independent (different games). Picks come from the shared STRONG/GOOD record (synced across devices) plus any legs MLB or WNBA left in this browser today. Not professional betting advice. Gamble responsibly.
            </div>
          </>
        )}

        <div style={{ marginTop:20 }}><RecordCard/></div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
