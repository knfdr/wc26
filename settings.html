<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharp Sim — Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sharp.css">
<meta name="theme-color" content="#0b0d10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="js/bets.js"></script>
<script src="js/ui.js"></script>
<style>
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); min-height: 60px; }
.set-row:first-of-type { border-top: 0; }
.set-row .n { font-size: 15px; font-weight: 600; }
.set-row .d { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.num-in { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; flex: none; }
.num-in input { width: 84px; height: 44px; text-align: right; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--text); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.switch { flex: none; width: 52px; height: 32px; border-radius: 16px; border: 0; background: var(--surface-3); position: relative; transition: background .15s; }
.switch[aria-checked="true"] { background: var(--strong); }
.switch span { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 13px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: left .15s; }
.switch[aria-checked="true"] span { left: 23px; }
.set-card { margin-bottom: 14px; }
.set-card h2 { font-size: 16px; font-weight: 650; margin-bottom: 4px; }
.set-card .help { font-size: 13.5px; color: var(--text-2); line-height: 1.5; margin-bottom: 6px; }
.savebar { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); display: flex; gap: 10px; background: linear-gradient(transparent, var(--bg) 30%); }
.ok { font-weight: 700; } .ok.y { color: var(--pos); } .ok.n { color: var(--neg); } .ok.w { color: var(--small); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const B = window.SharpBets, UI = window.SharpUI;

function Num({ value, onChange, prefix, suffix, step = 1, min = 0, max, label }) {
  return (
    <span className="num-in">
      {prefix && <span>{prefix}</span>}
      <input type="number" inputMode="decimal" aria-label={label} value={value} step={step} min={min} max={max} onChange={e => onChange(e.target.value === "" ? "" : +e.target.value)} />
      {suffix && <span>{suffix}</span>}
    </span>
  );
}
function Row({ name, sub, children }) {
  return (
    <div className="set-row">
      <div style={{ minWidth: 0 }}><div className="n">{name}</div>{sub && <div className="d">{sub}</div>}</div>
      {children}
    </div>
  );
}
function Toggle({ on, onChange, label }) {
  return <button className="switch" role="switch" aria-checked={!!on} aria-label={label} onClick={() => onChange(!on)}><span /></button>;
}
const gradeName = (k) => <B.GradeBadge g={{ key: k, label: B.LABELS[k], color: B.COLORS[k] }} small />;

function App() {
  const live = B.useSettings();
  const kx = B.useKalshi();
  const [s, setS] = useState(live);
  const [dirty, setDirty] = useState(false);
  const [msg, setMsg] = useState("");
  const [theme, setThemeState] = useState(UI.getTheme());
  useEffect(() => { if (!dirty) setS(live); }, [live]);
  const set = (path, v) => { setDirty(true); setMsg(""); setS(prev => { const o = JSON.parse(JSON.stringify(prev)); let t = o; for (let i = 0; i < path.length - 1; i++) t = t[path[i]]; t[path[path.length - 1]] = v; return o; }); };
  async function save() {
    setMsg("Saving…");
    try { await B.saveSettings(s); setDirty(false); setMsg("Saved. Every page uses these now, on all your devices."); }
    catch (e) { setMsg("Saved on this device only (couldn't reach the shared store: " + e.message + ")"); setDirty(false); }
  }
  const ex = (sport, k) => { const g = { key: k, edge: k === "STRONG" ? s.strong.minEdge * 1.5 : k === "GOOD" ? s.good.minEdge * 1.5 : s.small.minEdge * 1.5 }; return B.money(B.stake(g, sport, s)); };

  return (
    <UI.Shell active="settings">
      <div style={{ maxWidth: 640 }}>
        <UI.PageHead title="Settings" sub="These apply to every sport page. They're saved to the site, so your phone and computer share them." />

        <div className="card set-card">
          <h2>Base bet per sport</h2>
          <div className="help">Your normal bet size for that sport. Each pick's suggested amount starts here: STRONG bets get {s.mult.STRONG}×, GOOD bets {s.mult.GOOD}×, SMALL EDGE bets {s.mult.SMALL}×, a little more or less depending on how big the edge is.</div>
          {Object.entries(B.SPORTS).map(([k, name]) => (
            <Row key={k} name={name} sub={s.baseBet[k] ? `Strong ≈ ${ex(k, "STRONG")} · Good ≈ ${ex(k, "GOOD")} · Small ≈ ${ex(k, "SMALL")}` : "Set an amount"}>
              <Num prefix="$" label={name + " base bet"} value={s.baseBet[k]} onChange={v => set(["baseBet", k], v)} />
            </Row>))}
        </div>

        <div className="card set-card">
          <h2>Bet size by grade</h2>
          <div className="help">How many base bets each grade gets, and the most the site will ever suggest on one bet.</div>
          <Row name={gradeName("STRONG")} sub="× base bet"><Num label="Strong multiplier" value={s.mult.STRONG} step={0.25} onChange={v => set(["mult", "STRONG"], v)} suffix="×" /></Row>
          <Row name={gradeName("GOOD")} sub="× base bet"><Num label="Good multiplier" value={s.mult.GOOD} step={0.25} onChange={v => set(["mult", "GOOD"], v)} suffix="×" /></Row>
          <Row name={gradeName("SMALL")} sub="× base bet (0 hides the bet button on these)"><Num label="Small multiplier" value={s.mult.SMALL} step={0.25} onChange={v => set(["mult", "SMALL"], v)} suffix="×" /></Row>
          <Row name="Largest suggestion" sub="× base bet, never more than this"><Num label="Largest suggestion" value={s.maxMult} step={0.5} onChange={v => set(["maxMult"], v)} suffix="×" /></Row>
        </div>

        <div className="card set-card">
          <h2>What counts as a strong bet</h2>
          <div className="note" style={{ margin: "8px 0 10px" }}>
            <B.ChanceBar g={{ color: B.COLORS.GOOD, chance: 60, price: 50, edge: 10 }} />
            <div style={{ marginTop: 10 }}><b>Chance to cash</b> is how often the model's simulations say the bet wins. <b>Edge</b> is that chance minus the price in cents: a 60% bet that costs 50¢ has a +10¢ edge. A bet needs both to earn a grade, so a likely winner that's already priced too high is never recommended.</div>
          </div>
          <Row name="Strong: chance at least"><Num label="Strong minimum chance" value={s.strong.minChance} onChange={v => set(["strong", "minChance"], v)} suffix="%" /></Row>
          <Row name="Strong: edge at least"><Num label="Strong minimum edge" value={s.strong.minEdge} step={0.5} onChange={v => set(["strong", "minEdge"], v)} suffix="¢" /></Row>
          <Row name="Good: chance at least"><Num label="Good minimum chance" value={s.good.minChance} onChange={v => set(["good", "minChance"], v)} suffix="%" /></Row>
          <Row name="Good: edge at least"><Num label="Good minimum edge" value={s.good.minEdge} step={0.5} onChange={v => set(["good", "minEdge"], v)} suffix="¢" /></Row>
          <Row name="Small edge: edge at least" sub="Below this it's NO EDGE; this far below zero it's AVOID"><Num label="Small minimum edge" value={s.small.minEdge} step={0.5} onChange={v => set(["small", "minEdge"], v)} suffix="¢" /></Row>
        </div>

        <div className="card set-card">
          <h2>Pages</h2>
          <Row name="Hide thin markets" sub="Skip Kalshi markets with a bid/ask gap wider than 6¢. Their prices aren't reliable."><Toggle label="Hide thin markets" on={s.hideWide} onChange={v => set(["hideWide"], v)} /></Row>
          <Row name="Track the record" sub="Add STRONG and GOOD picks to the win/loss record automatically."><Toggle label="Track the record" on={s.logPicks} onChange={v => set(["logPicks"], v)} /></Row>
          <Row name="Appearance" sub="Auto follows your phone's light or dark mode. Saved on this device right away.">
            <UI.Seg options={[["auto", "Auto"], ["dark", "Dark"], ["light", "Light"]]} value={theme} onChange={t => { UI.setTheme(t); setThemeState(t); }} />
          </Row>
        </div>

        <div className="card set-card">
          <h2>Kalshi connection</h2>
          {!kx ? <div className="status"><span className="spinner" />Checking…</div> : <>
            <Row name="API key on the server" sub={kx.credentials ? "Connected" : "Add KALSHI_API_KEY_ID and KALSHI_PRIVATE_KEY in Cloudflare Pages settings"}><span className={"ok " + (kx.credentials ? "y" : "n")}>{kx.credentials ? "Yes" : "No"}</span></Row>
            <Row name="Betting switched on" sub={kx.tradingEnabled ? "Bet buttons place real orders" : "Set KALSHI_TRADING_ENABLED=1 in Cloudflare to let bet buttons place orders"}><span className={"ok " + (kx.tradingEnabled ? "y" : "w")}>{kx.tradingEnabled ? "On" : "Off"}</span></Row>
            <Row name="Most per bet" sub="Server cap (KALSHI_MAX_ORDER_DOLLARS). Larger bets are trimmed to this."><b className="num">{kx.maxOrderDollars != null ? B.money(+kx.maxOrderDollars) : "—"}</b></Row>
          </>}
          <div className="small muted" style={{ marginTop: 10 }}>The live auto trader has its own settings on the <a href="live.html" className="link">Live trader page</a>.</div>
        </div>

        <div className="savebar">
          <button onClick={save} disabled={!dirty} className="confirm-btn" style={{ flex: 1 }}>{dirty ? "Save settings" : "Saved"}</button>
          <button onClick={() => { setS(JSON.parse(JSON.stringify(B.DEFAULTS))); setDirty(true); }} className="btn" style={{ minHeight: 54, borderRadius: 14 }}>Defaults</button>
        </div>
        {msg && <div className="small muted" style={{ textAlign: "center" }}>{msg}</div>}
      </div>
    </UI.Shell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
