<script>
// ── MLB ↔ Kalshi (plain JS so it can be tested outside the page) ─────────────────
// Kalshi's MLB markets come in three series that share one event key per game:
//   KXMLBGAME-26OCT282000MILTB      winner      (one market per team, ticker ends -MIL / -TB)
//   KXMLBSPREAD-26OCT282000MILTB    "Milwaukee wins by over 1.5 runs"  (ticker ends -MIL2, floor_strike 1.5)
//   KXMLBTOTAL-26OCT282000MILTB     "Over 8.5 runs scored"             (floor_strike 8.5)
// The key is YY MMM DD HHMM (Eastern start time) + away code + home code (+ G1/G2 for doubleheaders).
(function (root) {
  "use strict";
  const SERIES = ["KXMLBGAME", "KXMLBSPREAD", "KXMLBTOTAL"];
  const MON = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
  const pad = (n) => String(n).padStart(2, "0");
  // Kalshi sends prices as dollars ("0.5400") on newer replies and whole cents (54) on older ones
  const cents = (d, c) => d != null && d !== "" ? Math.round(parseFloat(d) * 100) : c != null && c !== "" ? Math.round(+c) : null;
  const okPrice = (p) => p != null && p > 0 && p < 100;

  function eventKey(evTicker) { const i = String(evTicker || "").indexOf("-"); return i < 0 ? null : evTicker.slice(i + 1); }
  function parseEventKey(key) {
    // doubleheaders end in G1 / G2, e.g. 26SEP251305CHCBOSG1
    const m = /^(\d{2})([A-Z]{3})(\d{2})(\d{2})(\d{2})([A-Z]+?)(?:G(\d))?$/.exec(key || "");
    if (!m || !MON[m[2]]) return null;
    return { date: "20" + m[1] + "-" + pad(MON[m[2]]) + "-" + m[3], mins: +m[4] * 60 + +m[5], teams: m[6], gameNo: m[7] ? +m[7] : null };
  }
  const dayNum = (iso) => Math.round(Date.parse(iso + "T12:00:00Z") / 86400000);

  // Fetch JSON through the site's Kalshi proxy. Throws when the reply isn't JSON (e.g. the login page or an error page).
  async function getJSON(url) {
    const r = await fetch(url);
    const txt = await r.text();
    let d; try { d = JSON.parse(txt); } catch (e) { throw new Error("Kalshi reply wasn't JSON (HTTP " + r.status + ")"); }
    if (!r.ok) throw new Error((d && (d.error && (d.error.message || d.error))) || ("HTTP " + r.status));
    return d;
  }
  async function fetchMarkets(status) {
    const out = [];
    for (const s of SERIES) {
      let cursor = "";
      for (let page = 0; page < 5; page++) {
        const d = await getJSON("/api/kx/markets?series_ticker=" + s + "&status=" + (status || "open") + "&limit=1000" + (cursor ? "&cursor=" + encodeURIComponent(cursor) : ""));
        if (!d || !Array.isArray(d.markets)) throw new Error("Kalshi reply had no market list");
        out.push(...d.markets);
        cursor = d.cursor;
        if (!cursor || !d.markets.length) break;
      }
    }
    return out;
  }
  // Group markets by game: Map(eventKey -> { key, info, markets })
  function indexByEvent(markets) {
    const idx = new Map();
    for (const m of markets || []) {
      const key = eventKey(m.event_ticker); if (!key) continue;
      if (!idx.has(key)) idx.set(key, { key, info: parseEventKey(key), markets: [] });
      idx.get(key).markets.push(m);
    }
    return idx;
  }
  // game: { homeKx, awayKx, etDate "YYYY-MM-DD", etMins }. Same teams, closest date (±1 day) and start time (doubleheaders).
  function matchGame(game, idx) {
    let best = null, bestScore = -Infinity;
    for (const ev of idx.values()) {
      const inf = ev.info; if (!inf) continue;
      const order = inf.teams === game.awayKx + game.homeKx ? 2 : inf.teams === game.homeKx + game.awayKx ? 1 : 0;
      if (!order) continue;
      const dd = game.etDate ? Math.abs(dayNum(inf.date) - dayNum(game.etDate)) : 0;
      if (dd > 1) continue;
      const tm = game.etMins != null ? Math.min(Math.abs(inf.mins - game.etMins), 720) / 720 : 0;
      const score = order * 10 - dd * 5 - tm * 3;
      if (score > bestScore) { bestScore = score; best = ev; }
    }
    return best;
  }
  // Normalize one market: { ticker, kind: win|spread|total, team: home|away (win/spread), line, yesBid, yesAsk, noBid, noAsk }
  function parseMarket(m, game) {
    const t = m.ticker || "", series = t.split("-")[0], tail = t.split("-").pop();
    const yesBid = cents(m.yes_bid_dollars, m.yes_bid), yesAsk = cents(m.yes_ask_dollars, m.yes_ask);
    const noBid = m.no_bid_dollars != null || m.no_bid != null ? cents(m.no_bid_dollars, m.no_bid) : (yesAsk != null ? 100 - yesAsk : null);
    const noAsk = m.no_ask_dollars != null || m.no_ask != null ? cents(m.no_ask_dollars, m.no_ask) : (yesBid != null ? 100 - yesBid : null);
    const base = { ticker: t, title: m.title, sub: m.yes_sub_title, yesBid, yesAsk, noBid, noAsk, result: m.result };
    const teamOf = (code) => code === game.homeKx ? "home" : code === game.awayKx ? "away" : null;
    if (series === "KXMLBGAME") { const team = teamOf(tail); return team ? { ...base, kind: "win", team, line: 0 } : null; }
    if (series === "KXMLBSPREAD") {
      const team = teamOf(tail.replace(/\d+$/, ""));
      const mm = String(m.yes_sub_title || m.title || "").match(/over\s+([\d.]+)/i);
      const line = m.floor_strike != null ? Number(m.floor_strike) : mm ? parseFloat(mm[1]) : null;
      return team && line != null ? { ...base, kind: "spread", team, line } : null;
    }
    if (series === "KXMLBTOTAL") {
      const mm = String(m.yes_sub_title || m.title || "").match(/over\s+([\d.]+)/i);
      const line = m.floor_strike != null ? Number(m.floor_strike) : mm ? parseFloat(mm[1]) : null;
      return line != null ? { ...base, kind: "total", line } : null;
    }
    return null;
  }
  // Model probabilities from a sim result (needs agg.totalDist / agg.marginDist)
  function probsFromAgg(agg) {
    if (!agg || !agg.totalDist || !agg.marginDist) return null;
    const off = agg.marginOffset;
    const pHome = agg.hWins / agg.n;
    return {
      pHome,
      pOver: (line) => agg.totalDist.reduce((a, f, k) => a + (k > line ? f : 0), 0),
      // P(team's margin > line): home margin = home - away
      pWinBy: (team, line) => agg.marginDist.reduce((a, f, i) => { const hm = i - off; const m = team === "home" ? hm : -hm; return a + (m > line ? f : 0); }, 0),
    };
  }
  function modelYes(mk, pr) {
    if (mk.kind === "win") return mk.team === "home" ? pr.pHome : 1 - pr.pHome;
    if (mk.kind === "spread") return pr.pWinBy(mk.team, mk.line);
    if (mk.kind === "total") return pr.pOver(mk.line);
    return null;
  }
  // Every priced bet for one game. game: { home, away, homeShort, awayShort, homeKx, awayKx }.
  // Each market: compare YES and NO (winner markets: YES only, since each team has its own), keep the side with the bigger edge.
  // grade(p, price) comes from SharpBets. opts.hideWide drops markets whose bid/ask gap is over 6¢.
  function priceGame(game, ev, pr, grade, opts) {
    opts = opts || {};
    const rows = [];
    if (!ev || !pr) return rows;
    const name = (t) => t === "home" ? game.homeShort : game.awayShort;
    const full = (t) => t === "home" ? game.home : game.away;
    const other = (t) => t === "home" ? "away" : "home";
    for (const m of ev.markets) {
      const mk = parseMarket(m, game); if (!mk) continue;
      const pYes = modelYes(mk, pr); if (pYes == null) continue;
      const sides = [];
      if (okPrice(mk.yesAsk)) sides.push({ side: "yes", price: mk.yesAsk, p: pYes, gap: mk.yesBid != null ? mk.yesAsk - mk.yesBid : 99 });
      if (mk.kind !== "win" && okPrice(mk.noAsk)) sides.push({ side: "no", price: mk.noAsk, p: 1 - pYes, gap: mk.noBid != null ? mk.noAsk - mk.noBid : 99 });
      if (!sides.length) continue;
      const s = sides.sort((a, b) => (b.p * 100 - b.price) - (a.p * 100 - a.price))[0];
      if (mk.kind !== "win" && (s.price < 5 || s.price > 95)) continue;   // far-off lines: nothing to learn there
      const wide = s.gap > 6;
      if (wide && opts.hideWide) continue;
      const g = grade(s.p, s.price); if (!g) continue;
      let label, market, kindLabel;
      if (mk.kind === "win") { label = name(mk.team) + " to win"; market = full(mk.team) + " ML"; kindLabel = "Winner"; }
      else if (mk.kind === "spread") {
        const n = Math.ceil(mk.line);
        if (s.side === "yes") { label = name(mk.team) + " win by " + n + "+ (−" + mk.line + ")"; market = full(mk.team) + " -" + mk.line; }
        else { label = name(other(mk.team)) + " +" + mk.line + " (" + name(mk.team) + " don't win by " + n + "+)"; market = full(other(mk.team)) + " +" + mk.line; }
        kindLabel = "Run line";
      } else {
        label = (s.side === "yes" ? "Over " : "Under ") + mk.line + " runs"; market = (s.side === "yes" ? "Over " : "Under ") + mk.line + " Total"; kindLabel = "Total runs";
      }
      rows.push({ ticker: mk.ticker, side: s.side, price: s.price, chance: s.p * 100, edge: g.edge, g, wide, kind: mk.kind, kindLabel, line: mk.line, label, market,
        sub: "Kalshi " + mk.ticker + " · buy " + s.side.toUpperCase() + " at " + s.price + "¢" });
    }
    return rows;
  }
  root.MLBKX = { SERIES, cents, eventKey, parseEventKey, getJSON, fetchMarkets, indexByEvent, matchGame, parseMarket, probsFromAgg, modelYes, priceGame };
})(typeof window !== "undefined" ? window : globalThis);
</script>

<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;
const UI = window.SharpUI;

// Colors come from css/sharp.css tokens so both themes follow
const T = {
  bg:"var(--bg)", card:"var(--surface)", border:"var(--line)", text:"var(--text)", muted:"var(--muted)",
  green:"var(--pos)", red:"var(--neg)", away:"var(--series-b)", home:"var(--series-a)",
};

// ════════════════════════════════════════════════════════════════════════════════
// LAYER 1 — TEAM PARAMETERS
// wRC+: Weighted Runs Created Plus (league avg=100, higher=better offense)
// teamFIP: team rotation FIP (lower=better pitching) — 2025 season averages
// bullpenERA: relievers ERA
// parkFactor: run scoring multiplier vs league avg (1.0=neutral, >1=hitter friendly)
// ════════════════════════════════════════════════════════════════════════════════
const TEAM_PARAMS = {
  "Arizona Diamondbacks":   { wrc:105, teamFIP:3.82, bullpenERA:3.90, pf:0.98, abbr:"ARI" },
  "Atlanta Braves":         { wrc:112, teamFIP:3.65, bullpenERA:3.55, pf:1.00, abbr:"ATL" },

  "Houston Astros":         { wrc:107, teamFIP:3.55, bullpenERA:3.45, pf:1.00, abbr:"HOU" },
  "Kansas City Royals":     { wrc:96,  teamFIP:4.15, bullpenERA:4.00, pf:1.01, abbr:"KC"  },
  "Los Angeles Angels":     { wrc:94,  teamFIP:4.40, bullpenERA:4.50, pf:1.00, abbr:"LAA" },
  "Los Angeles Dodgers":    { wrc:118, teamFIP:3.40, bullpenERA:3.30, pf:0.97, abbr:"LAD" },
  "Miami Marlins":          { wrc:86,  teamFIP:4.55, bullpenERA:4.60, pf:0.95, abbr:"MIA" },

  "Minnesota Twins":        { wrc:101, teamFIP:4.00, bullpenERA:3.85, pf:1.01, abbr:"MIN" },
  "New York Mets":          { wrc:106, teamFIP:3.70, bullpenERA:3.60, pf:1.02, abbr:"NYM" },
  "New York Yankees":       { wrc:110, teamFIP:3.60, bullpenERA:3.50, pf:1.03, abbr:"NYY" },
  "Oakland Athletics":      { wrc:88,  teamFIP:4.70, bullpenERA:4.80, pf:0.96, abbr:"OAK" },
  "Philadelphia Phillies":  { wrc:113, teamFIP:3.62, bullpenERA:3.55, pf:1.02, abbr:"PHI" },
  "Pittsburgh Pirates":     { wrc:90,  teamFIP:4.45, bullpenERA:4.55, pf:0.98, abbr:"PIT" },
  "San Diego Padres":       { wrc:104, teamFIP:3.75, bullpenERA:3.65, pf:0.94, abbr:"SD"  },
  "San Francisco Giants":   { wrc:97,  teamFIP:4.00, bullpenERA:3.90, pf:0.90, abbr:"SF"  },
  "Seattle Mariners":       { wrc:96,  teamFIP:3.50, bullpenERA:3.40, pf:0.79, abbr:"SEA" },

  "Texas Rangers":          { wrc:103, teamFIP:3.90, bullpenERA:3.80, pf:1.04, abbr:"TEX" },
  "Toronto Blue Jays":      { wrc:102, teamFIP:3.95, bullpenERA:3.85, pf:1.00, abbr:"TOR" },
  "Washington Nationals":   { wrc:91,  teamFIP:4.50, bullpenERA:4.60, pf:1.01, abbr:"WSH" },
};
const TEAM_NAMES = Object.keys(TEAM_PARAMS).sort();

// ════════════════════════════════════════════════════════════════════════════════
// LAYER 2 — MARKOV CHAIN BASE-OUT STATE TABLE
// 24 states: 8 base configs × 3 out counts
// runExpectancy[baseState][outs] = avg runs expected to score rest of inning
// Values from 2024 MLB run expectancy matrix
// ════════════════════════════════════════════════════════════════════════════════
const RE = {
  // [bases: "000","100","010","001","110","101","011","111"][outs 0,1,2]
  "000": [0.544, 0.297, 0.117],
  "100": [0.953, 0.573, 0.251],
  "010": [1.189, 0.725, 0.344],
  "001": [1.482, 0.983, 0.387],
  "110": [1.573, 0.971, 0.460],
  "101": [1.904, 1.243, 0.538],
  "011": [2.052, 1.467, 0.621],
  "111": [2.417, 1.650, 0.820],
};

// ════════════════════════════════════════════════════════════════════════════════
// LAYER 3 — PLATE APPEARANCE OUTCOME PROBABILITIES
// Driven by pitcher FIP and batter wRC+
// League average: BB%=8.5, K%=23, 1B%=15, 2B%=4.5, 3B%=0.5, HR%=3.5, Out%=45
// wRC+ and FIP shift these proportionally
// ════════════════════════════════════════════════════════════════════════════════
const LG_AVG_RUNS_PER_GAME = 4.50; // 2025 MLB average

function pitcherRunsPerNine(fip) {
  // Convert FIP to expected R/9 with regression to mean
  return fip * 0.92 + 0.3;
}

function teamRunsPerGame(wrc, oppFIP, parkFactor) {
  // Base: wRC+ scales linearly around 100 = LG_AVG
  const offFactor = wrc / 100;
  const pitchFactor = 4.50 / pitcherRunsPerNine(oppFIP);
  return LG_AVG_RUNS_PER_GAME * offFactor * pitchFactor * parkFactor * 0.5;
  // * 0.5 because park factor is shared between teams
}

function paOutcomes(batter_wrc, pitcher_fip) {
  // Base league average rates
  const lg = { bb:0.085, k:0.230, h1b:0.150, h2b:0.045, h3b:0.005, hr:0.035 };
  // wRC+ modifier (batter strength vs 100 average)
  const offMod = batter_wrc / 100;
  // FIP modifier: lower FIP = harder pitcher
  // League avg FIP ~4.20; each 0.5 below = ~5% better outcomes for pitcher
  const pitchMod = pitcher_fip / 4.20;

  const bb  = Math.min(0.18, Math.max(0.03, lg.bb  * offMod * pitchMod));
  const k   = Math.min(0.40, Math.max(0.10, lg.k   * (1/offMod) * (1/pitchMod)));
  const hr  = Math.min(0.08, Math.max(0.005,lg.hr  * offMod * (2 - pitchMod)));
  const h2b = Math.min(0.07, Math.max(0.01, lg.h2b * offMod * pitchMod));
  const h3b = Math.min(0.015,Math.max(0.001,lg.h3b * offMod));
  const h1b = Math.min(0.22, Math.max(0.05, lg.h1b * offMod * pitchMod));
  const out = Math.max(0.15, 1 - bb - k - hr - h2b - h3b - h1b);

  return { bb, k, hr, h2b, h3b, h1b, out };
}

// ════════════════════════════════════════════════════════════════════════════════
// LAYER 4 — MARKOV CHAIN HALF-INNING SIMULATOR
// Simulates one half-inning through base-out states until 3 outs
// Returns runs scored this half-inning
// ════════════════════════════════════════════════════════════════════════════════
function rand() { return Math.random(); }

function simulateHalfInning(outcomes) {
  let outs = 0;
  let bases = [0, 0, 0]; // [1B, 2B, 3B]
  let runs = 0;

  while (outs < 3) {
    const r = rand();
    let cum = 0;

    if (r < (cum += outcomes.bb)) {
      // Walk: advance all forced, batter to 1B
      if (bases[0] && bases[1] && bases[2]) { runs++; }
      else if (bases[0] && bases[1]) { bases[2] = 1; }
      else if (bases[0]) { bases[1] = 1; }
      bases[0] = 1;
    } else if (r < (cum += outcomes.k)) {
      outs++;
    } else if (r < (cum += outcomes.hr)) {
      runs += 1 + bases[0] + bases[1] + bases[2];
      bases = [0, 0, 0];
    } else if (r < (cum += outcomes.h2b)) {
      runs += bases[2] + bases[1];
      bases[2] = bases[0];
      bases[1] = 1;
      bases[0] = 0;
    } else if (r < (cum += outcomes.h3b)) {
      runs += bases[2] + bases[1] + bases[0];
      bases = [0, 0, 1];
    } else if (r < (cum += outcomes.h1b)) {
      runs += bases[2];
      bases[2] = bases[1];
      bases[1] = bases[0];
      bases[0] = 1;
    } else {
      // Out — approx: 70% groundout (may advance), 30% flyout
      if (rand() < 0.12 && outs < 2 && bases[2]) {
        runs++;
        bases[2] = 0;
      } else if (rand() < 0.15 && bases[0]) {
        bases[1] = Math.max(bases[1], bases[0]);
        bases[0] = 0;
      }
      outs++;
    }
  }
  return runs;
}

// ════════════════════════════════════════════════════════════════════════════════
// LAYER 5 — FULL GAME SIMULATOR
// 9 innings (+ extras), starter exit after N innings, bullpen takes over
// ════════════════════════════════════════════════════════════════════════════════
function simulateGame(homeParams, awayParams, starterInnings = 5) {
  // starterInnings: expected innings for starting pitcher (F5 context)
  const homeOff = paOutcomes(homeParams.wrc, awayParams.teamFIP);
  const awayOff = paOutcomes(awayParams.wrc, homeParams.teamFIP);
  // Bullpen outcomes — worse than starter
  const homeBullpen = paOutcomes(homeParams.wrc, awayParams.bullpenERA);
  const awayBullpen = paOutcomes(awayParams.wrc, homeParams.bullpenERA);

  let homeRuns = 0, awayRuns = 0;
  let homeByInning = [], awayByInning = [];

  const innings = 9;
  for (let inn = 1; inn <= innings; inn++) {
    const awayUsesBullpen = inn > starterInnings;
    const homeUsesBullpen = inn > starterInnings;

    const awayInningOff = awayUsesBullpen ? awayBullpen : awayOff;
    const homeInningOff = homeUsesBullpen ? homeBullpen : homeOff;

    const awayR = simulateHalfInning(awayInningOff);
    let homeR = simulateHalfInning(homeInningOff);

    // Walk-off: if bottom 9+ and home team walks it off
    if (inn >= 9 && homeRuns + homeR > awayRuns + awayR) {
      homeRuns += homeR;
      awayRuns += awayR;
      homeByInning.push(homeR);
      awayByInning.push(awayR);
      break;
    }

    homeRuns += homeR;
    awayRuns += awayR;
    homeByInning.push(homeR);
    awayByInning.push(awayR);
  }

  // Extra innings if tied after 9
  let extraInnings = 0;
  while (homeRuns === awayRuns && extraInnings < 3) {
    extraInnings++;
    // Extra inning rule: ghost runner on 2B
    const awayExtra = simulateHalfInningWithRunner(awayBullpen);
    const homeExtra = simulateHalfInningWithRunner(homeBullpen);
    awayRuns += awayExtra;
    homeRuns += homeExtra;
  }

  const f5HomeRuns = homeByInning.slice(0, 5).reduce((a,b)=>a+b,0);
  const f5AwayRuns = awayByInning.slice(0, 5).reduce((a,b)=>a+b,0);
  const nrfi = homeByInning[0] === 0 && awayByInning[0] === 0;

  return {
    homeRuns, awayRuns,
    winner: homeRuns > awayRuns ? "home" : "away",
    total: homeRuns + awayRuns,
    f5Home: f5HomeRuns, f5Away: f5AwayRuns,
    f5Total: f5HomeRuns + f5AwayRuns,
    f5Winner: f5HomeRuns > f5AwayRuns ? "home" : f5AwayRuns > f5HomeRuns ? "away" : "push",
    nrfi,
    homeByInning, awayByInning,
  };
}

function simulateHalfInningWithRunner(outcomes) {
  // Ghost runner starts on 2B
  let outs = 0;
  let bases = [0, 1, 0]; // runner on 2B
  let runs = 0;
  while (outs < 3) {
    const r = rand();
    let cum = 0;
    if (r < (cum += outcomes.bb)) {
      if (bases[0] && bases[1]) { bases[2] = 1; }
      else if (bases[0]) { bases[1] = 1; }
      bases[0] = 1;
    } else if (r < (cum += outcomes.k)) {
      outs++;
    } else if (r < (cum += outcomes.hr)) {
      runs += 1 + bases[0] + bases[1] + bases[2];
      bases = [0,0,0];
    } else if (r < (cum += outcomes.h2b)) {
      runs += bases[2] + bases[1];
      bases[2] = bases[0]; bases[1] = 1; bases[0] = 0;
    } else if (r < (cum += outcomes.h3b)) {
      runs += bases[2] + bases[1] + bases[0];
      bases = [0,0,1];
    } else if (r < (cum += outcomes.h1b)) {
      runs += bases[2];
      bases[2] = bases[1]; bases[1] = bases[0]; bases[0] = 1;
    } else {
      if (rand() < 0.12 && outs < 2 && bases[2]) { runs++; bases[2] = 0; }
      outs++;
    }
  }
  return runs;
}

// ════════════════════════════════════════════════════════════════════════════════
// MONTE CARLO — runs N simulations, returns aggregate stats
// ════════════════════════════════════════════════════════════════════════════════
function runMLBSim(homeTeam, awayTeam, n = 100000) {
  const hp = TEAM_PARAMS[homeTeam];
  const ap = TEAM_PARAMS[awayTeam];
  if (!hp || !ap) return null;

  // Park factor: use home team's park
  const pf = hp.pf;
  // Scale wRC+ by park factor for this game
  const hAdj = { ...hp, wrc: hp.wrc * pf, pf: 1.0 };
  const aAdj = { ...ap, wrc: ap.wrc * pf, pf: 1.0 };

  const results = [];
  for (let i = 0; i < n; i++) {
    results.push(simulateGame(hAdj, aAdj));
  }
  return aggregateMLB(homeTeam, awayTeam, results, hp, ap, n);
}

function aggregateMLB(homeTeam, awayTeam, results, hp, ap, n) {
  const fmt = (v, d=2) => typeof v === "number" ? v.toFixed(d) : v;
  const avg = arr => arr.reduce((a,b)=>a+b,0)/arr.length;
  const pct = (arr, fn) => (arr.filter(fn).length / arr.length * 100).toFixed(1);

  const hWins = results.filter(r=>r.winner==="home").length;
  const aWins = results.filter(r=>r.winner==="away").length;

  const totals = results.map(r=>r.total);
  const avgTotal = avg(totals);
  const avgHome  = avg(results.map(r=>r.homeRuns));
  const avgAway  = avg(results.map(r=>r.awayRuns));

  // Run line (1.5)
  const hRLCover = results.filter(r=>r.homeRuns - r.awayRuns >= 2).length;
  const aRLCover = results.filter(r=>r.awayRuns - r.homeRuns >= 2).length;

  // Totals
  const over75 = results.filter(r=>r.total > 7.5).length;
  const over85 = results.filter(r=>r.total > 8.5).length;
  const over95 = results.filter(r=>r.total > 9.5).length;
  const under75 = results.filter(r=>r.total < 7.5).length;
  const under85 = results.filter(r=>r.total < 8.5).length;

  // F5
  const f5Wins = results.filter(r=>r.f5Winner==="home").length;
  const f5Losses = results.filter(r=>r.f5Winner==="away").length;
  const f5Push = results.filter(r=>r.f5Winner==="push").length;
  const avgF5Total = avg(results.map(r=>r.f5Total));
  const f5Over35 = results.filter(r=>r.f5Total > 3.5).length;
  const f5Over45 = results.filter(r=>r.f5Total > 4.5).length;
  const f5Over25 = results.filter(r=>r.f5Total > 2.5).length;

  // NRFI / YRFI
  const nrfi = results.filter(r=>r.nrfi).length;

  // Score distribution
  const scoreFreq = {};
  results.forEach(r=>{
    const k = r.awayRuns + "-" + r.homeRuns;
    scoreFreq[k] = (scoreFreq[k]||0)+1;
  });
  const topScores = Object.entries(scoreFreq).sort((a,b)=>b[1]-a[1]).slice(0,8)
    .map(([score,count])=>({ score, count, pct:((count/n)*100).toFixed(1) }));

  const [mls] = Object.entries(scoreFreq).sort((a,b)=>b[1]-a[1])[0];

  // Full run distributions so any Kalshi line (total over X, team wins by over X) can be priced
  const MAX_TOTAL = 40, MARGIN_OFF = 30;
  const totalDist = new Array(MAX_TOTAL + 1).fill(0), marginDist = new Array(2 * MARGIN_OFF + 1).fill(0);
  results.forEach(r => {
    totalDist[Math.min(r.total, MAX_TOTAL)] += 1 / n;
    marginDist[Math.max(0, Math.min(2 * MARGIN_OFF, r.homeRuns - r.awayRuns + MARGIN_OFF))] += 1 / n;
  });

  // Shutout / combined shutout
  const homeShutout = results.filter(r=>r.awayRuns===0).length;
  const awayShutout = results.filter(r=>r.homeRuns===0).length;

  return {
    n, homeTeam, awayTeam, hp, ap,
    hWins, aWins,
    hWPct: fmt((hWins/n)*100,1), aWPct: fmt((aWins/n)*100,1),
    mls, mlsPct: fmt((scoreFreq[mls]/n)*100,1),
    avgHome: fmt(avgHome), avgAway: fmt(avgAway), avgTotal: fmt(avgTotal),
    hRLPct: fmt((hRLCover/n)*100,1), aRLPct: fmt((aRLCover/n)*100,1),
    over75Pct: fmt((over75/n)*100,1), over85Pct: fmt((over85/n)*100,1),
    over95Pct: fmt((over95/n)*100,1),
    under75Pct: fmt((under75/n)*100,1), under85Pct: fmt((under85/n)*100,1),
    f5HomePct: fmt((f5Wins/n)*100,1), f5AwayPct: fmt((f5Losses/n)*100,1),
    f5PushPct: fmt((f5Push/n)*100,1),
    avgF5Total: fmt(avgF5Total),
    f5Over25Pct: fmt((f5Over25/n)*100,1),
    f5Over35Pct: fmt((f5Over35/n)*100,1),
    f5Over45Pct: fmt((f5Over45/n)*100,1),
    nrfiPct: fmt((nrfi/n)*100,1), yrfiPct: fmt(((n-nrfi)/n)*100,1),
    homeShutoutPct: fmt((homeShutout/n)*100,1),
    awayShutoutPct: fmt((awayShutout/n)*100,1),
    topScores,
    totalDist, marginDist, marginOffset: MARGIN_OFF,
  };
}

// SCHEDULE — ESPN's free scoreboard (today's games, Eastern date)
// ════════════════════════════════════════════════════════════════════════════════
const SB = window.SharpBets;
const KX = window.MLBKX;
const { GradeBadge, GradeLegend, BetButton, SortTh, sortRows, RecordCard } = SB;

function formatAge(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  return hrs + "h " + (mins % 60) + "m ago";
}

// Team codes where ESPN or Kalshi differ from the model's abbreviation
const CODE_FIX = {
  "Arizona Diamondbacks": { kx:"AZ" },
  "Chicago White Sox":    { espn:"CHW" },
  "Oakland Athletics":    { espn:"ATH", kx:"ATH", short:"A's" },
};
const kxCode = (team) => (CODE_FIX[team] && CODE_FIX[team].kx) || (TEAM_PARAMS[team] && TEAM_PARAMS[team].abbr);
const ESPN_TO_TEAM = {};
TEAM_NAMES.forEach(t => { ESPN_TO_TEAM[(CODE_FIX[t] && CODE_FIX[t].espn) || TEAM_PARAMS[t].abbr] = t; });

const ET = "America/New_York";
const etDateOf = (d) => new Date(d).toLocaleDateString("en-CA", { timeZone: ET });
function etMinsOf(d) {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: ET, hour: "2-digit", minute: "2-digit", hourCycle: "h23" }).formatToParts(new Date(d));
  const v = (k) => +(p.find(x => x.type === k) || {}).value;
  return v("hour") * 60 + v("minute");
}

async function fetchMLBGames() {
  const today = etDateOf(Date.now());
  const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard?dates=" + today.replace(/-/g, ""));
  if (!res.ok) throw new Error("ESPN schedule error: " + res.status);
  const data = await res.json();
  return (data.events || []).map(e => {
    const c = (e.competitions || [])[0] || {};
    const side = (ha) => (c.competitors || []).find(x => x.homeAway === ha) || {};
    const h = side("home"), a = side("away");
    const ht = h.team || {}, at = a.team || {};
    const homeTeam = ESPN_TO_TEAM[ht.abbreviation] || ht.displayName, awayTeam = ESPN_TO_TEAM[at.abbreviation] || at.displayName;
    const shortOf = (team, espnTeam) => (CODE_FIX[team] && CODE_FIX[team].short) || espnTeam.name || team;
    return {
      id: e.id, homeTeam, awayTeam, commenceTime: e.date,
      state: (e.status && e.status.type && e.status.type.state) || "pre",
      statusText: (e.status && e.status.type && e.status.type.shortDetail) || "",
      // for Kalshi matching / labels
      home: homeTeam, away: awayTeam, homeShort: shortOf(homeTeam, ht), awayShort: shortOf(awayTeam, at),
      homeKx: kxCode(homeTeam), awayKx: kxCode(awayTeam), etDate: etDateOf(e.date), etMins: etMinsOf(e.date),
    };
  }).filter(g => g.state !== "post");
}

// ════════════════════════════════════════════════════════════════════════════════
// KALSHI PRICES → GRADED BETS
// ════════════════════════════════════════════════════════════════════════════════
// kx: { status: "loading"|"ok"|"down", idx, ts, error }
function gamePicks(game, agg, kx, settings) {
  if (!kx || kx.status !== "ok" || !agg) return { ev: null, rows: [] };
  const ev = KX.matchGame(game, kx.idx);
  const pr = KX.probsFromAgg(agg);
  const rows = KX.priceGame(game, ev, pr, (p, price) => SB.grade(p, price, settings), { hideWide: settings.hideWide })
    .map(r => ({ ...r, stake: SB.stake(r.g, "mlb", settings), gameId: game.id, gameDate: game.etDate, game, matchup: game.awayShort + " @ " + game.homeShort }));
  return { ev, rows };
}
const gradeSortGet = (r, k) => k === "grade" ? -r.g.rank : k === "game" ? r.matchup : r[k];
const betPick = (r) => ({ ticker: r.ticker, side: r.side, price: r.price, chance: r.chance, label: r.label, sub: r.matchup + " · " + r.sub, sport: "mlb", grade: r.g });

const startTime = (g) => new Date(g.commenceTime).toLocaleString([], { weekday:"short", hour:"numeric", minute:"2-digit" });
const abbrOf = (team) => (TEAM_PARAMS[team] && TEAM_PARAMS[team].abbr) || String(team || "").split(" ").pop();
const pctTxt = (p, d) => (p * 100).toFixed(d == null ? 0 : d) + "%";
// MLB is off from early November until spring training; Opening Day is late March
const offSeason = () => { const m = new Date().getMonth(); return m >= 10 || m <= 1; };

function Empty({ ico, title, children }) {
  return (
    <div className="card empty">
      {ico && <div className="ico" aria-hidden="true">{ico}</div>}
      <div className="t">{title}</div>
      {children && <div className="d">{children}</div>}
    </div>
  );
}
// Friendly empty state for a day without games
function NoGames() {
  return offSeason()
    ? <Empty ico="⚾" title="It's the MLB off-season">No games until spring. Picks come back with the regular season in late March, simulated and graded against Kalshi's prices every game day.</Empty>
    : <Empty ico="⚾" title="No MLB games today">Picks show up here on game days, simulated and graded against Kalshi's prices. Check back tomorrow.</Empty>;
}

function KalshiNote({ kx, ev, hasAgg }) {
  if (!kx || kx.status === "loading") return <UI.Status>Loading Kalshi prices…</UI.Status>;
  if (kx.status === "down") return <div className="note warn">Kalshi prices couldn't be loaded{kx.error ? " (" + kx.error + ")" : ""}. Model chances are shown without grades. Try Refresh.</div>;
  if (!ev) return <div className="note">Kalshi has no markets open for this game yet.</div>;
  if (!hasAgg) return <UI.Status>Running the simulation…</UI.Status>;
  return null;
}

// One graded Kalshi bet as a compact row (title, chance bar vs price, bet button)
function BetRow({ r, showGame }) {
  return <UI.PickRow g={r.g} title={r.label} badge={r.g.rank <= 2}
    meta={showGame ? r.matchup + " · " + startTime(r.game) : r.kindLabel + (r.stake ? " · suggested " + SB.money(r.stake) : "")}
    note={r.wide ? "wide quote, price may not be real" : null} dim={r.wide}
    pick={r.g.edge > 0 ? betPick(r) : null} />;
}
function BetCard({ r, top }) {
  return <UI.PickCard g={r.g} top={top} title={r.label} meaning={r.kindLabel + (r.g.longShot ? " · long shot" : "") + (r.wide ? " · wide quote" : "")}
    when={startTime(r.game)} meta={r.game.awayTeam + " @ " + r.game.homeTeam} pick={betPick(r)} />;
}

// Win chances as one split bar: away on the left, home on the right
function WinSplit({ game, agg }) {
  const a = agg.aWins / agg.n * 100, hm = agg.hWins / agg.n * 100, t = Math.max(0, 100 - a - hm);
  const aw = abbrOf(game.awayTeam), hw = abbrOf(game.homeTeam);
  return (
    <div>
      <div className="row" style={{ justifyContent:"space-between", marginBottom:6 }}>
        <div><div className="num" style={{ fontSize:22, fontWeight:700 }}>{a.toFixed(0)}%</div><div className="tiny muted">{aw} win</div></div>
        <div style={{ textAlign:"right" }}><div className="num" style={{ fontSize:22, fontWeight:700 }}>{hm.toFixed(0)}%</div><div className="tiny muted">{hw} win</div></div>
      </div>
      <div role="img" aria-label={`${aw} ${a.toFixed(0)}%, ${hw} ${hm.toFixed(0)}%`} style={{ display:"flex", gap:2, height:10 }}>
        <div style={{ width:a + "%", background:T.away, borderRadius:"999px 0 0 999px" }} />
        {t > 0.4 && <div style={{ width:t + "%", background:"var(--faint)" }} title={`Still tied after 12 innings ${t.toFixed(1)}%`} />}
        <div style={{ width:hm + "%", background:T.home, borderRadius:"0 999px 999px 0" }} />
      </div>
    </div>
  );
}

// How the simulated games end: total runs, or the final run margin
function OutcomeChart({ game, agg }) {
  const [mode, setMode] = useState("total");
  if (!agg.totalDist || !agg.marginDist) return null;
  const aw = abbrOf(game.awayTeam), hw = abbrOf(game.homeTeam);
  let bars, labelOf, blurb, legend = null;
  if (mode === "total") {
    let hi = agg.totalDist.length - 1; while (hi > 8 && agg.totalDist[hi] < 0.003) hi--;
    bars = agg.totalDist.slice(0, hi + 1).map((p, k) => ({ v:p * 100, color:T.home, k, tip:`${k} run${k === 1 ? "" : "s"}: ${(p * 100).toFixed(1)}%` }));
    labelOf = (i, b) => b.k % 2 === 0 ? b.k : null;
    blurb = `Total runs across every simulated game. Average ${agg.avgTotal}.`;
  } else {
    const off = agg.marginOffset, M = 10;
    bars = [];
    for (let m = -M; m <= M; m++) {
      const p = agg.marginDist[m + off] || 0;
      if (m === 0 && p < 0.001) continue;
      const one = Math.abs(m) === 1;
      bars.push({ v:p * 100, m, strong:one, dim:!one && m !== 0, color:m > 0 ? T.home : m < 0 ? T.away : "var(--faint)",
        tip:m === 0 ? `Tied after extras: ${(p * 100).toFixed(1)}%` : `${m > 0 ? hw : aw} by ${Math.abs(m)}: ${(p * 100).toFixed(1)}%` });
    }
    labelOf = (i, b) => [1, 3, 5, 10].includes(Math.abs(b.m)) ? Math.abs(b.m) : null;
    blurb = "Final margin across every simulated game. The bright bars are one-run games: the 1.5-run line is won or lost there.";
    legend = <div className="legend"><span><i style={{ background:T.away }} />{aw} wins by</span><span><i style={{ background:T.home }} />{hw} wins by</span></div>;
  }
  return (
    <div className="card" style={{ marginBottom:12 }}>
      <div className="row" style={{ marginBottom:4, flexWrap:"wrap" }}>
        <div style={{ fontWeight:650, flex:1 }}>How the game ends</div>
        <UI.Seg options={[["total", "Total runs"], ["margin", "Run margin"]]} value={mode} onChange={setMode} />
      </div>
      <div className="small text-2" style={{ marginBottom:10 }}>{blurb}</div>
      <UI.BarChart bars={bars} height={140} yFmt={v => v + "%"} ariaLabel={mode === "total" ? "Total runs distribution" : "Run margin distribution"} labelOf={labelOf} />
      {legend}
    </div>
  );
}

          <span className="small muted">Sort by</span>
          <UI.Seg options={[["edge", "Best edge"], ["chance", "Most likely"], ["price", "Cheapest"]]} value={sort.k} onChange={k => setSort({ k, dir:k === "price" ? 1 : -1 })} />
        </div>
        <UI.PickList>{sorted.map(r => <BetRow key={r.ticker + r.side} r={r} />)}</UI.PickList>
      </> : <KalshiNote kx={kx} ev={ev} hasAgg={!!agg} />}
      {rows.length === 0 && kx && kx.status === "ok" && ev && agg && (
        <div className="note">Kalshi has this game, but no market has a usable price right now{settings.hideWide ? " (markets with wide buy/sell gaps are hidden in Settings)" : ""}.</div>
      )}

      {agg && <>
        <UI.H2>Likeliest final scores</UI.H2>
        <div className="card">
          <div className="tiny muted" style={{ marginBottom:4 }}>{aw}–{hw}</div>
          {agg.topScores.map(({ score, pct }) => (
            <div key={score} className="score-row">
              <span style={{ fontWeight:600 }}>{score}</span>
              <span className="bar"><i style={{ width:Math.min(100, parseFloat(pct) / parseFloat(agg.topScores[0].pct) * 100) + "%" }} /></span>
              <span className="muted" style={{ textAlign:"right" }}>{pct}%</span>
            </div>
          ))}
        </div>

        <UI.H2>More model numbers</UI.H2>
        <div className="card">
          <div className="tiny muted" style={{ marginBottom:6 }}>No Kalshi price for these, so no grade.</div>
          <ModelOnlyRow market={hw + " win by 2+ (−1.5)"} pct={agg.hRLPct}/>
          <ModelOnlyRow market={aw + " win by 2+ (−1.5)"} pct={agg.aRLPct}/>
          <ModelOnlyRow market="Over 7.5 runs" pct={agg.over75Pct}/>
          <ModelOnlyRow market="Over 8.5 runs" pct={agg.over85Pct}/>
          <ModelOnlyRow market="Over 9.5 runs" pct={agg.over95Pct}/>
          <ModelOnlyRow market={hw + " lead after 5 innings"} pct={agg.f5HomePct}/>
          <ModelOnlyRow market={aw + " lead after 5 innings"} pct={agg.f5AwayPct}/>
          <ModelOnlyRow market="No run in the 1st inning" pct={agg.nrfiPct}/>
          <ModelOnlyRow market={hw + " shutout win"} pct={agg.homeShutoutPct}/>
          <ModelOnlyRow market={aw + " shutout win"} pct={agg.awayShutoutPct}/>
        </div>
      </>}

      <UI.H2>Model inputs</UI.H2>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Team</th><th className="r">wRC+</th><th className="r">FIP</th><th className="r">Pen ERA</th><th className="r">Park</th></tr></thead>
          <tbody>
            {[{ t:game.awayTeam, role:"Away", c:T.away }, { t:game.homeTeam, role:"Home", c:T.home }].map(({ t, role, c }) => {
              const p = TEAM_PARAMS[t] || {};
              return (
                <tr key={t}>
                  <td style={{ whiteSpace:"nowrap" }}><span style={{ display:"inline-block", width:8, height:8, borderRadius:2, background:c, marginRight:8 }} /><b>{p.abbr || t}</b> <span className="sub">{role}</span></td>
                  <td className="r">{p.wrc}</td><td className="r">{p.teamFIP}</td><td className="r">{p.bullpenERA}</td><td className="r">{p.pf}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="tiny muted" style={{ marginTop:6 }}>2025 season. wRC+: offense, 100 is average. FIP: the rotation; Pen ERA: the bullpen; lower is better for both. Park above 1.00 favors hitters.</div>

      <details className="explain" style={{ marginTop:14 }}>
        <summary>How the model works</summary>
        <div className="body small text-2" style={{ lineHeight:1.6 }}>
          <p>Every game is played out 100,000 times, one plate appearance at a time, through baseball's 24 base-and-out situations. Each at-bat's chances of a walk, strikeout, hit or home run come from the batting team's wRC+ and the pitching staff's FIP.</p>
          <p style={{ marginTop:8 }}>The starter pitches the first five innings, then the bullpen takes over. The home park's run factor applies to both lineups. Walk-offs and the extra-inning runner on second are built in.</p>
          <p style={{ marginTop:8 }}>Every Kalshi winner, run-line and total-runs market for the game is checked against the simulated scores. Edge is the model's chance minus the price in cents.</p>
        </div>
      </details>
    </div>
  );
}

// Model chances for bets Kalshi doesn't list. No grade without a price.
function ModelOnlyRow({ market, pct }) {
  return <div className="kv"><span className="k">{market}</span><span className="v">{pct}%</span></div>;
}

// ════════════════════════════════════════════════════════════════════════════════
// TOP PICKS TAB — graded Kalshi bets across today's games
// ════════════════════════════════════════════════════════════════════════════════
function TopPicksTab({ allRows, games, simData, kx, loaded }) {
  const simsReady = games.filter(g => simData[g.homeTeam+"|"+g.awayTeam]).length;
  const shown = allRows.filter(r => r.g.edge > 0 && r.g.rank <= 2);
  const best = shown.filter(r => r.g.rank <= 1).sort((a, b) => a.g.rank - b.g.rank || b.edge - a.edge);
  const rest = shown.filter(r => r.g.rank > 1).sort((a, b) => b.edge - a.edge);
  const matched = games.filter(g => kx && kx.status === "ok" && KX.matchGame(g, kx.idx)).length;
  const record = <><UI.H2>Pick record</UI.H2><RecordCard sport="mlb"/></>;

  if (loaded && games.length === 0) return <><NoGames />{record}</>;
  return (
    <div>
      {games.length > 0 && <div className="small muted" style={{ marginBottom:12 }}>
        {simsReady} of {games.length} games simulated · {matched} with Kalshi markets{kx && kx.ts ? " · prices " + formatAge(kx.ts) : ""}
      </div>}
      <GradeLegend sport="mlb"/>
      {kx && kx.status === "down" && <div className="note warn" style={{ marginBottom:12 }}>Kalshi prices couldn't be loaded{kx.error ? " (" + kx.error + ")" : ""}. Grades need a price, so none are shown. Try Refresh.</div>}

      {shown.length > 0 ? <>
        <UI.H2 aside={best.length ? `${best.length} strong or good` : null}>Best bets right now</UI.H2>
        {best.length ? <div className="picks-grid">{best.map((r, i) => <BetCard key={r.ticker + r.side} r={r} top={i === 0} />)}</div>
          : <div className="note">No STRONG or GOOD bets right now. The smaller edges below are close calls: bet small or skip.</div>}
        {rest.length > 0 && <>
          <UI.H2 aside={`${rest.length}`}>Smaller edges</UI.H2>
          <UI.PickList>{rest.map(r => <BetRow key={r.ticker + r.side} r={r} showGame />)}</UI.PickList>
        </>}
      </> : (
        !kx || kx.status === "loading" || !loaded ? <UI.Status>Loading Kalshi prices…</UI.Status>
          : kx.status === "down" ? null
          : matched === 0 ? <Empty title="No Kalshi markets yet">Kalshi hasn't opened markets for today's games. They usually appear a day or so before first pitch.</Empty>
          : simsReady < games.length ? <UI.Status>Waiting for the simulations…</UI.Status>
          : <Empty title="No bets worth making right now">Nothing on today's slate is priced below the model's chance. A bet shows up here once the model beats Kalshi's price.</Empty>
      )}
      {record}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════════
// PARLAY TAB — cross-game combos of STRONG / GOOD picks
// ════════════════════════════════════════════════════════════════════════════════
const PARLAY_SIZE_LABELS = { 2:"2-Leg", 3:"3-Leg", 4:"4-Leg", 5:"5-Leg" };

function parlayLegs(allRows) {
  return allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD").map(r => ({
    matchId: r.gameId, match: r.matchup, market: r.label, prob: r.chance / 100, probPct: r.chance.toFixed(1) + "%",
    price: r.price, ticker: r.ticker, side: r.side, tier: r.g.key, g: r.g,
  }));
}
function buildMLBParlays(legs) {
  if (legs.length === 0) return [];
  function buildCombos(size) {
    const results = [];
    (function combine(start, current) {
      if (current.length === size) { results.push([...current]); return; }
      for (let i = start; i < legs.length; i++) {
        if (!current.some(l => l.matchId === legs[i].matchId)) { current.push(legs[i]); combine(i+1, current); current.pop(); }
      }
    })(0, []);
    return results;
  }
  const parlays = [];
  for (const size of [2,3,4,5]) {
    buildCombos(size)
      .map(combo => ({ legs:combo, size, jointProb:combo.reduce((a,l) => a * l.prob, 1), jointPrice:combo.reduce((a,l) => a * l.price / 100, 1) }))
      .sort((a,b) => b.jointProb - a.jointProb).slice(0,15)
      .forEach(p => parlays.push(p));
  }
  return parlays.sort((a,b) => b.jointProb - a.jointProb);
}

function ParlayCard({ parlay, rank }) {
  const jp = parlay.jointProb;
  return (
    <div className="card parlay">
      <div className="parlay-head">
        <div className="wrap-row">
          <span className="chip" style={rank === 0 ? { background:"var(--text)", color:"var(--bg)" } : null}>#{rank + 1}</span>
          <span className="chip">{parlay.size} legs</span>
        </div>
        <div className="parlay-p"><div className="v">{(jp * 100).toFixed(1)}%</div><div className="tiny muted">chance all legs cash</div></div>
      </div>
      {parlay.legs.map((leg, li) => (
        <div key={li} className="leg">
          <div style={{ minWidth:0 }}>
            <div className="leg-title">{leg.market}</div>
            <div className="leg-meta"><GradeBadge g={leg.g} small/><span>{leg.match}</span></div>
          </div>
          <div className="leg-p">{(leg.prob * 100).toFixed(0)}%<span className="s">{leg.price}¢</span></div>
          <SB.ChanceBar g={leg.g} compact />
        </div>
      ))}
      <div className="parlay-foot">
        <div><div className="l">Chance to cash</div><div className="v">{(jp * 100).toFixed(1)}%</div></div>
        <div><div className="l">Leg prices multiplied</div><div className="v">{(parlay.jointPrice * 100).toFixed(1)}¢</div></div>
        <div><div className="l">Pays per $1 (fair)</div><div className="v">{SB.money(1 / parlay.jointPrice)}</div></div>
      </div>
    </div>
  );
}

function MLBParlayTab({ allRows, games, loaded }) {
  const [filterSize, setFilterSize] = useState("all");
  const legs = parlayLegs(allRows);
  const parlays = buildMLBParlays(legs);
  const filtered = filterSize==="all" ? parlays : parlays.filter(p=>p.size===parseInt(filterSize));

  if (loaded && games.length === 0) return <NoGames />;
  return (
    <div>
      <div className="note" style={{ marginBottom:12 }}>
        Built only from STRONG and GOOD bets, one per game. Kalshi doesn't sell these as one bet, so place each leg on its own or build it in Kalshi's app.
      </div>

      {legs.length > 0 && <>
        <UI.H2 aside={`${legs.length}`}>Qualifying legs</UI.H2>
        <UI.PickList>
          {legs.map((leg, i) => <UI.PickRow key={i} g={leg.g} title={leg.market} meta={leg.match} badge />)}
        </UI.PickList>
      </>}

      <UI.H2 aside={`${filtered.length} parlay${filtered.length === 1 ? "" : "s"}`}>Parlays</UI.H2>
      <UI.Seg options={[["all", "All"], ["2", "2 legs"], ["3", "3"], ["4", "4"], ["5", "5"]]} value={filterSize} onChange={setFilterSize} />

      {filtered.length === 0 && <div style={{ marginTop:12 }}>
        <Empty title={legs.length < 2 ? "No parlays yet" : "None that size"}>
          {legs.length < 2 ? "A parlay needs STRONG or GOOD bets from at least 2 different games." : "Not enough games with STRONG or GOOD bets for " + filterSize + "-leg parlays."}
        </Empty>
      </div>}

      {filtered.map((parlay, pi) => <ParlayCard key={pi} parlay={parlay} rank={pi} />)}
      {filtered.length > 0 && <div className="tiny muted" style={{ marginTop:12 }}>Legs from different games are treated as independent. "Leg prices multiplied" is what the parlay would cost per $1 if each leg were bought at today's Kalshi price.</div>}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════════
// MAIN APP
// ════════════════════════════════════════════════════════════════════════════════
function App() {
  const settings = SB.useSettings();
  const [games, setGames]   = useState([]);
  const [loading, setLoading] = useState(false);
  const [loaded, setLoaded] = useState(false);
  const [error, setError]   = useState("");
  const [activeTab, setActiveTab] = useState("top_picks");
  const SIM_CACHE_KEY = "sharp_sim_cache_mlb2_" + new Date().toLocaleDateString("en-CA");
  const [simData, setSimData] = useState(() => {
    try { return JSON.parse(localStorage.getItem(SIM_CACHE_KEY) || "{}"); } catch(e) { return {}; }
  });
  const [runningId, setRunningId] = useState(null);
  const [runCounts, setRunCounts] = useState({});
  const [kx, setKx] = useState({ status:"loading" });
  const autoRanRef = useRef(false);

  async function loadKalshi() {
    try {
      const markets = await KX.fetchMarkets("open");
      setKx({ status:"ok", idx: KX.indexByEvent(markets), ts: Date.now(), count: markets.length });
    } catch (e) {
      setKx(prev => prev.status === "ok" ? { ...prev, stale: true } : { status:"down", error: e.message });
    }
  }

  useEffect(() => { loadGames(); loadKalshi(); }, []);
  // Kalshi prices move; refresh them every 2 minutes while there are games to price
  useEffect(() => {
    if (!games.length) return;
    const t = setInterval(loadKalshi, 120000);
    return () => clearInterval(t);
  }, [games.length]);

  // Every graded Kalshi bet across today's games
  const allRows = [];
  games.forEach(g => { gamePicks(g, simData[g.homeTeam+"|"+g.awayTeam], kx, settings).rows.forEach(r => allRows.push(r)); });
  const strongGood = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD");
  const pickSig = strongGood.map(r => r.ticker + "|" + r.side + "|" + r.g.key).sort().join(",");

  // Add STRONG / GOOD picks to the shared record (deduped by ticker+side in SharpBets)
  useEffect(() => {
    if (!strongGood.length) return;
    SB.logPicks(strongGood.map(r => ({ sport:"mlb", gameId:r.gameId, gameDate:r.gameDate, home:r.game.homeTeam, away:r.game.awayTeam,
      market:r.market, ticker:r.ticker, side:r.side, chance:r.chance, price:r.price, tier:r.g.key })));
  }, [pickSig]);

  // Write parlay legs for the cross-sport parlay page (STRONG / GOOD only)
  useEffect(() => {
    const legs = parlayLegs(allRows).map(({ g, ...l }) => ({ ...l, sport:"MLB" }));
    try { localStorage.setItem("sharp_xsport_legs_mlb_" + new Date().toLocaleDateString("en-CA"), JSON.stringify({ legs, ts: Date.now() })); } catch(e) {}
  }, [pickSig]);

  // Auto-sim all games sequentially once games are loaded; skip cached results
  useEffect(() => {
    if (!games.length || autoRanRef.current) return;
    autoRanRef.current = true;
    const cached = (() => { try { return JSON.parse(localStorage.getItem(SIM_CACHE_KEY) || "{}"); } catch(e) { return {}; } })();
    const needsSim = games.filter(g => {
      const key = g.homeTeam + "|" + g.awayTeam;
      return (!TEAM_PARAMS[g.homeTeam] || !TEAM_PARAMS[g.awayTeam]) ? false : !cached[key];
    });
    if (!needsSim.length) return;
    let idx = 0;
    function runNext() {
      if (idx >= needsSim.length) return;
      const game = needsSim[idx++];
      const key = game.homeTeam + "|" + game.awayTeam;
      setRunningId(key);
      setTimeout(() => {
        const result = runMLBSim(game.homeTeam, game.awayTeam);
        if (result) {
          setSimData(prev => {
            const next = { ...prev, [key]: result };
            try { localStorage.setItem(SIM_CACHE_KEY, JSON.stringify(next)); } catch(e) {}
            return next;
          });
          setRunCounts(prev => ({ ...prev, [key]: 1 }));
        }
        setRunningId(null);
        setTimeout(runNext, 30);
      }, 50);
    }
    setTimeout(runNext, 200);
  }, [games]);

  async function loadGames() {
    setLoading(true); setError("");
    try { setGames(await fetchMLBGames()); }
    catch(e) { setError(e.message); }
    setLoading(false); setLoaded(true);
  }

  const isSpecialTab = activeTab === "top_picks" || activeTab === "parlays";
  const activeGameIdx = activeTab.startsWith("game_") ? parseInt(activeTab.split("_")[1]) : 0;
  const activeGame = isSpecialTab ? null : games[activeGameIdx];
  const gameKey = activeGame ? activeGame.homeTeam+"|"+activeGame.awayTeam : null;

  function runSim(game) {
    const g = game || activeGame;
    if (!g || runningId) return;
    const key = g.homeTeam+"|"+g.awayTeam;
    setRunningId(key);
    setTimeout(() => {
      const result = runMLBSim(g.homeTeam, g.awayTeam);
      if (result) {
        setSimData(prev => ({ ...prev, [key]: result }));
        setRunCounts(prev => ({ ...prev, [key]: (prev[key]||0)+1 }));
      }
      setRunningId(null);
    }, 50);
  }

  useEffect(() => {
    if (gameKey && !simData[gameKey] && !runningId && activeGame && TEAM_PARAMS[activeGame.homeTeam] && TEAM_PARAMS[activeGame.awayTeam]) {
      runSim(activeGame);
    }
  }, [gameKey, activeTab]);

  const simsLoaded = games.filter(g => simData[g.homeTeam+"|"+g.awayTeam]).length;
  const allSimsReady = games.length > 0 && simsLoaded === games.length;
  const busy = loading || !!runningId;

  const tabs = [
    ["top_picks", "Top picks", strongGood.length > 0 ? { count:strongGood.length } : null],
    ["parlays", "Parlays"],
    ...games.map((g, i) => ["game_" + i, abbrOf(g.awayTeam) + " @ " + abbrOf(g.homeTeam), { pending:!simData[g.homeTeam+"|"+g.awayTeam] }]),
  ];

  return (
    <UI.Shell active="mlb">
      <UI.PageHead eyebrow={<>MLB · priced on Kalshi{kx.ts ? <span className="muted">· prices {formatAge(kx.ts)}{kx.stale ? " (refresh failed)" : ""}</span> : null}</>}
        title="MLB picks"
        sub="Every game simulated 100,000 times, one at-bat at a time, then compared with Kalshi's price on every market."
        right={<button className="btn btn-sm" onClick={()=>{ autoRanRef.current=false; loadGames(); loadKalshi(); }} disabled={busy}>{loading ? "Loading…" : "Refresh"}</button>} />
      <UI.Tabs tabs={tabs} value={activeTab} onChange={setActiveTab} />

      {!allSimsReady && games.length > 0 && <UI.Status>{runningId ? "Simulating " + runningId.split("|")[1] + " @ " + runningId.split("|")[0] + "…" : "Getting ready…"} {simsLoaded} of {games.length}</UI.Status>}
      {loading && !loaded && <UI.Status>Loading today's games…</UI.Status>}
      {error && <div className="note bad" style={{ marginBottom:12 }}>Today's schedule couldn't be loaded ({error}). Try Refresh.</div>}

      {activeTab==="top_picks" && <TopPicksTab allRows={allRows} games={games} simData={simData} kx={kx} loaded={loaded && !loading && !error}/>}
      {activeTab==="parlays" && <MLBParlayTab allRows={allRows} games={games} loaded={loaded && !loading && !error}/>}
      {!isSpecialTab && activeGame && TEAM_PARAMS[activeGame.homeTeam] && TEAM_PARAMS[activeGame.awayTeam] && (
        <GameSimView game={activeGame} agg={simData[gameKey]}
          running={runningId === gameKey}
          runCount={runCounts[gameKey]||0}
          onRun={()=>runSim(activeGame)}
          kx={kx} settings={settings}
        />
      )}
      {!isSpecialTab && activeGame && (!TEAM_PARAMS[activeGame.homeTeam]||!TEAM_PARAMS[activeGame.awayTeam]) && (
        <div className="note">This game isn't in the model yet: {activeGame.awayTeam} @ {activeGame.homeTeam}.</div>
      )}
      {!isSpecialTab && !activeGame && (loading ? <UI.Status>Loading today's games…</UI.Status> : <NoGames />)}

      <div className="ss-foot">
        <div>Team inputs from public 2025 MLB stats. Schedule from ESPN, prices from Kalshi.</div>
        <div style={{ marginTop:6 }}>Edge is the model's chance minus Kalshi's price in cents, before Kalshi's small trading fee. Check the price before buying. Not betting advice.</div>
      </div>
    </UI.Shell>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
