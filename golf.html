<style>
/* Golf page only. Colors come from css/sharp.css tokens. */
.g-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: -6px 0 16px; }
.g-bar .chip.live { color: var(--text); }
.g-bar .live-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--avoid); }
.g-bar .spacer { flex: 1; }
.g-sortrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.g-sortrow .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.g-sortrow .seg button { flex: none; }

/* finish-chances table: ladder bar per golfer; extra number columns only on wide screens */
.g-tbl th, .g-tbl td { padding: 10px 6px; }
.g-tbl tr > :first-child { padding-left: 12px; }
.g-tbl tr > :last-child { padding-right: 12px; }
.g-tbl td.pos { color: var(--muted); font-size: 13px; width: 36px; }
.g-tbl td.who { min-width: 0; max-width: 128px; }
.g-tbl .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.g-tbl .nm .mk { color: var(--muted); font-weight: 400; font-size: 12px; }
.g-tbl td.lad { min-width: 84px; }
.g-tbl td.lad > div { min-width: 0 !important; }
.g-tbl td.win { text-align: right; font-weight: 700; width: 48px; }
.g-tbl tr.out td { opacity: .5; }
.g-tbl tr.tap { cursor: pointer; }
.g-tbl tr.detail td { padding-top: 0; color: var(--text-2); font-size: 12px; }
.g-tbl tr.has-detail td { border-bottom: 0; }
.g-tbl .wide { display: none; }
@media (min-width: 760px) {
  .g-tbl .wide { display: table-cell; }
  .g-tbl tr.detail { display: none; }
  .g-tbl tr.has-detail td { border-bottom: 1px solid var(--line); }
  .g-tbl th, .g-tbl td { padding: 10px 10px; }
  .g-tbl td.who { max-width: 220px; }
  .g-tbl td.lad { width: 30%; }
}
.g-legend i { width: 14px; }
@media (min-width: 760px) { .mob-only { display: none; } }

/* head-to-head */
.h2h-pick { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: center; }
.h2h-pick .field { width: 100%; min-width: 0; height: 44px; }
.h2h-pick .vs { text-align: center; font-size: 13px; color: var(--muted); }
@media (min-width: 640px) { .h2h-pick { grid-template-columns: 1fr auto 1fr auto; } .h2h-pick .field { height: 40px; } }
.h2h-res { margin-top: 16px; }
.h2h-side .v { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.h2h-side .n { font-size: 13px; color: var(--text-2); }
.h2h-split { display: flex; gap: 2px; height: 12px; margin-top: 8px; }
.h2h-split > div { min-width: 2px; }
</style>

function fold(s) {
  return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/ø/gi, "o").replace(/æ/gi, "ae").replace(/ß/g, "ss").replace(/đ/gi, "d").replace(/ł/gi, "l").toLowerCase();
}
const SUFFIXES = new Set(["jr", "sr", "ii", "iii", "iv"]);
function nameTokens(s) {
  const t = fold(s).replace(/['’`]/g, "").replace(/[^a-z]+/g, " ").split(" ").filter(t => t && !SUFFIXES.has(t));
  // drop a middle initial ("Jordan L. Smith" -> "jordan smith"), but keep real initials ("J.T. Poston")
  return t.length >= 3 && t[0].length > 1 ? t.filter((x, i) => i === 0 || i === t.length - 1 || x.length > 1) : t;
}
function nameKeys(s) {
  const t = nameTokens(s);
  if (!t.length) return { full:"", oe:"", init:"", initials:false, pre:"" };
  const full = t.join("");
  const last = t[t.length - 1];
  // initials key only counts when one side actually wrote initials (J.T., S.Y.), so Carson Young never matches Cameron Young
  const initials = t.length > 1 && t.slice(0, -1).every(x => x.length === 1);
  // pre: first 3 letters of the first name + last name, for nicknames (Zach/Zachary, Cam/Cameron, Kris/Kristoffer, Ben/Benjamin)
  const pre = t.length > 1 && t[0].length >= 3 ? t[0].slice(0, 3) + "|" + t.slice(1).join("") : "";
  return { full, oe: full.replace(/oe/g, "o"), init: t.slice(0, -1).map(x => x[0]).join("") + "|" + last, initials, pre };
}
// Build a lookup over `names`; returns (otherName) => matching name from `names` or null.
function makeMatcher(names) {
  const idx = { full:{}, oe:{}, init:{}, pre:{} }, keys = {};
  const add = (m, k, n) => { if (!k) return; (m[k] = m[k] || new Set()).add(n); };
  names.forEach(n => { const k = keys[n] = nameKeys(n); add(idx.full, k.full, n); add(idx.oe, k.oe, n); add(idx.init, k.init, n); add(idx.pre, k.pre, n); });
  const one = (set) => set && set.size === 1 ? [...set][0] : null;
  return (name) => {
    const k = nameKeys(name);
    if (!k.full) return null;
    const hit = one(idx.full[k.full]) || one(idx.oe[k.oe]);
    if (hit) return hit;
    const n = one(idx.init[k.init]);
    if (n && (k.initials || keys[n].initials)) return n;
    return one(idx.pre[k.pre]);
  };
}
const paramsMatch = makeMatcher(Object.keys(PLAYER_PARAMS));
function paramsFor(name) { const k = paramsMatch(name); return k ? { ...PLAYER_PARAMS[k], key: k } : null; }

function sameEvent(a, b) {
  const n = (s) => fold(s).replace(/\b(the|20\d\d|championship|tournament|presented|by)\b/g, " ").replace(/[^a-z]+/g, " ").trim();
  const x = n(a), y = n(b);
  if (!x || !y) return false;
  if (x.includes(y) || y.includes(x)) return true;
  const tx = new Set(x.split(" ")), ty = y.split(" ");
  const hit = ty.filter(t => tx.has(t)).length;
  return hit / Math.max(tx.size, ty.length) >= 0.6;
}

// ── Formatting ────────────────────────────────────────────────────────────────
const pctFmt = (p) => p == null ? "—" : p >= 99.95 ? "100%" : p < 10 ? p.toFixed(1) + "%" : p.toFixed(0) + "%";
const centsFmt = (c) => c == null ? "—" : c < 10 ? (Math.round(c * 10) / 10) + "¢" : Math.round(c) + "¢";
const edgeFmt = (e) => e == null ? "—" : (e >= 0 ? "+" : "") + (Math.abs(e) < 10 ? e.toFixed(1) : e.toFixed(0)) + "¢";
const toParFmt = (v) => v == null ? "—" : v === 0 ? "E" : v > 0 ? "+" + v : "" + v;
function formatAge(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  return Math.floor(mins / 60) + "h " + (mins % 60) + "m ago";
}

// ── Simulation ────────────────────────────────────────────────────────────────
// Scores are simulated relative to par. Each golfer's expected round = field average (vs par) − SG:Total,
// with round-to-round spread sigma. Holes already played are fixed at the golfer's live score; a round in
// progress only simulates the holes left (mean and variance scaled by holes left / 18).
let spare = null;
function randn() {
  if (spare !== null) { const s = spare; spare = null; return s; }
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  const r = Math.sqrt(-2 * Math.log(u)), a = 2 * Math.PI * v;
  spare = r * Math.sin(a);
  return r * Math.cos(a);
}

// Par from the leaderboard: golfers between rounds have toPar = sum(rounds) − par × rounds.
function inferPar(live) {
  const vals = [];
  Object.values(live?.players || {}).forEach(d => {
    const rs = [d.r1, d.r2, d.r3, d.r4].filter(v => v != null);
    if (!rs.length || d.toPar == null || !(d.thru === 0 || d.thru >= 18)) return;
    vals.push((rs.reduce((a, b) => a + b, 0) - d.toPar) / rs.length);
  });
  if (vals.length < 5) return null;
  vals.sort((a, b) => a - b);
  return Math.round(vals[Math.floor(vals.length / 2)]);
}
// This week's scoring: average completed round vs par (0 before any round is in).
function fieldAvgToPar(live, par) {
  if (par == null) return 0;
  let s = 0, n = 0;
  Object.values(live?.players || {}).forEach(d => [d.r1, d.r2, d.r3, d.r4].forEach(v => { if (v != null) { s += v - par; n++; } }));
  return n >= 20 ? s / n : 0;
}

function buildSimState(field, live) {
  const players = live?.players || {};
  const status = live?.eventStatus || "scheduled";
  const curRound = status === "scheduled" ? 1 : Math.min(4, Math.max(1, live?.currentRound || 1));
  const final = status === "final";
  const par = inferPar(live);
  const fieldAvg = fieldAvgToPar(live, par);
  const cutKnown = Object.values(players).some(d => d.made_cut === false && !d.withdrew);
  const fieldSize = field.length;
  // PGA Tour: top 65 and ties after 36 holes. Small invitationals (no-cut events) have fields under ~80.
  const cutSpots = fieldSize >= 90 ? 65 : 0;
  const simCut = !cutKnown && cutSpots > 0 && curRound <= 2 && !final;
  const golfers = field.map(name => {
    const d = players[name] || null;
    const pp = paramsFor(name);
    const thru = d ? Math.min(18, d.thru || 0) : 0;
    const rem = [0, 0, 0, 0].map((_, i) => {
      const k = i + 1;
      if (final) return 0;
      if (k < curRound) return 0;
      if (k === curRound) return (18 - thru) / 18;
      return 1;
    });
    const out = !!(d && (d.withdrew || (cutKnown && d.made_cut === false)));
    return { name, d, sg: pp ? pp.sg : DEFAULT_SG, sigma: pp ? pp.sigma : DEFAULT_SIG, hasData: !!pp, est: !!(pp && pp.est),
      toPar: d && d.toPar != null ? d.toPar : 0, rem, out };
  });
  return { golfers, curRound, final, par, fieldAvg, cutKnown, cutSpots, simCut, status };
}

// Runs the field n times. Returns per-golfer counts; if `pair` = [i, j] also returns their head-to-head.
function simulate(st, n, pair) {
  const G = st.golfers, P = G.length;
  const mu = new Float64Array(P), sd = new Float64Array(P), base = new Float64Array(P), rem = new Float64Array(P * 4), out = new Uint8Array(P);
  G.forEach((g, j) => { mu[j] = st.fieldAvg - g.sg; sd[j] = g.sigma; base[j] = g.toPar; out[j] = g.out ? 1 : 0; for (let k = 0; k < 4; k++) rem[j * 4 + k] = g.rem[k]; });
  const win = new Float64Array(P), t5 = new Float64Array(P), t10 = new Float64Array(P), t20 = new Float64Array(P), made = new Float64Array(P);
  const s36 = new Float64Array(P), tot = new Float64Array(P), alive = new Uint8Array(P);
  let pa = 0, pb = 0, pt = 0;
  const draw = (j, k) => { const f = rem[j * 4 + k]; return f > 0 ? mu[j] * f + sd[j] * Math.sqrt(f) * randn() : 0; };
  for (let it = 0; it < n; it++) {
    let cnt = 0;
    for (let j = 0; j < P; j++) {
      if (out[j]) { alive[j] = 0; continue; }
      s36[j] = Math.round(base[j] + draw(j, 0) + draw(j, 1));
      alive[j] = 1; cnt++;
    }
    if (st.simCut && cnt > st.cutSpots) {
      const arr = new Float64Array(cnt); let c = 0;
      for (let j = 0; j < P; j++) if (alive[j]) arr[c++] = s36[j];
      arr.sort();
      const line = arr[st.cutSpots - 1];
      for (let j = 0; j < P; j++) if (alive[j] && s36[j] > line) alive[j] = 0;
    }
    let best = Infinity, nBest = 0, surv = 0;
    for (let j = 0; j < P; j++) {
      if (!alive[j]) continue;
      made[j]++; surv++;
      const t = Math.round(s36[j] + draw(j, 2) + draw(j, 3));
      tot[j] = t;
      if (t < best) { best = t; nBest = 1; } else if (t === best) nBest++;
    }
    if (!surv) continue;
    // Playoff: tied leaders each equally likely
    let pick = Math.floor(Math.random() * nBest);
    const arr = new Float64Array(surv); let c = 0;
    for (let j = 0; j < P; j++) {
      if (!alive[j]) continue;
      arr[c++] = tot[j];
      if (tot[j] === best) { if (pick === 0) win[j]++; pick--; }
    }
    arr.sort();
    // Kalshi top-N markets pay on ties ("top 10 including ties"): in if your total ≤ the Nth best total.
    const th5 = arr[Math.min(5, surv) - 1], th10 = arr[Math.min(10, surv) - 1], th20 = arr[Math.min(20, surv) - 1];
    for (let j = 0; j < P; j++) {
      if (!alive[j]) continue;
      if (tot[j] <= th5) t5[j]++;
      if (tot[j] <= th10) t10[j]++;
      if (tot[j] <= th20) t20[j]++;
    }
    if (pair) {
      const [a, b] = pair, A = alive[a], B = alive[b];
      if (A && B) { if (tot[a] < tot[b]) pa++; else if (tot[b] < tot[a]) pb++; else pt++; }
      else if (A) pa++; else if (B) pb++;
      else if (!out[a] && !out[b]) { if (s36[a] < s36[b]) pa++; else if (s36[b] < s36[a]) pb++; else pt++; }
      else pt++;
    }
  }
  const results = G.map((g, j) => ({
    name: g.name, sg: g.sg, hasData: g.hasData, est: g.est, d: g.d, out: g.out,
    win: 100 * win[j] / n, top5: 100 * t5[j] / n, top10: 100 * t10[j] / n, top20: 100 * t20[j] / n, cut: 100 * made[j] / n,
  }));
  return { results, h2h: pair ? { a: 100 * pa / n, b: 100 * pb / n, tie: 100 * pt / n } : null };
}

// Leaderboard position from to-par (T for ties), skipping golfers who are out
function positions(golfers) {
  const scores = golfers.filter(g => !g.out && g.d && g.d.toPar != null).map(g => g.d.toPar);
  const pos = {};
  golfers.forEach(g => {
    if (g.out || !g.d || g.d.toPar == null) { pos[g.name] = { rank: null, label: g.d && g.d.withdrew ? "WD" : g.out ? "CUT" : "—" }; return; }
    const better = scores.filter(s => s < g.d.toPar).length, same = scores.filter(s => s === g.d.toPar).length;
    pos[g.name] = { rank: better + 1, label: (same > 1 ? "T" : "") + (better + 1) };
  });
  return pos;
}

// ── Data loading ──────────────────────────────────────────────────────────────
async function kx(path) {
  const r = await fetch("/api/kx/" + path);
  if (!r.ok) throw new Error("Kalshi " + r.status);
  return r.json();
}
const cents = (dollars, centsInt) => dollars != null && dollars !== "" ? Math.round(parseFloat(dollars) * 1000) / 10 : centsInt != null ? +centsInt : null;

// Finds the Kalshi winner event for ESPN's tournament, then that event's top-5/10/20 and make-cut markets.
async function loadKalshi(espnEventName) {
  const ev = await kx("events?series_ticker=KXPGATOUR&status=open&limit=50");
  const events = ev.events || [];
  const name = (e) => (e.product_metadata && e.product_metadata.competition) || e.sub_title || e.title || "";
  let event = espnEventName ? events.find(e => sameEvent(name(e), espnEventName)) : null;
  if (!event && !espnEventName) event = events[0];
  if (!event) return { event: null, events: events.map(name), markets: {} };
  const suffix = event.event_ticker.slice(event.event_ticker.indexOf("-") + 1);
  const lists = await Promise.all(MARKETS.map(m =>
    kx(`markets?event_ticker=${m.series}-${suffix}&limit=300`).then(d => d.markets || []).catch(() => [])));
  const markets = {};
  MARKETS.forEach((m, i) => {
    const byName = {};
    lists[i].forEach(x => {
      if (x.status !== "active" && x.status !== "open") return; // finalized = golfer already out of it
      const golfer = x.yes_sub_title || x.no_sub_title;
      if (!golfer) return;
      byName[golfer] = { ticker: x.ticker, eventTicker: x.event_ticker, golfer,
        bid: cents(x.yes_bid_dollars, x.yes_bid), ask: cents(x.yes_ask_dollars, x.yes_ask) };
    });
    if (Object.keys(byName).length) markets[m.key] = byName;
  });
  return { event: { ticker: event.event_ticker, name: name(event) }, events: events.map(name), markets };
}

async function loadScores() {
  const r = await fetch("/api/golf-scores");
  if (!r.ok) throw new Error("scores " + r.status);
  const d = await r.json();
  if (d.error) throw new Error(d.error);
  return d;
}

// ── Grading ───────────────────────────────────────────────────────────────────
// Shared grade, except a golfer we have no strokes-gained data for can't grade above SMALL EDGE.
function gradeFor(chance, ask, hasData, s) {
  const g = SB.grade(chance / 100, ask, s);
  if (!g || hasData || (g.key !== "STRONG" && g.key !== "GOOD")) return g;
  return { ...g, key: "SMALL", label: SB.LABELS.SMALL, color: SB.COLORS.SMALL, blurb: SB.BLURBS.SMALL + " (No stats on this golfer, so the model can't rate it higher.)", rank: SB.ORDER.indexOf("SMALL"), capped: true };
}

// One row per golfer with a live Kalshi market for this bet type
function buildRows(mkey, sim, kal, pos, s) {
  const mk = kal && kal.markets[mkey];
  if (!mk || !sim) return { rows: [], hidden: 0, unmatched: [] };
  const match = makeMatcher(sim.map(r => r.name));
  const byName = Object.fromEntries(sim.map(r => [r.name, r]));
  const rows = [], unmatched = []; let hidden = 0;
  Object.values(mk).forEach(m => {
    const who = match(m.golfer);
    const r = who && byName[who];
    if (!r) { unmatched.push(m.golfer); return; }
    if (r.out) return;
    if (!(m.ask > 0 && m.ask < 100)) return;
    if (s.hideWide && m.bid != null && m.ask - m.bid > WIDE_GAP) { hidden++; return; }
    const chance = r[mkey];
    const g = gradeFor(chance, m.ask, r.hasData, s);
    rows.push({ key: m.ticker, golfer: r.name, r, m, mkey, chance, price: m.ask, edge: g ? g.edge : null, g,
      rank: g ? g.rank : 9, stake: SB.stake(g, "golf", s), pos: pos[r.name] });
  });
  return { rows, hidden, unmatched };
}

// ── Components ────────────────────────────────────────────────────────────────
function betPick(row, eventName) {
  const mdef = MARKETS.find(m => m.key === row.mkey);
  return {
    ticker: row.m.ticker, side: "yes",
    // Kalshi long shots trade in tenths of a cent; the order goes in at the next whole cent (it still fills at the best ask).
    price: Math.min(99, Math.max(1, Math.ceil(row.price - 1e-9))),
    chance: row.chance, label: `${row.golfer} to ${mdef.verb}`,
    sub: `${eventName} · model: ${pctFmt(row.chance)} chance to cash · Kalshi ${centsFmt(row.price)}`,
    sport: "golf", grade: row.g,
  };
}

// Where a golfer stands right now: "T5 · −8 · 12" (position, score to par, holes played), or null before he tees off
function standing(r, pos) {
  const d = r && r.d;
  if (!d || d.toPar == null) return null;
  const p = pos && pos.rank != null ? pos.label + " · " : "";
  return p + toParFmt(d.toPar) + (d.thruDisplay && d.thru > 0 && d.thru < 18 ? " · " + d.thruDisplay : "");
}
const mdefOf = (k) => MARKETS.find(m => m.key === k);

// Best bets: STRONG and GOOD first (cards), then the biggest SMALL edges (rows)
function splitBest(rows) {
  const ok = rows.filter(r => r.g && r.rank <= 2).sort((a, b) => b.edge - a.edge);
  return { best: ok.filter(r => r.rank <= 1), rest: ok.filter(r => r.rank === 2).slice(0, 6) };
}

function BestBets({ rows, eventName }) {
  const { best, rest } = splitBest(rows);
  if (!best.length && !rest.length) return (
    <div className="note">Nothing priced below the model right now. Every Kalshi golf price is within {SB.getSettings().small.minEdge}¢ of the model's chance (or above it). Check back after the next round of scores.</div>
  );
  return (
    <div>
      <UI.H2 aside={best.length ? `${best.length} strong or good` : null}>Best bets right now</UI.H2>
      {best.length ? <div className="picks-grid">
        {best.map((r, i) => {
          const md = mdefOf(r.mkey);
          return (
            <UI.PickCard key={r.key} top={i === 0} g={r.g} title={`${r.golfer} to ${md.verb}`}
              meaning={standing(r.r, r.pos) ? "Now " + standing(r.r, r.pos) : "Hasn't teed off yet"}
              when={md.label} meta={eventName} pick={betPick(r, eventName)}>
              {r.g.longShot && <div className="tiny muted" style={{ marginTop: 8 }}>Long shot: it loses most of the time, so keep the bet small.</div>}
            </UI.PickCard>
          );
        })}
      </div> : <div className="note">No STRONG or GOOD golf bets right now. The smaller edges below are close calls: bet small or skip.</div>}
      {rest.length > 0 && <>
        <UI.H2 aside={`${rest.length}`}>Smaller edges</UI.H2>
        <UI.PickList>
          {rest.map(r => {
            const md = mdefOf(r.mkey);
            return <UI.PickRow key={r.key} g={r.g} title={`${r.golfer} to ${md.verb}`}
              meta={[standing(r.r, r.pos), r.g.capped ? "no stats on this golfer" : null].filter(Boolean).join(" · ") || null}
              pick={betPick(r, eventName)} />;
          })}
        </UI.PickList>
      </>}
      <div className="tiny muted" style={{ marginTop: 10 }}>Golf bets are long shots: even a good one usually loses. Most will grade SMALL EDGE, and that's honest. Bet small.</div>
    </div>
  );
}

// Every Kalshi price for one market, as compact rows (works at phone width), sortable
function BetsList({ rows, mkey, eventName, hidden }) {
  const [sort, setSort] = useState({ k: "edge", dir: -1 });
  const sorted = sortRows(rows, sort, (r, k) => k === "grade" ? -r.rank : k === "pos" ? (r.pos && r.pos.rank != null ? -r.pos.rank : null) : r[k]);
  const mdef = mdefOf(mkey);
  if (!rows.length) return <div className="note">No {mdef.label.toLowerCase()} prices to show{hidden ? ` (${hidden} hidden for wide bid/ask gaps)` : ""}.</div>;
  return (
    <div>
      <div className="g-sortrow">
        <span className="small muted">Sort by</span>
        <UI.Seg options={[["edge", "Edge"], ["chance", "Chance"], ["price", "Price"], ["pos", "Position"]]} value={sort.k}
          onChange={k => setSort({ k, dir: k === "price" ? 1 : -1 })} />
      </div>
      <UI.PickList>
        {sorted.map(r => (
          <UI.PickRow key={r.key} g={r.g} badge={r.rank <= 2}
            title={<>{r.golfer}{!r.r.hasData && <span className="muted" title="No strokes-gained data for this golfer; the model treats him as an average tour player" style={{ fontWeight: 400 }}> *</span>}</>}
            meta={standing(r.r, r.pos)}
            pick={r.rank <= 2 ? betPick(r, eventName) : null} />
        ))}
      </UI.PickList>
      <div className="tiny muted" style={{ marginTop: 8, lineHeight: 1.6 }}>
        Chance: how often the golfer {mdef.verb === "win" ? "wins" : mdef.verb.replace("finish", "finishes").replace("make", "makes")} in {SIM_N.toLocaleString()} simulations{mkey.startsWith("top") ? " (ties count, as on Kalshi)" : ""}. Price: Kalshi's current ask for YES. Edge = chance − price. * = no stats for this golfer (graded no higher than SMALL EDGE).
        {hidden > 0 && <> {hidden} golfer{hidden > 1 ? "s" : ""} hidden: bid/ask gap wider than {WIDE_GAP}¢ (change in <a href="settings.html" className="link">Settings</a>).</>}
      </div>
    </div>
  );
}

// Finish ladder steps for one golfer, widest first
function ladderSteps(r, showCut) {
  return [
    ...(showCut ? [{ label: "Make cut", p: r.cut / 100 }] : []),
    { label: "Top 20", p: r.top20 / 100 }, { label: "Top 10", p: r.top10 / 100 },
    { label: "Top 5", p: r.top5 / 100 }, { label: "Win", p: r.win / 100 },
  ];
}
// Legend swatches use the same shading as SharpUI.ProbLadder (more solid = harder finish)
function LadderLegend({ showCut }) {
  const labels = (showCut ? ["Make cut"] : []).concat(["Top 20", "Top 10", "Top 5", "Win"]), n = labels.length;
  const items = labels.map((l, i) => ({ l, o: 0.22 + 0.78 * (i + 1) / n })).reverse();
  return (
    <div className="legend g-legend" style={{ marginTop: 0 }}>
      {items.map(x => <span key={x.l}><i style={{ background: "var(--series-a)", opacity: x.o }} />{x.l}</span>)}
    </div>
  );
}

function FinishTable({ sim, pos, curRound, cutKnown }) {
  const [sort, setSort] = useState({ k: "pos", dir: -1 });
  const [open, setOpen] = useState(null);
  const rows = sim.map(r => ({ ...r, pos: pos[r.name] }));
  const sorted = sortRows(rows, sort, (r, k) => k === "pos" ? (r.pos && r.pos.rank != null ? -r.pos.rank : null) : k === "toPar" ? (r.d && r.d.toPar != null ? -r.d.toPar : null) : r[k]);
  const showCut = !cutKnown;
  const rounds = [1, 2, 3, 4].filter(k => k <= curRound);
  const th = (k, label, cls) => <SortTh k={k} sort={sort} setSort={setSort} right={cls === "r"}>{label}</SortTh>;
  return (
    <div>
      <div className="card" style={{ marginBottom: 12 }}>
        <div style={{ fontWeight: 650, marginBottom: 2 }}>Who can win, and who just makes the cut</div>
        <div className="small text-2" style={{ marginBottom: 10 }}>Each bar is one golfer. The solid tip is the golfer's chance to win; each fainter band adds the next finish{showCut ? ", out to making the cut" : ""}. A long faint bar with a short solid tip means a likely good finish but probably won't win. <span className="mob-only">Tap a golfer for the exact numbers.</span></div>
        <LadderLegend showCut={showCut} />
      </div>
      <div className="g-sortrow">
        <span className="small muted">Sort by</span>
        <UI.Seg options={[["pos", "Leaderboard"], ["win", "Win"], ["top10", "Top 10"], showCut ? ["cut", "Make cut"] : ["top20", "Top 20"]]} value={sort.k}
          onChange={k => setSort({ k, dir: -1 })} />
      </div>
      <div className="tbl-wrap">
        <table className="tbl g-tbl">
          <thead>
            <tr>
              {th("pos", "Pos")}
              {th("name", "Golfer")}
              <th className="wide sortable" onClick={() => setSort(sort.k === "toPar" ? { k: "toPar", dir: -sort.dir } : { k: "toPar", dir: -1 })} aria-sort={sort.k === "toPar" ? (sort.dir < 0 ? "descending" : "ascending") : "none"}>Score<span className="arrow">{sort.k === "toPar" ? (sort.dir < 0 ? "▼" : "▲") : "↕"}</span></th>
              <th>Finish chances</th>
              <SortTh k="win" sort={sort} setSort={setSort} right>Win</SortTh>
              {[["top5", "Top 5"], ["top10", "Top 10"], ["top20", "Top 20"], ...(showCut ? [["cut", "Cut"]] : []), ["sg", "SG"]].map(([k, l]) => (
                <th key={k} className={"wide sortable r"} onClick={() => setSort(sort.k === k ? { k, dir: -sort.dir } : { k, dir: -1 })} aria-sort={sort.k === k ? (sort.dir < 0 ? "descending" : "ascending") : "none"}>{l}<span className="arrow">{sort.k === k ? (sort.dir < 0 ? "▼" : "▲") : "↕"}</span></th>
              ))}
              {rounds.map(k => <th key={k} className="wide r">R{k}</th>)}
            </tr>
          </thead>
          <tbody>
            {sorted.map(r => {
              const d = r.d || {};
              const isOpen = open === r.name;
              const score = d.toPar == null ? null : toParFmt(d.toPar) + (d.thruDisplay && d.thru > 0 && d.thru < 18 ? " · " + d.thruDisplay : "");
              const sg = r.hasData ? "SG " + (r.sg > 0 ? "+" : "") + r.sg.toFixed(2) : "no stats";
              const nums = ladderSteps(r, showCut).slice().reverse().map(s => `${s.label} ${pctFmt(s.p * 100)}`).join(" · ");
              return (
                <React.Fragment key={r.name}>
                  <tr className={"tap" + (r.out ? " out" : "") + (isOpen ? " has-detail" : "")} onClick={() => setOpen(isOpen ? null : r.name)} aria-expanded={isOpen}>
                    <td className="pos">{r.pos ? r.pos.label : "—"}</td>
                    <td className="who">
                      <div className="nm">{r.name}{r.est && <span className="mk" title="SG estimated (LIV / DP World Tour)"> est</span>}{!r.hasData && <span className="mk" title="No strokes-gained data"> *</span>}</div>
                      <div className="sub mob-only">{[score, sg].filter(Boolean).join(" · ")}</div>
                    </td>
                    <td className="wide" style={{ whiteSpace: "nowrap" }}><b>{toParFmt(d.toPar)}</b>{score && d.thru > 0 && d.thru < 18 && <span className="sub"> {d.thruDisplay}</span>}</td>
                    <td className="lad">{r.out ? <span className="tiny muted">{d.withdrew ? "Withdrew" : "Missed cut"}</span> : <UI.ProbLadder steps={ladderSteps(r, showCut)} />}</td>
                    <td className="win num">{pctFmt(r.win)}</td>
                    <td className="wide r">{pctFmt(r.top5)}</td>
                    <td className="wide r">{pctFmt(r.top10)}</td>
                    <td className="wide r">{pctFmt(r.top20)}</td>
                    {showCut && <td className="wide r">{pctFmt(r.cut)}</td>}
                    <td className="wide r muted">{r.hasData ? (r.sg > 0 ? "+" : "") + r.sg.toFixed(2) : "—"}</td>
                    {[d.r1, d.r2, d.r3, d.r4].slice(0, curRound).map((v, k) => <td key={k} className="wide r muted">{v ?? "—"}</td>)}
                  </tr>
                  {isOpen && <tr className="detail"><td></td><td colSpan={3}>{nums}</td></tr>}
                </React.Fragment>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="tiny muted" style={{ marginTop: 8 }}>SG = strokes gained per round vs an average PGA Tour pro (2026 season). est = estimated (LIV / DP World Tour). * = no stats, plays like an average tour pro.</div>
    </div>
  );
}

function H2HMatchup({ state, sim }) {
  const names = useMemo(() => (sim || []).filter(r => !r.out).map(r => r.name), [sim]);
  const [a, setA] = useState(""), [b, setB] = useState("");
  const [res, setRes] = useState(null), [running, setRunning] = useState(false);
  useEffect(() => { if (names.length >= 2 && (!a || !names.includes(a))) { setA(names[0]); setB(names[1]); setRes(null); } }, [names]);
  if (!state || names.length < 2) return null;
  function run() {
    if (a === b) return;
    setRunning(true);
    setTimeout(() => {
      const ia = state.golfers.findIndex(g => g.name === a), ib = state.golfers.findIndex(g => g.name === b);
      setRes({ na: a, nb: b, ...simulate(state, H2H_N, [ia, ib]).h2h });
      setRunning(false);
    }, 20);
  }
  const fav = res ? (res.a >= res.b ? res.a : res.b) : 0;
  return (
    <div className="card">
      <div style={{ fontWeight: 650, marginBottom: 2 }}>Who finishes ahead?</div>
      <div className="small text-2" style={{ marginBottom: 12 }}>Pick two golfers and the model plays the tournament {H2H_N.toLocaleString()} times to see who beats whom over 72 holes. Model only: Kalshi doesn't price these.</div>
      <div className="h2h-pick">
        <select className="field" aria-label="First golfer" value={a} onChange={e => { setA(e.target.value); setRes(null); }}>{names.map(p => <option key={p} value={p}>{p}</option>)}</select>
        <span className="vs">vs</span>
        <select className="field" aria-label="Second golfer" value={b} onChange={e => { setB(e.target.value); setRes(null); }}>{names.map(p => <option key={p} value={p}>{p}</option>)}</select>
        <button className="btn btn-primary" style={{ minHeight: 44 }} onClick={run} disabled={running || a === b}>{running ? "Running…" : "Compare"}</button>
      </div>
      {a === b && <div className="tiny muted" style={{ marginTop: 8 }}>Pick two different golfers.</div>}
      {res && (
        <div className="h2h-res">
          <div className="row" style={{ justifyContent: "space-between", alignItems: "flex-end" }}>
            <div className="h2h-side" style={{ minWidth: 0 }}><div className="v">{pctFmt(res.a)}</div><div className="n"><span className="legend" style={{ display: "inline", margin: 0 }}><i style={{ background: "var(--series-a)" }} /></span>{res.na}</div></div>
            <div className="h2h-side" style={{ textAlign: "right", minWidth: 0 }}><div className="v">{pctFmt(res.b)}</div><div className="n">{res.nb}<span className="legend" style={{ display: "inline", margin: 0 }}><i style={{ background: "var(--series-b)", margin: "0 0 0 5px" }} /></span></div></div>
          </div>
          <div className="h2h-split" role="img" aria-label={`${res.na} ${pctFmt(res.a)}, ${res.nb} ${pctFmt(res.b)}${res.tie > 0.5 ? ", tie " + pctFmt(res.tie) : ""}`}>
            <div style={{ width: res.a + "%", background: "var(--series-a)", borderRadius: "999px 0 0 999px" }} />
            {res.tie > 0.5 && <div style={{ width: res.tie + "%", background: "var(--faint)" }} title={`Tie ${pctFmt(res.tie)}`} />}
            <div style={{ width: res.b + "%", background: "var(--series-b)", borderRadius: "0 999px 999px 0" }} />
          </div>
          <div className="small text-2" style={{ marginTop: 10 }}>
            {res.a >= res.b ? res.na : res.nb} has a {pctFmt(fav)} chance to finish ahead{res.tie > 0.5 ? ` (tie ${pctFmt(res.tie)})` : ""}. A golfer who misses the cut loses to one who makes it.
          </div>
        </div>
      )}
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const s = useSettings();
  const [live, setLive] = useState(null);
  const [scoresErr, setScoresErr] = useState("");
  const [scoresTs, setScoresTs] = useState(null);
  const [kal, setKal] = useState(null);
  const [kalErr, setKalErr] = useState("");
  const [kalTs, setKalTs] = useState(null);
  const [sim, setSim] = useState(null);
  const [state, setState] = useState(null);
  const [running, setRunning] = useState(false);
  const [tab, setTab] = useState("win");
  const [view, setView] = useState("picks");
  const liveRef = useRef(null);

  async function refreshScores() {
    try { const d = await loadScores(); liveRef.current = d; setLive(d); setScoresErr(""); setScoresTs(Date.now()); }
    catch (e) { setScoresErr(String(e.message || e)); if (!liveRef.current) setLive(false); }
  }
  async function refreshPrices() {
    const espnName = liveRef.current ? liveRef.current.eventName : "";
    try { const k = await loadKalshi(espnName); setKal(k); setKalErr(""); setKalTs(Date.now()); }
    catch (e) { setKalErr(String(e.message || e)); }
  }
  useEffect(() => {
    refreshScores();
    const a = setInterval(refreshScores, SCORES_TTL);
    return () => clearInterval(a);
  }, []);
  // prices once the tournament is known (so the right Kalshi event is picked), then every minute
  useEffect(() => {
    if (live === null) return;
    refreshPrices();
    const b = setInterval(refreshPrices, PRICES_TTL);
    return () => clearInterval(b);
  }, [live === null ? null : (live ? live.eventId : "none")]);

  // Field: ESPN's leaderboard; if ESPN is down, the golfers Kalshi lists
  const field = useMemo(() => {
    if (live && live.players && Object.keys(live.players).length) return Object.keys(live.players);
    if (live === false && kal && kal.markets.win) return Object.keys(kal.markets.win);
    return null;
  }, [live, kal && !live ? Object.keys(kal.markets.win || {}).length : 0]);

  function runSim() {
    if (!field) return;
    setRunning(true);
    setTimeout(() => {
      const st = buildSimState(field, live || null);
      setState(st);
      setSim(simulate(st, SIM_N).results.sort((x, y) => y.win - x.win));
      setRunning(false);
    }, 20);
  }
  // re-run whenever new scores arrive
  useEffect(() => { if (field) runSim(); }, [field, live && live.fetchedAt]);

  const pos = useMemo(() => state ? positions(state.golfers) : {}, [state]);
  const eventName = (live && live.eventName) || (kal && kal.event && kal.event.name) || "PGA Tour";
  const avail = MARKETS.filter(m => kal && kal.markets[m.key] && !(m.key === "cut" && state && state.cutKnown));
  const tables = useMemo(() => {
    const o = {};
    avail.forEach(m => { o[m.key] = buildRows(m.key, sim, kal, pos, s); });
    return o;
  }, [sim, kal, pos, s]);
  const allRows = Object.values(tables).flatMap(t => t.rows);
  const unmatched = [...new Set(Object.values(tables).flatMap(t => t.unmatched))];

  // Track STRONG / GOOD picks in the shared record (dedupes by ticker)
  const logged = useRef(new Set());
  useEffect(() => {
    const today = new Date().toLocaleDateString("en-CA");
    const picks = allRows.filter(r => r.g && (r.g.key === "STRONG" || r.g.key === "GOOD") && !logged.current.has(r.key)).map(r => {
      logged.current.add(r.key);
      return { sport:"golf", gameId: r.m.eventTicker, gameDate: today, home: r.golfer, away: eventName,
        market: MARKETS.find(m => m.key === r.mkey).label, ticker: r.m.ticker, side:"yes", chance: r.chance, price: r.price, tier: r.g.key };
    });
    if (picks.length) SB.logPicks(picks);
  }, [allRows.map(r => r.key + (r.g ? r.g.key : "")).join(",")]);

  useEffect(() => { if (avail.length && !avail.some(m => m.key === tab)) setTab(avail[0].key); }, [avail.map(m => m.key).join(",")]);

  const statusLine = !live ? "" : live.eventStatus === "scheduled" ? "Starts soon" : live.eventStatus === "final" ? "Final" : `Round ${live.currentRound} in progress`;
  const tbl = tables[tab];
  const inProgress = live && live.eventStatus === "in_progress";
  const priced = sim && kal && kal.event;
  const nBest = priced ? (({ best, rest }) => best.length + rest.length)(splitBest(allRows)) : null;
  const cutLabel = !state ? null : state.cutKnown ? "Cut made" : state.cutSpots ? `Cut: top ${state.cutSpots} and ties` : "No cut";

  const views = [
    ["picks", "Best bets", nBest != null ? { count: nBest } : { pending: !sim }],
    ["field", "Finish chances", field ? { count: field.length } : { pending: true }],
    ["prices", "Every price", sim && avail.length ? { count: allRows.length } : { pending: !kal }],
    ["h2h", "Head-to-head"],
  ];

  return (
    <UI.Shell active="golf">
      <UI.PageHead
        eyebrow={<>PGA Tour{statusLine ? " · " + statusLine : ""} · priced on Kalshi</>}
        title={eventName}
        sub={`${field ? field.length + " golfers, each" : "Every golfer"} simulated ${SIM_N.toLocaleString()} times from strokes gained${state && state.curRound > 1 ? " and live scores" : ""}, then compared with Kalshi's price to win, finish top 5/10/20 and make the cut.`} />
      <div className="g-bar">
        {live && scoresTs && <span className={"chip" + (inProgress ? " live" : "")}>{inProgress && <span className="live-dot" />}{inProgress ? `Live R${live.currentRound} · ` : "Scores "}{formatAge(scoresTs)}</span>}
        {scoresErr && <span className="chip" style={{ color: "var(--avoid)" }}>Scores unavailable</span>}
        {kalTs && <span className="chip">Kalshi {formatAge(kalTs)}</span>}
        {cutLabel && <span className="chip">{cutLabel}</span>}
        <span className="spacer" />
        <button className="btn btn-sm" onClick={() => { refreshScores().then(refreshPrices); }}>Refresh</button>
        <button className="btn btn-sm" onClick={runSim} disabled={running || !field}>{running ? "Simulating…" : !field ? "Loading field…" : "Re-run sim"}</button>
      </div>
      <UI.Tabs tabs={views} value={view} onChange={setView} />

      {kalErr && <div className="note warn" style={{ marginBottom: 12 }}>Kalshi prices can't load right now ({kalErr}). The model's chances are on the Finish chances tab, but there's nothing to grade until prices come back.</div>}
      {kal && !kal.event && <div className="note warn" style={{ marginBottom: 12 }}>Kalshi has no open winner market for {eventName} yet{kal.events.length ? ` (open now: ${kal.events.join(", ")})` : ""}. Model chances are on the Finish chances tab; grades appear once Kalshi lists this event.</div>}

      {!sim && (live === null || running
        ? <UI.Status>Loading the leaderboard and running the simulation…</UI.Status>
        : <div className="note bad">Couldn't load the field (ESPN and Kalshi both unavailable).</div>)}

      {view === "picks" && <>
        <GradeLegend sport="golf" />
        {priced && <BestBets rows={allRows} eventName={eventName} />}
        <UI.H2>Pick record</UI.H2>
        <RecordCard sport="golf" />
      </>}

      {view === "field" && sim && <FinishTable sim={sim} pos={pos} curRound={state ? state.curRound : 1} cutKnown={state && state.cutKnown} />}

      {view === "prices" && sim && (avail.length > 0 ? <>
        <div className="g-sortrow">
          <span className="small muted">Market</span>
          <UI.Seg options={avail.map(m => [m.key, `${m.label} · ${(tables[m.key] || { rows: [] }).rows.length}`])} value={tab} onChange={setTab} />
        </div>
        {tbl && <BetsList key={tab} rows={tbl.rows} mkey={tab} eventName={eventName} hidden={tbl.hidden} />}
        {unmatched.length > 0 && <div className="tiny muted" style={{ marginTop: 6 }}>On Kalshi but not on ESPN's leaderboard (not graded): {unmatched.slice(0, 12).join(", ")}{unmatched.length > 12 ? "…" : ""}</div>}
      </> : kal && <div className="note">No Kalshi golf prices to show for this event yet.</div>)}

      {view === "h2h" && sim && <H2HMatchup state={state} sim={sim} />}

      <details className="explain" style={{ marginTop: 28 }}>
        <summary><span className="chip">?</span>How the model works</summary>
        <div className="body small text-2" style={{ display: "grid", gap: 8, lineHeight: 1.55 }}>
          <div><b style={{ color: "var(--text)" }}>Skill:</b> each golfer's expected round is this week's field average minus his strokes gained per round (2026 PGA Tour SG:Total; LIV / DP World Tour players estimated). Golfers without stats play like an average tour pro and are marked *.</div>
          <div><b style={{ color: "var(--text)" }}>Live scores:</b> holes already played count as played (ESPN leaderboard). Only the holes left are simulated, so a golfer 5 shots clear with 9 holes left is a big favorite.</div>
          <div><b style={{ color: "var(--text)" }}>Cut:</b> top 65 and ties after 36 holes, simulated until ESPN shows the real cut. Top 5/10/20 count ties, the way Kalshi settles them. Tied leaders split the win like a playoff.</div>
          <div><b style={{ color: "var(--text)" }}>Prices:</b> Kalshi's YES ask for each golfer (winner, top 5/10/20, make cut). Edge = model chance − price. Golfers Kalshi has already settled (missed cut, out of contention) are skipped.</div>
        </div>
      </details>
      <div className="ss-foot">Model inputs are public 2026 PGA Tour stats; ratings for some players are estimates. Not professional betting advice. Gamble responsibly.</div>
    </UI.Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
