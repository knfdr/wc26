<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharp Sim</title>
<meta name="description" content="Sports betting models priced against Kalshi: the best bets, graded in plain English.">
<meta name="theme-color" content="#0b0d10">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sharp.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="js/bets.js"></script>
<script src="js/ui.js"></script>
<style>
.sports { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .sports { grid-template-columns: 1fr 1fr; } }
@media (min-width: 980px) { .sports { grid-template-columns: 1fr 1fr 1fr; } }
.sport { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px var(--pad); min-height: 128px; transition: transform .15s, border-color .15s; }
.sport:hover { transform: translateY(-2px); border-color: var(--line-strong); }
.sport-top { display: flex; align-items: center; gap: 10px; }
.sport-ico { width: 36px; height: 36px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; font-size: 19px; flex: none; }
.sport-name { font-size: 17px; font-weight: 650; letter-spacing: -0.2px; }
.sport-go { margin-left: auto; color: var(--muted); font-size: 18px; transition: transform .15s; }
.sport:hover .sport-go { transform: translateX(3px); color: var(--text); }
.sport-desc { font-size: 13.5px; color: var(--text-2); line-height: 1.45; }
.sport-rec { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.steps { display: grid; gap: 10px; grid-template-columns: 1fr; counter-reset: s; }
@media (min-width: 760px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px var(--pad); }
.step::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-3); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
.step b { display: block; font-size: 15px; margin-bottom: 3px; }
.step span { font-size: 13.5px; color: var(--text-2); line-height: 1.45; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;
const SB = window.SharpBets, UI = window.SharpUI;
// The record of STRONG and GOOD picks comes from /api/resolve (which also settles finished Kalshi markets), cached 15 minutes.
const RESOLVE_CACHE_KEY = "sharp_resolve_cache";
const RESOLVE_TTL = 15 * 60 * 1000;

const SPORTS = [
  { k: "nfl", href: "nfl.html", ico: "🏈", name: "NFL", desc: "Every game simulated drive by drive, priced on every Kalshi spread, total and winner." },
  { k: "cfb", href: "cfb.html", ico: "🏟️", name: "College football", desc: "Every FBS game rated from this season's results and priced on Kalshi." },
  { k: "golf", href: "golf.html", ico: "⛳", name: "Golf", desc: "Each PGA Tour event simulated from strokes gained: win, top 5/10/20 and make the cut." },
  { k: "parlays", href: "parlays.html", ico: "🧩", name: "Parlays", desc: "Two to five of the best picks from every sport, combined and ranked by chance to cash." },
  { k: "live", href: "live.html", ico: "⚡", name: "Live trader", desc: "Watches your bets during the game and cashes out on the rules you set. Paper mode by default." },
  { k: "mlb", href: "mlb.html", ico: "⚾", name: "MLB", desc: "Pitch-by-pitch style game sims from starters, lineups and ballparks, priced on Kalshi." },
  { k: "wnba", href: "wnba.html", ico: "🏀", name: "WNBA", desc: "Possession-by-possession sims from team ratings and pace, priced on Kalshi." },
];

function ago(ts) { const m = Math.floor((Date.now() - ts) / 60000); return m < 1 ? "just now" : m < 60 ? m + "m ago" : Math.floor(m / 60) + "h ago"; }

function App() {
  const [bets, setBets] = useState(null);
  const [at, setAt] = useState(null);
  useEffect(() => { (async () => {
    try { const c = JSON.parse(localStorage.getItem(RESOLVE_CACHE_KEY) || "null"); if (c && Date.now() - c.ts < RESOLVE_TTL) { setBets(c.bets); setAt(c.ts); return; } } catch (e) {}
    try {
      const res = await fetch("/api/resolve");
      if (res.ok && (res.headers.get("content-type") || "").includes("json")) {
        const b = await res.json(), ts = Date.now(); setBets(b); setAt(ts);
        try { localStorage.setItem(RESOLVE_CACHE_KEY, JSON.stringify({ ts, bets: b })); } catch (e) {}
        return;
      }
    } catch (e) {}
    setBets(false);
  })(); }, []);
  const rec = bets ? SB.record(bets) : null;

  return (
    <UI.Shell active="index">
      <UI.PageHead eyebrow="Sports betting models · priced on Kalshi" title="Find the bets the market has priced too cheap"
        sub="Each game is simulated thousands of times. When the model's chance to cash is higher than Kalshi's price, the bet gets a grade and a suggested amount. Tap Bet to place it." />

      <UI.H2 aside={at ? "updated " + ago(at) : null}>Your pick record</UI.H2>
      {bets === null ? <div className="card"><div className="skel" style={{ height: 22, width: 160, marginBottom: 10 }} /><div className="skel" style={{ height: 120 }} /></div>
        : bets === false ? <div className="note">The pick record couldn't be loaded right now.</div>
        : <SB.RecordCard bets={bets} />}

      <UI.H2>Pick a sport</UI.H2>
      <div className="sports">
        {SPORTS.map(s => {
          const r = rec && rec.bySport[s.k];
          return (
            <a key={s.k} href={s.href} className="sport">
              <div className="sport-top"><span className="sport-ico" aria-hidden="true">{s.ico}</span><span className="sport-name">{s.name}</span><span className="sport-go" aria-hidden="true">→</span></div>
              <div className="sport-desc">{s.desc}</div>
              {r && r.w + r.l + r.pending > 0 && <div className="sport-rec">
                {["STRONG", "GOOD"].filter(k => r[k].w + r[k].l + r[k].pending).map(k => (
                  <span key={k} className="row" style={{ gap: 6 }}><SB.GradeBadge g={{ key: k, label: SB.LABELS[k], color: SB.COLORS[k] }} small /><b className="num" style={{ color: "var(--text)" }}>{r[k].w}–{r[k].l}</b></span>))}
                {r.pending > 0 && <span>{r.pending} pending</span>}
              </div>}
            </a>
          );
        })}
      </div>

      <UI.H2>How it works</UI.H2>
      <div className="steps">
        <div className="step"><b>The model plays the game</b><span>Team and player ratings, blended with the betting market, feed a simulation that plays each game thousands of times.</span></div>
        <div className="step"><b>It compares with Kalshi</b><span>A Kalshi contract pays $1 if it wins. If the model says 60% and the price is 50¢, that's a +10¢ edge.</span></div>
        <div className="step"><b>You get a grade and an amount</b><span>STRONG and GOOD bets are the ones worth making. The amount scales from your base bet in <a className="link" href="settings.html">Settings</a>.</span></div>
      </div>

      <div className="ss-foot">Model outputs are estimates from public data, not guarantees. This is not professional betting advice. Never bet more than you can afford to lose.</div>
    </UI.Shell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
