<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;
const SB = window.SharpBets;
const UI = window.SharpUI;
const { GradeBadge, ChanceLine, GradeLegend, BetButton, SortTh, sortRows, RecordCard } = SB;

// ── Constants ─────────────────────────────────────────────────────────────────
const SPORT = "wnba";
const ESPN_SB = "https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard";
const KX_SERIES = { win: "KXWNBAGAME", spread: "KXWNBASPREAD", total: "KXWNBATOTAL" };
const KX_STATUS = "open";             // offseason: nothing open until next season
const WIDE_GAP = 6;                   // bid/ask gap (cents) above which a price isn't real (settings.hideWide)
const SIM_CACHE_KEY = "sharp_sim_cache_wnba_v2_" + new Date().toLocaleDateString("en-CA");
const LEAGUE_AVG = 103;
const HCA = 2.5;

// ── Team Parameters (2025 WNBA Season) ───────────────────────────────────────
// ortg: offensive rating (pts per 100 poss), drtg: defensive rating, pace: possessions per 40 min
// kx: the name Kalshi uses for the team in market titles (city / location)
const TEAM_PARAMS = {
  "New York Liberty":       { abbr:"NYL", kx:"New York",     ortg:110, drtg:97,  pace:84, color:"#6ECEB2" },
  "Las Vegas Aces":         { abbr:"LVA", kx:"Las Vegas",    ortg:108, drtg:99,  pace:85, color:"#C8B400" },
  "Minnesota Lynx":         { abbr:"MIN", kx:"Minnesota",    ortg:107, drtg:98,  pace:83, color:"#236192" },
  "Connecticut Sun":        { abbr:"CON", kx:"Connecticut",  ortg:105, drtg:100, pace:82, color:"#E2632A" },
  "Indiana Fever":          { abbr:"IND", kx:"Indiana",      ortg:104, drtg:102, pace:87, color:"#FFCD00" },
  "Seattle Storm":          { abbr:"SEA", kx:"Seattle",      ortg:103, drtg:101, pace:83, color:"#2C5234" },
  "Atlanta Dream":          { abbr:"ATL", kx:"Atlanta",      ortg:103, drtg:103, pace:85, color:"#E31837" },
  "Chicago Sky":            { abbr:"CHI", kx:"Chicago",      ortg:102, drtg:104, pace:84, color:"#418FDE" },
  "Phoenix Mercury":        { abbr:"PHX", kx:"Phoenix",      ortg:101, drtg:104, pace:86, color:"#CB6015" },
  "Dallas Wings":           { abbr:"DAL", kx:"Dallas",       ortg:101, drtg:106, pace:87, color:"#C4D600" },
  "Washington Mystics":     { abbr:"WAS", kx:"Washington",   ortg:100, drtg:105, pace:83, color:"#C8102E" },
  "Los Angeles Sparks":     { abbr:"LAS", kx:"Los Angeles",  ortg:100, drtg:107, pace:84, color:"#702F8A" },
  "Golden State Valkyries": { abbr:"GSV", kx:"Golden State", ortg:100, drtg:106, pace:85, color:"#1D428A" },
  "Portland Fire":          { abbr:"POR", kx:"Portland",     ortg:99,  drtg:107, pace:84, color:"#E03A3E" },
};

// ── Simulation ────────────────────────────────────────────────────────────────
function randNormal(mean, std) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function simulateWNBAGame(homeTeam, awayTeam) {
  const home = TEAM_PARAMS[homeTeam];
  const away = TEAM_PARAMS[awayTeam];

  // Multiplicative efficiency adjustment
  const homeEff = (home.ortg / LEAGUE_AVG) * (away.drtg / LEAGUE_AVG) * LEAGUE_AVG;
  const awayEff = (away.ortg / LEAGUE_AVG) * (home.drtg / LEAGUE_AVG) * LEAGUE_AVG;
  const pace = (home.pace + away.pace) / 2;

  const homeExpPts = homeEff * pace / 100 + HCA / 2;
  const awayExpPts = awayEff * pace / 100 - HCA / 2;

  // Quarter-by-quarter simulation (std dev ~7.5 pts per quarter)
  const Q_STD = 7.5;
  const homeQpts = [], awayQpts = [];
  for (let q = 0; q < 4; q++) {
    homeQpts.push(Math.max(8, Math.round(randNormal(homeExpPts / 4, Q_STD))));
    awayQpts.push(Math.max(8, Math.round(randNormal(awayExpPts / 4, Q_STD))));
  }

  let homeScore = homeQpts.reduce((a, b) => a + b, 0);
  let awayScore = awayQpts.reduce((a, b) => a + b, 0);
  const homeH1 = homeQpts[0] + homeQpts[1];
  const awayH1 = awayQpts[0] + awayQpts[1];

  // OT for ties
  if (homeScore === awayScore) {
    const otH = Math.max(0, Math.round(randNormal(homeExpPts / 10, 4)));
    const otA = Math.max(0, Math.round(randNormal(awayExpPts / 10, 4)));
    if (otH >= otA) { homeScore += otH + 2; awayScore += otA; }
    else { awayScore += otA + 2; homeScore += otH; }
  }

  return { homeScore, awayScore, homeH1, awayH1 };
}

function runWNBASim(homeTeam, awayTeam) {
  if (!TEAM_PARAMS[homeTeam] || !TEAM_PARAMS[awayTeam]) return null;
  const n = 100000;
  let homeWins = 0, awayWins = 0, sumH = 0, sumA = 0, sumH1 = 0;
  const marginHist = {}, totalHist = {}, scoreFreq = {};

  for (let i = 0; i < n; i++) {
    const { homeScore, awayScore, homeH1, awayH1 } = simulateWNBAGame(homeTeam, awayTeam);
    if (homeScore > awayScore) homeWins++; else awayWins++;
    sumH += homeScore; sumA += awayScore; sumH1 += homeH1 + awayH1;
    const m = homeScore - awayScore, t = homeScore + awayScore;
    marginHist[m] = (marginHist[m] || 0) + 1;
    totalHist[t] = (totalHist[t] || 0) + 1;
    const k = awayScore + "-" + homeScore;
    scoreFreq[k] = (scoreFreq[k] || 0) + 1;
  }

  const fmt = (v, d = 1) => parseFloat(v).toFixed(d);
  const topScores = Object.entries(scoreFreq).sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([score, count]) => ({ score, count, pct: ((count / n) * 100).toFixed(1) }));

  return {
    homeTeam, awayTeam, n,
    hWPct: fmt(homeWins / n * 100), aWPct: fmt(awayWins / n * 100),
    hWins: homeWins, aWins: awayWins,
    avgHome: fmt(sumH / n), avgAway: fmt(sumA / n),
    avgTotal: fmt((sumH + sumA) / n), avgH1: fmt(sumH1 / n), avgSpread: fmt((sumH - sumA) / n),
    marginHist, totalHist,   // home margin and game total → sim count; prices any Kalshi strike
    topScores,
  };
}

// Share of sims where the value lands in (lo, hi) — open bounds; null = unbounded
function histProb(hist, n, lo, hi) {
  let c = 0;
  for (const k in hist) { const v = +k; if ((lo == null || v > lo) && (hi == null || v < hi)) c += hist[k]; }
  return c / n;
}

// ── Games (ESPN free scoreboard) ─────────────────────────────────────────────
const etDate = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" });

async function fetchWNBAGames() {
  const today = new Date().toLocaleDateString("en-CA");
  const r = await fetch(ESPN_SB + "?dates=" + today.replace(/-/g, ""));
  if (!r.ok) throw new Error("ESPN scoreboard " + r.status);
  const d = await r.json();
  return (d.events || []).map(e => {
    const c = (e.competitions || [])[0]; if (!c) return null;
    const home = c.competitors.find(t => t.homeAway === "home"), away = c.competitors.find(t => t.homeAway === "away");
    if (!home || !away) return null;
    return {
      id: e.id, commenceTime: e.date, state: e.status && e.status.type && e.status.type.state,
      homeTeam: home.team.displayName, awayTeam: away.team.displayName,
      homeLoc: home.team.location, awayLoc: away.team.location,
    };
  }).filter(g => g && g.state !== "post" && new Date(g.commenceTime).toLocaleDateString("en-CA") === today);
}

// ── Kalshi (free public API via the site's /api/kx proxy) ────────────────────
// A proxy that's down or missing answers with an HTML page; treat anything that isn't JSON as "couldn't load".
async function kxJSON(url) {
  const r = await fetch(url);
  const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch (e) { throw new Error("Kalshi answered with something that isn't JSON (HTTP " + r.status + ")"); }
  if (!r.ok) throw new Error((d && d.error) || ("Kalshi HTTP " + r.status));
  return d;
}
async function fetchKalshiWNBA(status = KX_STATUS) {
  const [ev, ...lists] = await Promise.all([
    kxJSON("/api/kx/events?series_ticker=" + KX_SERIES.win + "&status=" + status + "&limit=200"),
    ...Object.values(KX_SERIES).map(s => kxJSON("/api/kx/markets?series_ticker=" + s + "&status=" + status + "&limit=1000")),
  ]);
  return { events: ev.events || [], markets: lists.flatMap(l => l.markets || []), ts: Date.now() };
}

const kxCents = (m, f) => {
  const d = m[f + "_dollars"];
  if (d != null && d !== "") { const v = parseFloat(d); return isFinite(v) ? Math.round(v * 100) : null; }
  return m[f] != null ? +m[f] : null;
};
const normCity = (s) => String(s || "").toLowerCase().replace(/[^a-z]/g, "");
const MONTHS = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, OCT:10, NOV:11, DEC:12 };
// "26OCT31ATLGS" → "2026-10-31"
function kxSuffixDate(suf) {
  const m = /^(\d\d)([A-Z]{3})(\d\d)/.exec(suf || ""); if (!m || !MONTHS[m[2]]) return null;
  return "20" + m[1] + "-" + String(MONTHS[m[2]]).padStart(2, "0") + "-" + m[3];
}

// One Kalshi market → { kind: win|spread|total, city, lo/hi strike, prices }
function parseKxMarket(m) {
  const t = m.ticker || "", series = t.split("-")[0];
  const suffix = String(m.event_ticker || "").split("-").slice(1).join("-");
  const yesBid = kxCents(m, "yes_bid"), yesAsk = kxCents(m, "yes_ask");
  const noBid = m.no_bid_dollars != null || m.no_bid != null ? kxCents(m, "no_bid") : (yesAsk != null ? 100 - yesAsk : null);
  const noAsk = m.no_ask_dollars != null || m.no_ask != null ? kxCents(m, "no_ask") : (yesBid != null ? 100 - yesBid : null);
  const base = { ticker: t, suffix, title: m.title, sub: m.yes_sub_title, yesBid, yesAsk, noBid, noAsk, result: m.result,
    floor: m.floor_strike != null ? +m.floor_strike : null, cap: m.cap_strike != null ? +m.cap_strike : null, strikeType: m.strike_type };
  if (series === KX_SERIES.win) return { ...base, kind: "win", city: m.yes_sub_title };
  if (series === KX_SERIES.spread) {
    const mm = String(m.yes_sub_title || m.title || "").match(/^(.*?)\s+wins by over\s+([\d.]+)/i);
    if (!mm) return null;
    return { ...base, kind: "spread", city: mm[1], floor: base.floor != null ? base.floor : parseFloat(mm[2]), strikeType: base.strikeType || "greater" };
  }
  if (series === KX_SERIES.total) {
    const mm = String(m.yes_sub_title || m.title || "").match(/over\s+([\d.]+)/i);
    const floor = base.floor != null ? base.floor : mm ? parseFloat(mm[1]) : null;
    return floor != null || base.cap != null ? { ...base, kind: "total", floor, strikeType: base.strikeType || "greater" } : null;
  }
  return null;
}

// Find this game's Kalshi matchup (event ticker suffix like 26OCT31ATLGS) from the win markets / event titles.
function matchKalshiGame(game, kx) {
  if (!kx || !kx.markets) return null;
  const hc = normCity((TEAM_PARAMS[game.homeTeam] || {}).kx || game.homeLoc), ac = normCity((TEAM_PARAMS[game.awayTeam] || {}).kx || game.awayLoc);
  if (!hc || !ac) return null;
  const bySuffix = {};
  for (const m of kx.markets) {
    const p = parseKxMarket(m); if (!p || !p.suffix) continue;
    (bySuffix[p.suffix] = bySuffix[p.suffix] || []).push(p);
  }
  const cands = Object.keys(bySuffix).filter(suf => {
    const cities = new Set(bySuffix[suf].filter(p => p.kind === "win" || p.kind === "spread").map(p => normCity(p.city)));
    if (cities.has(hc) && cities.has(ac)) return true;
    const ev = (kx.events || []).find(e => String(e.event_ticker).endsWith("-" + suf));
    const title = normCity(ev && ev.title);
    return !!title && title.includes(hc) && title.includes(ac);
  });
  if (!cands.length) return null;
  const want = etDate(game.commenceTime);
  const dist = (suf) => { const d = kxSuffixDate(suf); return d ? Math.abs(new Date(d) - new Date(want)) : 9e15; };
  const suffix = cands.sort((a, b) => dist(a) - dist(b))[0];
  if (dist(suffix) > 2 * 86400000) return null;   // same teams but a different game
  return { suffix, markets: bySuffix[suffix] };
}

// Model chance that the market settles YES (0-1), from the sim's distributions
function modelYes(p, agg, game) {
  const hc = normCity((TEAM_PARAMS[game.homeTeam] || {}).kx || game.homeLoc);
  const isHome = normCity(p.city) === hc;
  if (p.kind === "win") return (isHome ? +agg.hWPct : +agg.aWPct) / 100;
  if (p.kind === "spread") {
    // "<team> wins by over X": team margin > X. Home margin from the sim; away margin is its negative.
    return isHome ? histProb(agg.marginHist, agg.n, p.floor, null) : histProb(agg.marginHist, agg.n, null, -p.floor);
  }
  if (p.kind === "total") {
    if (p.strikeType === "less") return histProb(agg.totalHist, agg.n, null, p.cap != null ? p.cap : p.floor);
    if (p.strikeType === "between") return histProb(agg.totalHist, agg.n, p.floor - 1e-9, p.cap + 1e-9);
    return histProb(agg.totalHist, agg.n, p.floor, null);
  }
  return null;
}

function teamName(game, city) {
  const c = normCity(city);
  if (c === normCity((TEAM_PARAMS[game.homeTeam] || {}).kx || game.homeLoc)) return game.homeTeam;
  if (c === normCity((TEAM_PARAMS[game.awayTeam] || {}).kx || game.awayLoc)) return game.awayTeam;
  return city;
}
// Plain-English label for each side of a market
function sideLabels(p, game) {
  if (p.kind === "win") { const t = teamName(game, p.city); return { yes: t + " win", no: t + " lose", what: "Winner" }; }
  if (p.kind === "spread") { const t = teamName(game, p.city); const pts = Math.floor(p.floor) + 1; return { yes: t + " win by " + pts + "+", no: t + " don't win by " + pts + "+", what: "Spread" }; }
  if (p.strikeType === "less") { const x = p.cap != null ? p.cap : p.floor; return { yes: "Under " + x + " pts", no: "Over " + x + " pts", what: "Total" }; }
  if (p.strikeType === "between") return { yes: "Total " + p.floor + "–" + p.cap, no: "Total not " + p.floor + "–" + p.cap, what: "Total" };
  return { yes: "Over " + p.floor + " pts", no: "Under " + p.floor + " pts", what: "Total" };
}

// Every priced Kalshi market for one game → a row on its best side (the one with the bigger edge)
function buildKalshiRows(game, agg, kx, settings) {
  const match = matchKalshiGame(game, kx);
  if (!match || !agg) return { match, rows: [] };
  const rows = [];
  for (const p of match.markets) {
    const py = modelYes(p, agg, game); if (py == null) continue;
    if (settings.hideWide && p.yesBid != null && p.yesAsk != null && p.yesAsk - p.yesBid > WIDE_GAP) continue;
    const lab = sideLabels(p, game);
    const sides = [
      { side: "yes", price: p.yesAsk, chance: py, label: lab.yes },
      { side: "no", price: p.noAsk, chance: 1 - py, label: lab.no },
    ].filter(s => s.price > 0 && s.price < 100).map(s => ({ ...s, g: SB.grade(s.chance, s.price, settings) })).filter(s => s.g);
    if (!sides.length) continue;
    const best = sides.sort((a, b) => b.g.edge - a.g.edge)[0];
    rows.push({
      key: p.ticker + "|" + best.side, ticker: p.ticker, side: best.side, kind: p.kind, what: lab.what, label: best.label,
      price: best.price, chance: best.g.chance, edge: best.g.edge, g: best.g, stake: SB.stake(best.g, SPORT, settings),
      gameId: game.id, gameDate: etDate(game.commenceTime), home: game.homeTeam, away: game.awayTeam,
      match: (TEAM_PARAMS[game.awayTeam]?.abbr || game.awayTeam) + " @ " + (TEAM_PARAMS[game.homeTeam]?.abbr || game.homeTeam),
    });
  }
  return { match, rows };
}

function formatAge(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  return hrs + "h " + (mins % 60) + "m ago";
}

// ── Shared UI ────────────────────────────────────────────────────────────────
const abbr = (team) => (TEAM_PARAMS[team] && TEAM_PARAMS[team].abbr) || String(team || "").split(" ").pop();
const tipoff = (iso) => new Date(iso).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });
const pickOf = (r) => ({ ticker: r.ticker, side: r.side, price: r.price, chance: r.chance, label: r.label, sub: r.away + " @ " + r.home + " · " + r.what, sport: SPORT, grade: r.g });
const rowMeta = (r) => r.what + " · " + r.side.toUpperCase() + " on Kalshi" + (r.g.longShot ? " · long shot" : "");
const isOffseason = () => { const m = new Date().getMonth(); return m >= 9 || m <= 3; };   // Oct–Apr: no regular-season games

// Friendly empty state: a title, one or two sentences and where to go instead
function Empty({ ico, title, children, links }) {
  return (
    <div className="card empty">
      {ico && <div className="empty-ico" aria-hidden="true">{ico}</div>}
      <div className="empty-title">{title}</div>
      {children && <div className="empty-body">{children}</div>}
      {links && <div className="empty-actions">{links.map(([href, label]) => <a key={href} href={href} className="btn btn-sm">{label}</a>)}</div>}
    </div>
  );
}
const ELSEWHERE = [["nfl.html", "NFL picks"], ["cfb.html", "College picks"], ["parlays.html", "All-sport parlays"]];

// What to show when there are no games to grade, depending on why
function NoGames({ kx }) {
  const noMarkets = kx.status === "ok" && !kx.markets.length;
  return (
    <Empty ico="🏀" title={isOffseason() ? "The WNBA is in its off-season" : "No WNBA games today"} links={ELSEWHERE}>
      {isOffseason()
        ? "There are no games on today's schedule" + (noMarkets ? " and Kalshi has no WNBA markets open, which is normal until next season. " : ". ") + "Picks show up here automatically once games are back. Football is in season now."
        : "Nothing on today's schedule" + (noMarkets ? " and no Kalshi markets open" : "") + ". Check back on the next game day."}
      {kx.status === "error" && <div className="tiny muted" style={{ marginTop: 8 }}>Kalshi prices couldn't be loaded either ({kx.error}).</div>}
    </Empty>
  );
}

function KalshiNote({ kx }) {
  if (kx.status === "error") return <div className="note warn">Kalshi prices couldn't be loaded ({kx.error}). Picks need a Kalshi price to be graded, so none are shown. Try Refresh at the top.</div>;
  if (kx.status === "loading") return <UI.Status>Loading Kalshi prices…</UI.Status>;
  return null;
}

// Win chances as one split bar: away on the left, home on the right
function WinSplit({ game, agg }) {
  const a = +agg.aWPct, hm = +agg.hWPct;
  return (
    <div>
      <div className="row" style={{ justifyContent: "space-between", marginBottom: 6 }}>
        <div><div className="num" style={{ fontSize: 22, fontWeight: 700 }}>{a.toFixed(0)}%</div><div className="tiny muted">{abbr(game.awayTeam)} win</div></div>
        <div style={{ textAlign: "right" }}><div className="num" style={{ fontSize: 22, fontWeight: 700 }}>{hm.toFixed(0)}%</div><div className="tiny muted">{abbr(game.homeTeam)} win</div></div>
      </div>
      <div role="img" aria-label={`${abbr(game.awayTeam)} ${a.toFixed(0)}%, ${abbr(game.homeTeam)} ${hm.toFixed(0)}%`} style={{ display: "flex", gap: 2, height: 10 }}>
        <div style={{ width: a + "%", background: "var(--series-b)", borderRadius: "999px 0 0 999px" }} />
        <div style={{ width: hm + "%", background: "var(--series-a)", borderRadius: "0 999px 999px 0" }} />
      </div>
    </div>
  );
}

// Final margin or game total across every simulated game, from the sim's histograms
function Outcomes({ game, agg }) {
  const [mode, setMode] = useState("margin");
  if (!agg.marginHist || !agg.totalHist) return null;
  const A = abbr(game.awayTeam), H = abbr(game.homeTeam);
  let bars, labelOf, note;
  if (mode === "margin") {
    bars = [];
    for (let m = -25; m <= 25; m++) {
      if (!m) continue;
      const p = (agg.marginHist[m] || 0) / agg.n * 100;
      bars.push({ v: p, m, color: m > 0 ? "var(--series-a)" : "var(--series-b)", tip: `${m > 0 ? H : A} by ${Math.abs(m)}: ${p.toFixed(1)}%` });
    }
    labelOf = (i, b) => Math.abs(b.m) % 5 === 0 ? Math.abs(b.m) : null;
    note = "How much the game is won by. Left of center the away team wins, right of center the home team wins.";
  } else {
    const keys = Object.keys(agg.totalHist).map(Number).sort((x, y) => x - y);
    let c = 0, lo = keys[0], hi = keys[keys.length - 1];
    for (const k of keys) { c += agg.totalHist[k]; if (c / agg.n < 0.01) lo = k; if (c / agg.n <= 0.99) hi = k; }
    const avg = Math.round(+agg.avgTotal);
    bars = [];
    for (let t = lo; t <= hi; t++) {
      const p = (agg.totalHist[t] || 0) / agg.n * 100;
      bars.push({ v: p, t, color: "var(--series-a)", strong: t === avg, dim: t !== avg, tip: `${t} total points: ${p.toFixed(1)}%` });
    }
    labelOf = (i, b) => b.t % 10 === 0 ? b.t : null;
    note = `Combined points for both teams. The bright bar is the average, about ${agg.avgTotal}.`;
  }
  return (
    <div className="card" style={{ marginBottom: 12 }}>
      <div className="row" style={{ justifyContent: "space-between", flexWrap: "wrap", marginBottom: 4 }}>
        <div style={{ fontWeight: 650 }}>How the game ends</div>
        <UI.Seg options={[["margin", "Margin"], ["total", "Total"]]} value={mode} onChange={setMode} />
      </div>
      <div className="small text-2" style={{ marginBottom: 10 }}>{note}</div>
      <UI.BarChart bars={bars} height={140} yFmt={v => v + "%"} ariaLabel={mode === "margin" ? "Final margin distribution" : "Game total distribution"} labelOf={labelOf} />
      {mode === "margin" && <div className="legend"><span><i style={{ background: "var(--series-b)" }} />{A} wins by</span><span><i style={{ background: "var(--series-a)" }} />{H} wins by</span></div>}
    </div>
  );
}

// ── Game Sim View ─────────────────────────────────────────────────────────────
function GameSimView({ game, agg, running, onRun, runCount, kx, rowsInfo }) {
  const [sort, setSort] = useState({ k: "edge", dir: -1 });
  const { match, rows } = rowsInfo || { match: null, rows: [] };
  const best = rows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD").sort((a, b) => b.edge - a.edge);
  const sorted = sortRows(rows, sort, (r, k) => r[k]);
  const when = new Date(game.commenceTime).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
  const A = abbr(game.awayTeam), H = abbr(game.homeTeam);
  const spread = agg ? +agg.avgSpread : 0;

  return (
    <div>
      <div className="card" style={{ marginBottom: 12 }}>
        <div className="row" style={{ alignItems: "flex-start" }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="match-title">{game.awayTeam} <span className="muted" style={{ fontWeight: 400 }}>@</span> {game.homeTeam}</div>
            <div className="small muted" style={{ marginTop: 2 }}>{when}</div>
          </div>
          <button className="btn btn-sm" onClick={onRun} disabled={running} style={{ flex: "none" }}>
            {running ? "Simulating…" : "Run again"}
          </button>
        </div>
        <div style={{ marginTop: 14 }}>
          {agg ? <WinSplit game={game} agg={agg} /> : <div className="row small text-2"><span className="spinner" />Simulating 100,000 games…</div>}
        </div>
        {agg && <div className="tiny muted" style={{ marginTop: 8 }}>{agg.n.toLocaleString()} simulated games{runCount > 1 ? ` · run ${runCount}` : ""}</div>}
      </div>

      {agg && <div className="tiles" style={{ marginBottom: 12 }}>
        <UI.Tile label="Model spread" value={Math.abs(spread) < 0.05 ? "Even" : `${spread > 0 ? H : A} −${Math.abs(spread).toFixed(1)}`} sub="average winning margin" />
        <UI.Tile label="Model total" value={agg.avgTotal} sub={`first half ${agg.avgH1}`} />
        <UI.Tile label={`${A} points`} value={agg.avgAway} sub="average, away" />
        <UI.Tile label={`${H} points`} value={agg.avgHome} sub="average, home" />
      </div>}

      {agg && <Outcomes game={game} agg={agg} />}

      <UI.H2 aside={match && agg && rows.length ? `${rows.length} markets` : null}>Bets on Kalshi</UI.H2>
      {kx.status !== "ok" ? <KalshiNote kx={kx} />
        : !match ? <div className="note">No Kalshi markets are open for this game yet. They usually open a day or two before tipoff.</div>
        : !agg ? <UI.Status>Waiting for the simulation to finish…</UI.Status>
        : !rows.length ? <div className="note">Kalshi has markets for this game, but none have a real price right now (no asks, or the buy and sell prices are more than {WIDE_GAP}¢ apart).</div>
        : <>
            {best.length > 0 && <div style={{ marginBottom: 12 }}>
              <UI.PickCard top g={best[0].g} title={best[0].label} meaning={rowMeta(best[0])} meta={`${game.awayTeam} @ ${game.homeTeam}`} when={tipoff(game.commenceTime)} pick={pickOf(best[0])} />
            </div>}
            <div className="row" style={{ marginBottom: 10, flexWrap: "wrap" }}>
              <span className="small muted">Sort by</span>
              <UI.Seg options={[["edge", "Best edge"], ["chance", "Most likely"], ["price", "Cheapest"]]} value={sort.k} onChange={k => setSort({ k, dir: k === "price" ? 1 : -1 })} />
            </div>
            <UI.PickList>
              {sorted.map(r => <UI.PickRow key={r.key} g={r.g} title={r.label} meta={rowMeta(r)} badge pick={pickOf(r)} />)}
            </UI.PickList>
          </>}

      <UI.H2>Model inputs</UI.H2>
      <div className="tbl-wrap">
        <table className="tbl">
          <thead><tr><th>Team</th><th className="r">Offense</th><th className="r">Defense</th><th className="r">Net</th><th className="r">Pace</th></tr></thead>
          <tbody>
            {[{ t: game.awayTeam, role: "Away" }, { t: game.homeTeam, role: "Home" }].map(({ t, role }) => {
              const p = TEAM_PARAMS[t] || {}, net = p.ortg - p.drtg;
              return (
                <tr key={t}>
                  <td><div style={{ fontWeight: 600 }}>{abbr(t)}</div><div className="sub">{role}</div></td>
                  <td className="r num">{p.ortg}</td>
                  <td className="r num">{p.drtg}</td>
                  <td className="r num" style={{ fontWeight: 600 }}>{net >= 0 ? "+" : "−"}{Math.abs(net)}</td>
                  <td className="r num">{p.pace}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <div className="tiny muted" style={{ marginTop: 6 }}>Points scored and allowed per 100 possessions, and possessions per 40 minutes, from the 2025 season. Lower defense is better.</div>

      {agg && agg.topScores && agg.topScores.length > 0 && <>
        <UI.H2>Most likely final scores</UI.H2>
        <div className="small text-2" style={{ marginBottom: 10 }}>Basketball scores spread out a lot: even the most common final score happens in only {agg.topScores[0].pct}% of simulated games.</div>
        <div className="wrap-row">
          {agg.topScores.map(({ score, pct }) => {
            const [as, hs] = score.split("-");
            return <span key={score} className="chip num" style={{ height: 30 }}>{A} {as} – {H} {hs}<span className="muted" style={{ fontWeight: 500 }}>{pct}%</span></span>;
          })}
        </div>
      </>}
    </div>
  );
}

// ── Top Picks Tab ─────────────────────────────────────────────────────────────
function TopPicksTab({ games, simData, kx, allRows, settings }) {
  const simsReady = games.filter(g => simData[g.homeTeam + "|" + g.awayTeam]).length;
  const byId = {}; games.forEach(g => { byId[g.id] = g; });
  const top = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD" || r.g.key === "SMALL")
    .sort((a, b) => a.g.rank - b.g.rank || b.edge - a.edge);
  const best = top.filter(r => r.g.rank <= 1), rest = top.filter(r => r.g.rank > 1);
  const when = (r) => byId[r.gameId] ? tipoff(byId[r.gameId].commenceTime) : null;
  return (
    <div>
      {simsReady < games.length && <UI.Status>{simsReady} of {games.length} games simulated…</UI.Status>}
      {kx.status !== "ok" ? <KalshiNote kx={kx} />
        : !allRows.length ? <div className="note">No Kalshi markets are open for today's games yet, so there's nothing to grade. They usually open a day or two before tipoff.</div>
        : !top.length ? <div className="note">Every Kalshi price today is about right or too high. No bets worth making. A bet shows up here once the model's chance to cash beats the price by at least {settings.small.minEdge}¢.</div>
        : <>
            <UI.H2 aside={best.length ? `${best.length} strong or good` : null}>Best bets right now</UI.H2>
            {best.length ? <div className="picks-grid two">
              {best.map((r, i) => <UI.PickCard key={r.key} top={i === 0} g={r.g} title={r.label} meaning={rowMeta(r)} when={when(r)} meta={`${r.away} @ ${r.home}`} pick={pickOf(r)} />)}
            </div> : <div className="note">No STRONG or GOOD bets right now. The smaller edges below are close calls: bet small or skip.</div>}
            {rest.length > 0 && <>
              <UI.H2 aside={`${rest.length}`}>Smaller edges</UI.H2>
              <UI.PickList>
                {rest.map(r => <UI.PickRow key={r.key} g={r.g} title={r.label} meta={`${r.match}${when(r) ? " · " + when(r) : ""} · ${r.what}`} pick={pickOf(r)} />)}
              </UI.PickList>
            </>}
          </>}
    </div>
  );
}

// ── Parlay Builder (STRONG / GOOD legs only, one per game) ───────────────────
function buildWNBAParlays(legs) {
  function buildCombos(size) {
    const results = [];
    (function combine(start, current) {
      if (current.length === size) { results.push([...current]); return; }
      for (let i = start; i < legs.length; i++) {
        if (!current.some(l => l.gameId === legs[i].gameId)) { current.push(legs[i]); combine(i+1, current); current.pop(); }
      }
    })(0, []);
    return results;
  }
  const parlays = [];
  [2,3,4,5].forEach(size => {
    buildCombos(size)
      .map(combo => ({ legs:combo, size, jointProb:combo.reduce((acc,leg) => acc * leg.chance/100, 1) }))
      .sort((a,b) => b.jointProb - a.jointProb).slice(0,15)
      .forEach(p => parlays.push(p));
  });
  return parlays.sort((a,b) => b.jointProb - a.jointProb);
}

function WNBAParlayTab({ kx, allRows, noGames }) {
  const [filterSize, setFilterSize] = useState("all");
  const legs = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD");
  const games = new Set(legs.map(l => l.gameId)).size;

  if (noGames) return <NoGames kx={kx} />;
  if (kx.status !== "ok") return <KalshiNote kx={kx} />;
  if (games < 2) {
    return (
      <Empty title="Not enough bets for a parlay yet" links={[["parlays.html", "All-sport parlays"]]}>
        Parlays are built from STRONG and GOOD bets in at least 2 different games. Right now there {legs.length === 1 ? "is 1 such bet" : "are " + legs.length + " such bets"} across {games} game{games === 1 ? "" : "s"}.
      </Empty>
    );
  }

  const parlays = buildWNBAParlays(legs);
  const filtered = filterSize==="all" ? parlays : parlays.filter(p=>p.size===parseInt(filterSize));

  return (
    <div>
      <div className="small text-2" style={{ marginBottom: 10 }}>
        {legs.length} STRONG or GOOD bets across {games} games, one per game, ranked by the chance every leg cashes.
      </div>
      <div className="row" style={{ marginBottom: 12, flexWrap: "wrap" }}>
        <UI.Seg options={[["all", "All"], ["2", "2 legs"], ["3", "3 legs"], ["4", "4 legs"], ["5", "5 legs"]]} value={filterSize} onChange={setFilterSize} />
        <span className="tiny muted" style={{ marginLeft: "auto" }}>{filtered.length} parlays</span>
      </div>

      {filtered.length===0 && <div className="note">Not enough games with STRONG or GOOD bets for a {filterSize}-leg parlay.</div>}

      {filtered.map((parlay,pi) => {
        const jp = parlay.jointProb;
        const fairOdds = jp > 0 ? (jp < 0.5 ? "+" + Math.round((1/jp-1)*100) : "-" + Math.round((jp/(1-jp))*100)) : "—";
        return (
          <div key={pi} className="card parlay-card">
            <div className="parlay-head">
              <div>
                <div style={{ fontWeight: 650 }}>{parlay.size}-leg parlay</div>
                <div className="tiny muted">#{pi + 1} · fair odds {fairOdds}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div className="num" style={{ fontSize: 22, fontWeight: 700, lineHeight: 1.1 }}>{(jp*100).toFixed(1)}%</div>
                <div className="tiny muted">chance all cash</div>
              </div>
            </div>
            <UI.PickList>
              {parlay.legs.map(leg => <UI.PickRow key={leg.key} g={leg.g} title={leg.label} meta={leg.match + " · " + leg.what} badge />)}
            </UI.PickList>
          </div>
        );
      })}
      <div className="tiny muted" style={{ marginTop: 12 }}>Legs are treated as independent because they're in different games. Kalshi doesn't sell these as one parlay: place each leg on its game's tab.</div>
    </div>
  );
}

function App() {
  const settings = SB.useSettings();
  const [games, setGames] = useState([]);
  const [activeTab, setActiveTab] = useState("top_picks");
  const [simData, setSimData] = useState(() => {
    try { return JSON.parse(localStorage.getItem(SIM_CACHE_KEY) || "{}"); } catch(e) { return {}; }
  });
  const [runningId, setRunningId] = useState(null);
  const [runCounts, setRunCounts] = useState({});
  const [lastFetched, setLastFetched] = useState(null);
  const [loadingGames, setLoadingGames] = useState(false);
  const [gamesError, setGamesError] = useState("");
  const [kx, setKx] = useState({ status: "loading" });

  function saveSim(key, result) {
    setSimData(prev => {
      const next = { ...prev, [key]: result };
      try { localStorage.setItem(SIM_CACHE_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }

  // Auto-sim every game once, skipping ones already cached today
  const autoRanRef = useRef(false);
  useEffect(() => {
    if (!games.length || autoRanRef.current) return;
    autoRanRef.current = true;
    const needsSim = games.filter(g => TEAM_PARAMS[g.homeTeam] && TEAM_PARAMS[g.awayTeam] && !simData[g.homeTeam + "|" + g.awayTeam]);
    let idx = 0;
    function runNext() {
      if (idx >= needsSim.length) return;
      const game = needsSim[idx++];
      const key = game.homeTeam + "|" + game.awayTeam;
      setRunningId(key);
      setTimeout(() => {
        const result = runWNBASim(game.homeTeam, game.awayTeam);
        if (result) { saveSim(key, result); setRunCounts(prev => ({ ...prev, [key]: 1 })); }
        setRunningId(null);
        setTimeout(runNext, 30);
      }, 50);
    }
    setTimeout(runNext, 200);
  }, [games]);

  async function loadAll() {
    setLoadingGames(true); setGamesError("");
    setKx(k => k.status === "ok" ? k : { status: "loading" });
    const gp = fetchWNBAGames().then(setGames).catch(e => setGamesError(e.message));
    const kp = fetchKalshiWNBA().then(d => setKx({ status: "ok", ...d })).catch(e => setKx({ status: "error", error: e.message }));
    await Promise.all([gp, kp]);
    setLastFetched(Date.now());
    setLoadingGames(false);
  }
  useEffect(() => { loadAll(); }, []);

  function runSim(game) {
    if (!game || runningId) return;
    const key = game.homeTeam + "|" + game.awayTeam;
    setRunningId(key);
    setTimeout(() => {
      const result = runWNBASim(game.homeTeam, game.awayTeam);
      if (result) { saveSim(key, result); setRunCounts(prev => ({ ...prev, [key]: (prev[key] || 0) + 1 })); }
      setRunningId(null);
    }, 50);
  }

  // Kalshi rows for every game (best side of each market, graded)
  const rowsByGame = useMemo(() => {
    const out = {};
    if (kx.status !== "ok") return out;
    for (const g of games) out[g.id] = buildKalshiRows(g, simData[g.homeTeam + "|" + g.awayTeam], kx, settings);
    return out;
  }, [games, simData, kx, settings]);
  const allRows = useMemo(() => Object.values(rowsByGame).flatMap(x => x.rows), [rowsByGame]);
  const picks = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD");
  const picksKey = picks.map(r => r.key).sort().join(",");

  // STRONG / GOOD picks go on the shared record (logPicks dedupes; first grade sticks)
  useEffect(() => {
    if (!picks.length) return;
    SB.logPicks(picks.map(r => ({ sport: SPORT, gameId: r.gameId, gameDate: r.gameDate, home: r.home, away: r.away,
      market: r.label, ticker: r.ticker, side: r.side, chance: r.chance, price: r.price, tier: r.g.key })));
  }, [picksKey]);

  // Legs for the cross-sport parlay page (empty list once loaded on a day with no picks)
  useEffect(() => {
    if (loadingGames || kx.status === "loading") return;
    if (games.some(g => TEAM_PARAMS[g.homeTeam] && TEAM_PARAMS[g.awayTeam] && !simData[g.homeTeam + "|" + g.awayTeam])) return;
    const legs = picks.map(r => ({ matchId: r.gameId, match: r.away + " @ " + r.home, market: r.label, prob: r.chance / 100,
      probPct: r.chance.toFixed(1) + "%", tier: r.g.key, grade: r.g.label, price: r.price, edge: +r.edge.toFixed(1), ticker: r.ticker, side: r.side, sport: "WNBA" }));
    try { localStorage.setItem("sharp_xsport_legs_wnba_" + new Date().toLocaleDateString("en-CA"), JSON.stringify({ legs, ts: Date.now() })); } catch(e) {}
  }, [picksKey, loadingGames, kx.status, games, simData]);

  const activeGameIdx = activeTab.startsWith("game_") ? parseInt(activeTab.split("_")[1]) : 0;
  const isSpecialTab = activeTab === "top_picks" || activeTab === "parlays";
  const activeGame = isSpecialTab ? null : games[activeGameIdx];
  const gameKey = activeGame ? activeGame.homeTeam + "|" + activeGame.awayTeam : null;
  const edgeCount = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD" || r.g.key === "SMALL").length;

  const noGames = !loadingGames && games.length === 0 && !gamesError;
  const tabs = [
    ["top_picks", "Top picks", { count: edgeCount }],
    ["parlays", "Parlays"],
    ...games.map((g, i) => { const k = g.homeTeam + "|" + g.awayTeam; return ["game_" + i, `${abbr(g.awayTeam)} @ ${abbr(g.homeTeam)}`, { pending: runningId === k || (!simData[k] && !!TEAM_PARAMS[g.homeTeam] && !!TEAM_PARAMS[g.awayTeam]) }]; }),
  ];

  return (
    <UI.Shell active="wnba">
      <UI.PageHead eyebrow={"WNBA · priced on Kalshi" + (lastFetched ? " · updated " + formatAge(lastFetched) : "")}
        title="WNBA picks"
        sub="Every game simulated 100,000 times from team ratings and pace, then compared with Kalshi's price on every market."
        right={<button className="btn btn-sm" onClick={loadAll} disabled={loadingGames}>{loadingGames ? "Loading…" : "Refresh"}</button>} />
      <UI.Tabs tabs={tabs} value={activeTab} onChange={setActiveTab} />

      {gamesError && <div className="note bad" style={{ marginBottom: 12 }}>Today's games couldn't be loaded from ESPN ({gamesError}). Try Refresh.</div>}
      {loadingGames && games.length === 0 && <UI.Status>Loading today's WNBA games…</UI.Status>}

      {activeTab === "top_picks" && <>
        <GradeLegend sport={SPORT} />
        {noGames ? <NoGames kx={kx} /> : games.length > 0 && <TopPicksTab games={games} simData={simData} kx={kx} allRows={allRows} settings={settings} />}
        <UI.H2>Pick record</UI.H2>
        <RecordCard sport={SPORT} />
      </>}
      {activeTab === "parlays" && !(loadingGames && games.length === 0) && <WNBAParlayTab kx={kx} allRows={allRows} noGames={noGames} />}
      {!isSpecialTab && noGames && <NoGames kx={kx} />}
      {!isSpecialTab && activeGame && (!TEAM_PARAMS[activeGame.homeTeam] || !TEAM_PARAMS[activeGame.awayTeam]) && (
        <div className="note warn" style={{ marginBottom: 12 }}>
          {activeGame.awayTeam} @ {activeGame.homeTeam} can't be simulated yet: one of these teams isn't in the model's ratings.
        </div>
      )}
      {!isSpecialTab && activeGame && (
        <GameSimView
          game={activeGame}
          agg={simData[gameKey]}
          running={runningId === gameKey}
          runCount={runCounts[gameKey] || 0}
          onRun={() => runSim(activeGame)}
          kx={kx}
          rowsInfo={rowsByGame[activeGame.id]}
        />
      )}

      <div className="ss-foot">
        <div>How it works: each quarter is simulated from the two teams' offensive and defensive ratings and pace, with {HCA} points for home court (league average {LEAGUE_AVG} points per 100 possessions). Every Kalshi winner, spread and total market is priced from the full spread of simulated results; each row shows the side, YES or NO, with the bigger edge at its current price.</div>
        <div style={{ marginTop: 6 }}>Ratings from the 2025 WNBA season. Schedule from ESPN, prices from Kalshi's public market data. Edge is the model's chance minus Kalshi's price in cents. Not betting advice.</div>
      </div>
    </UI.Shell>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
