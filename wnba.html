const TEAM_PARAMS = {

// ── Simulation ────────────────────────────────────────────────────────────────
function randNormal(mean, std) {
  let u = 0, v = 0;
  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();
  return mean + std * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function simulateWNBAGame(homeTeam, awayTeam) {
  const home = TEAM_PARAMS[homeTeam];
  const away = TEAM_PARAMS[awayTeam];

  // Multiplicative efficiency adjustment
  const homeEff = (home.ortg / LEAGUE_AVG) * (away.drtg / LEAGUE_AVG) * LEAGUE_AVG;
  const awayEff = (away.ortg / LEAGUE_AVG) * (home.drtg / LEAGUE_AVG) * LEAGUE_AVG;
  const pace = (home.pace + away.pace) / 2;

  const homeExpPts = homeEff * pace / 100 + HCA / 2;
  const awayExpPts = awayEff * pace / 100 - HCA / 2;

  // Quarter-by-quarter simulation (std dev ~7.5 pts per quarter)
  const Q_STD = 7.5;
  const homeQpts = [], awayQpts = [];
  for (let q = 0; q < 4; q++) {
    homeQpts.push(Math.max(8, Math.round(randNormal(homeExpPts / 4, Q_STD))));
    awayQpts.push(Math.max(8, Math.round(randNormal(awayExpPts / 4, Q_STD))));
  }

  let homeScore = homeQpts.reduce((a, b) => a + b, 0);
  let awayScore = awayQpts.reduce((a, b) => a + b, 0);
  const homeH1 = homeQpts[0] + homeQpts[1];
  const awayH1 = awayQpts[0] + awayQpts[1];

  // OT for ties
  if (homeScore === awayScore) {
    const otH = Math.max(0, Math.round(randNormal(homeExpPts / 10, 4)));
    const otA = Math.max(0, Math.round(randNormal(awayExpPts / 10, 4)));
    if (otH >= otA) { homeScore += otH + 2; awayScore += otA; }
    else { awayScore += otA + 2; homeScore += otH; }
  }

  return { homeScore, awayScore, homeH1, awayH1 };
}

function runWNBASim(homeTeam, awayTeam) {
  if (!TEAM_PARAMS[homeTeam] || !TEAM_PARAMS[awayTeam]) return null;
  const n = 100000;
  let homeWins = 0, awayWins = 0, sumH = 0, sumA = 0, sumH1 = 0;
  const marginHist = {}, totalHist = {}, scoreFreq = {};

  for (let i = 0; i < n; i++) {
    const { homeScore, awayScore, homeH1, awayH1 } = simulateWNBAGame(homeTeam, awayTeam);
    if (homeScore > awayScore) homeWins++; else awayWins++;
    sumH += homeScore; sumA += awayScore; sumH1 += homeH1 + awayH1;
    const m = homeScore - awayScore, t = homeScore + awayScore;
    marginHist[m] = (marginHist[m] || 0) + 1;
    totalHist[t] = (totalHist[t] || 0) + 1;
    const k = awayScore + "-" + homeScore;
    scoreFreq[k] = (scoreFreq[k] || 0) + 1;
  }

  const fmt = (v, d = 1) => parseFloat(v).toFixed(d);
  const topScores = Object.entries(scoreFreq).sort((a, b) => b[1] - a[1]).slice(0, 8)
    .map(([score, count]) => ({ score, count, pct: ((count / n) * 100).toFixed(1) }));

  return {
    homeTeam, awayTeam, n,
    hWPct: fmt(homeWins / n * 100), aWPct: fmt(awayWins / n * 100),
    hWins: homeWins, aWins: awayWins,
    avgHome: fmt(sumH / n), avgAway: fmt(sumA / n),
    avgTotal: fmt((sumH + sumA) / n), avgH1: fmt(sumH1 / n), avgSpread: fmt((sumH - sumA) / n),
    marginHist, totalHist,   // home margin and game total → sim count; prices any Kalshi strike
    topScores,
  };
}

// Share of sims where the value lands in (lo, hi) — open bounds; null = unbounded
function histProb(hist, n, lo, hi) {
  let c = 0;
  for (const k in hist) { const v = +k; if ((lo == null || v > lo) && (hi == null || v < hi)) c += hist[k]; }
  return c / n;
}

// ── Games (ESPN free scoreboard) ─────────────────────────────────────────────
const etDate = (iso) => new Date(iso).toLocaleDateString("en-CA", { timeZone: "America/New_York" });

async function fetchWNBAGames() {
  const today = new Date().toLocaleDateString("en-CA");
  const r = await fetch(ESPN_SB + "?dates=" + today.replace(/-/g, ""));
  if (!r.ok) throw new Error("ESPN scoreboard " + r.status);
  const d = await r.json();
  return (d.events || []).map(e => {
    const c = (e.competitions || [])[0]; if (!c) return null;
    const home = c.competitors.find(t => t.homeAway === "home"), away = c.competitors.find(t => t.homeAway === "away");
    if (!home || !away) return null;
    return {
      id: e.id, commenceTime: e.date, state: e.status && e.status.type && e.status.type.state,
      homeTeam: home.team.displayName, awayTeam: away.team.displayName,
      homeLoc: home.team.location, awayLoc: away.team.location,
    };
  }).filter(g => g && g.state !== "post" && new Date(g.commenceTime).toLocaleDateString("en-CA") === today);
}

// ── Kalshi (free public API via the site's /api/kx proxy) ────────────────────
// A proxy that's down or missing answers with an HTML page; treat anything that isn't JSON as "couldn't load".
async function kxJSON(url) {
  const r = await fetch(url);
  const txt = await r.text();
  let d; try { d = JSON.parse(txt); } catch (e) { throw new Error("Kalshi answered with something that isn't JSON (HTTP " + r.status + ")"); }
  if (!r.ok) throw new Error((d && d.error) || ("Kalshi HTTP " + r.status));
  return d;
}
async function fetchKalshiWNBA(status = KX_STATUS) {
  const [ev, ...lists] = await Promise.all([
    kxJSON("/api/kx/events?series_ticker=" + KX_SERIES.win + "&status=" + status + "&limit=200"),
    ...Object.values(KX_SERIES).map(s => kxJSON("/api/kx/markets?series_ticker=" + s + "&status=" + status + "&limit=1000")),
  ]);
  return { events: ev.events || [], markets: lists.flatMap(l => l.markets || []), ts: Date.now() };
}

const kxCents = (m, f) => {
  const d = m[f + "_dollars"];
  if (d != null && d !== "") { const v = parseFloat(d); return isFinite(v) ? Math.round(v * 100) : null; }
  return m[f] != null ? +m[f] : null;
};
const normCity = (s) => String(s || "").toLowerCase().replace(/[^a-z]/g, "");
const MONTHS = { JAN:1, FEB:2, MAR:3, APR:4, MAY:5, JUN:6, JUL:7, AUG:8, SEP:9, OCT:10, NOV:11, DEC:12 };
// "26OCT31ATLGS" → "2026-10-31"
function kxSuffixDate(suf) {
  const m = /^(\d\d)([A-Z]{3})(\d\d)/.exec(suf || ""); if (!m || !MONTHS[m[2]]) return null;
  return "20" + m[1] + "-" + String(MONTHS[m[2]]).padStart(2, "0") + "-" + m[3];
}

// One Kalshi market → { kind: win|spread|total, city, lo/hi strike, prices }
function parseKxMarket(m) {
  const t = m.ticker || "", series = t.split("-")[0];
  const suffix = String(m.event_ticker || "").split("-").slice(1).join("-");
  const yesBid = kxCents(m, "yes_bid"), yesAsk = kxCents(m, "yes_ask");
  const noBid = m.no_bid_dollars != null || m.no_bid != null ? kxCents(m, "no_bid") : (yesAsk != null ? 100 - yesAsk : null);
  const noAsk = m.no_ask_dollars != null || m.no_ask != null ? kxCents(m, "no_ask") : (yesBid != null ? 100 - yesBid : null);
  const base = { ticker: t, suffix, title: m.title, sub: m.yes_sub_title, yesBid, yesAsk, noBid, noAsk, result: m.result,
    floor: m.floor_strike != null ? +m.floor_strike : null, cap: m.cap_strike != null ? +m.cap_strike : null, strikeType: m.strike_type };
  if (series === KX_SERIES.win) return { ...base, kind: "win", city: m.yes_sub_title };
  if (series === KX_SERIES.spread) {
    const mm = String(m.yes_sub_title || m.title || "").match(/^(.*?)\s+wins by over\s+([\d.]+)/i);
    if (!mm) return null;
    return { ...base, kind: "spread", city: mm[1], floor: base.floor != null ? base.floor : parseFloat(mm[2]), strikeType: base.strikeType || "greater" };
  }
  if (series === KX_SERIES.total) {
    const mm = String(m.yes_sub_title || m.title || "").match(/over\s+([\d.]+)/i);
    const floor = base.floor != null ? base.floor : mm ? parseFloat(mm[1]) : null;
    return floor != null || base.cap != null ? { ...base, kind: "total", floor, strikeType: base.strikeType || "greater" } : null;
  }
  return null;
}

// Find this game's Kalshi matchup (event ticker suffix like 26OCT31ATLGS) from the win markets / event titles.
function matchKalshiGame(game, kx) {
  if (!kx || !kx.markets) return null;
  const hc = normCity((TEAM_PARAMS[game.homeTeam] || {}).kx || game.homeLoc), ac = normCity((TEAM_PARAMS[game.awayTeam] || {}).kx || game.awayLoc);
  if (!hc || !ac) return null;
  const bySuffix = {};
  for (const m of kx.markets) {
    const p = parseKxMarket(m); if (!p || !p.suffix) continue;
    (bySuffix[p.suffix] = bySuffix[p.suffix] || []).push(p);
  }
  const cands = Object.keys(bySuffix).filter(suf => {
    const cities = new Set(bySuffix[suf].filter(p => p.kind === "win" || p.kind === "spread").map(p => normCity(p.city)));
    if (cities.has(hc) && cities.has(ac)) return true;
    const ev = (kx.events || []).find(e => String(e.event_ticker).endsWith("-" + suf));
    const title = normCity(ev && ev.title);
    return !!title && title.includes(hc) && title.includes(ac);
  });
  if (!cands.length) return null;
  const want = etDate(game.commenceTime);
  const dist = (suf) => { const d = kxSuffixDate(suf); return d ? Math.abs(new Date(d) - new Date(want)) : 9e15; };
  const suffix = cands.sort((a, b) => dist(a) - dist(b))[0];
  if (dist(suffix) > 2 * 86400000) return null;   // same teams but a different game
  return { suffix, markets: bySuffix[suffix] };
}

// Model chance that the market settles YES (0-1), from the sim's distributions
function modelYes(p, agg, game) {
  const hc = normCity((TEAM_PARAMS[game.homeTeam] || {}).kx || game.homeLoc);
  const isHome = normCity(p.city) === hc;
  if (p.kind === "win") return (isHome ? +agg.hWPct : +agg.aWPct) / 100;
  if (p.kind === "spread") {
    // "<team> wins by over X": team margin > X. Home margin from the sim; away margin is its negative.
    return isHome ? histProb(agg.marginHist, agg.n, p.floor, null) : histProb(agg.marginHist, agg.n, null, -p.floor);
  }
  if (p.kind === "total") {
    if (p.strikeType === "less") return histProb(agg.totalHist, agg.n, null, p.cap != null ? p.cap : p.floor);
    if (p.strikeType === "between") return histProb(agg.totalHist, agg.n, p.floor - 1e-9, p.cap + 1e-9);
    return histProb(agg.totalHist, agg.n, p.floor, null);
  }
  return null;
}

function teamName(game, city) {
  const c = normCity(city);
  if (c === normCity((TEAM_PARAMS[game.homeTeam] || {}).kx || game.homeLoc)) return game.homeTeam;
  if (c === normCity((TEAM_PARAMS[game.awayTeam] || {}).kx || game.awayLoc)) return game.awayTeam;
  return city;
}
// Plain-English label for each side of a market
function sideLabels(p, game) {
  if (p.kind === "win") { const t = teamName(game, p.city); return { yes: t + " win", no: t + " lose", what: "Winner" }; }
  if (p.kind === "spread") { const t = teamName(game, p.city); const pts = Math.floor(p.floor) + 1; return { yes: t + " win by " + pts + "+", no: t + " don't win by " + pts + "+", what: "Spread" }; }
  if (p.strikeType === "less") { const x = p.cap != null ? p.cap : p.floor; return { yes: "Under " + x + " pts", no: "Over " + x + " pts", what: "Total" }; }
  if (p.strikeType === "between") return { yes: "Total " + p.floor + "–" + p.cap, no: "Total not " + p.floor + "–" + p.cap, what: "Total" };
  return { yes: "Over " + p.floor + " pts", no: "Under " + p.floor + " pts", what: "Total" };
}

// Every priced Kalshi market for one game → a row on its best side (the one with the bigger edge)
function buildKalshiRows(game, agg, kx, settings) {
  const match = matchKalshiGame(game, kx);
  if (!match || !agg) return { match, rows: [] };
  const rows = [];
  for (const p of match.markets) {
    const py = modelYes(p, agg, game); if (py == null) continue;
    if (settings.hideWide && p.yesBid != null && p.yesAsk != null && p.yesAsk - p.yesBid > WIDE_GAP) continue;
    const lab = sideLabels(p, game);
    const sides = [
      { side: "yes", price: p.yesAsk, chance: py, label: lab.yes },
      { side: "no", price: p.noAsk, chance: 1 - py, label: lab.no },
    ].filter(s => s.price > 0 && s.price < 100).map(s => ({ ...s, g: SB.grade(s.chance, s.price, settings) })).filter(s => s.g);
    if (!sides.length) continue;
    const best = sides.sort((a, b) => b.g.edge - a.g.edge)[0];
    rows.push({
      key: p.ticker + "|" + best.side, ticker: p.ticker, side: best.side, kind: p.kind, what: lab.what, label: best.label,
      price: best.price, chance: best.g.chance, edge: best.g.edge, g: best.g, stake: SB.stake(best.g, SPORT, settings),
      gameId: game.id, gameDate: etDate(game.commenceTime), home: game.homeTeam, away: game.awayTeam,
      match: (TEAM_PARAMS[game.awayTeam]?.abbr || game.awayTeam) + " @ " + (TEAM_PARAMS[game.homeTeam]?.abbr || game.homeTeam),
    });
  }
  return { match, rows };
}

function formatAge(ts) {
  const mins = Math.floor((Date.now() - ts) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const hrs = Math.floor(mins / 60);
  return hrs + "h " + (mins % 60) + "m ago";
}

// ── Shared UI ────────────────────────────────────────────────────────────────
function StatCard({ label, value, sub, color }) {
  return (
    <div style={S.card}>
      <div style={S.sL}>{label}</div>
      <div style={{ ...S.sV, color: color || T.text }}>{value}</div>
      {sub && <div style={S.sSub}>{sub}</div>}
    </div>
  );
}

const sortGet = (r, k) => k === "grade" ? -r.g.rank : r[k];

// Sortable table of Kalshi-priced picks. showGame adds the matchup column (Top Picks tab).
function KalshiTable({ rows, showGame }) {
  const [sort, setSort] = useState({ k: "edge", dir: -1 });
  const sorted = sortRows(rows, sort, sortGet);
  const P = { sort, setSort };
  return (
    <div style={{ ...S.card, padding:0, overflowX:"auto" }}>
      <table style={{ ...S.table, minWidth: showGame ? 720 : 640 }}>
        <thead><tr>
          {showGame && <SortTh k="match" {...P}>Game</SortTh>}
          <SortTh k="label" {...P}>Pick</SortTh>
          <SortTh k="grade" {...P}>Grade</SortTh>
          <SortTh k="chance" {...P}>Chance to cash</SortTh>
          <SortTh k="price" {...P}>Price</SortTh>
          <SortTh k="edge" {...P}>Edge</SortTh>

    </div>
  );
}

// ── Parlay Builder (STRONG / GOOD legs only, one per game) ───────────────────
const PARLAY_SIZE_LABELS = { 2:"2-Leg", 3:"3-Leg", 4:"4-Leg", 5:"5-Leg" };

function buildWNBAParlays(legs) {
  function buildCombos(size) {
    const results = [];
    (function combine(start, current) {
      if (current.length === size) { results.push([...current]); return; }
      for (let i = start; i < legs.length; i++) {
        if (!current.some(l => l.gameId === legs[i].gameId)) { current.push(legs[i]); combine(i+1, current); current.pop(); }
      }
    })(0, []);
    return results;
  }
  const parlays = [];
  [2,3,4,5].forEach(size => {
    buildCombos(size)
      .map(combo => ({ legs:combo, size, jointProb:combo.reduce((acc,leg) => acc * leg.chance/100, 1) }))
      .sort((a,b) => b.jointProb - a.jointProb).slice(0,15)
      .forEach(p => parlays.push(p));
  });
  return parlays.sort((a,b) => b.jointProb - a.jointProb);
}

        </div>

  }

  const parlays = buildWNBAParlays(legs);
  const filtered = filterSize==="all" ? parlays : parlays.filter(p=>p.size===parseInt(filterSize));

  return (
    <div style={{ maxWidth:920, margin:"0 auto", padding:"20px 14px 48px" }}>

          <div style={{ fontSize:10, color:T.muted, marginTop:3 }}>
            {legs.length} STRONG / GOOD legs across {games} games · one leg per game · sorted by combined chance to cash
          </div>
        </div>
      </div>

      <div style={{ ...S.sec, display:"flex", gap:6, flexWrap:"wrap" }}>
        {["all","2","3","4","5"].map(v=>(
          <button key={v} onClick={()=>setFilterSize(v)} style={{ padding:"6px 14px", fontSize:10, fontWeight:700, letterSpacing:"1px", background:filterSize===v?T.accent:T.navy, color:filterSize===v?"#070b14":T.muted, border:"1px solid "+(filterSize===v?T.accent:T.border), borderRadius:4, cursor:"pointer", fontFamily:"inherit" }}>
            {v==="all"?"ALL":v+"-LEG"}
          </button>
        ))}
        <div style={{ marginLeft:"auto", fontSize:10, color:T.muted, alignSelf:"center" }}>Showing {filtered.length} parlays</div>
      </div>

      {filtered.length===0 && <div style={{ ...S.note, textAlign:"center", padding:32 }}>Not enough games with STRONG / GOOD bets for {filterSize}-leg parlays.</div>}

      {filtered.map((parlay,pi) => {
        const jp = parlay.jointProb;
        const fairOdds = jp > 0 ? (jp < 0.5 ? "+" + Math.round((1/jp-1)*100) : "-" + Math.round((jp/(1-jp))*100)) : "—";
        return (
          <div key={pi} style={{ ...S.card, marginTop:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10, flexWrap:"wrap", gap:6 }}>

              <div style={{ textAlign:"right" }}>
                <div style={{ fontSize:20, fontWeight:700, color:jp>0.4?T.green:jp>0.2?T.gold:T.red }}>model: {(jp*100).toFixed(1)}%</div>
                <div style={{ fontSize:9, color:T.muted }}>combined chance to cash · fair odds {fairOdds}</div>
              </div>
            </div>
            <div style={{ display:"flex", flexDirection:"column", gap:5 }}>

                <div key={li} style={{ display:"flex", alignItems:"center", gap:8, background:T.bg, borderRadius:4, padding:"7px 10px", borderLeft:"2px solid "+leg.g.color, flexWrap:"wrap" }}>

                </div>

            </div>

        );
      })}
      <div style={S.disclaimer}>Legs assumed independent across games. Kalshi doesn't sell these as one parlay; place each leg on its own game page. Not professional betting advice. Gamble responsibly.</div>
    </div>
  );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function App() {
  const settings = SB.useSettings();
  const [games, setGames] = useState([]);
  const [activeTab, setActiveTab] = useState("game_0");
  const [simData, setSimData] = useState(() => {
    try { return JSON.parse(localStorage.getItem(SIM_CACHE_KEY) || "{}"); } catch(e) { return {}; }
  });
  const [runningId, setRunningId] = useState(null);
  const [runCounts, setRunCounts] = useState({});
  const [lastFetched, setLastFetched] = useState(null);
  const [loadingGames, setLoadingGames] = useState(false);
  const [gamesError, setGamesError] = useState("");
  const [kx, setKx] = useState({ status: "loading" });

  function saveSim(key, result) {
    setSimData(prev => {
      const next = { ...prev, [key]: result };
      try { localStorage.setItem(SIM_CACHE_KEY, JSON.stringify(next)); } catch(e) {}
      return next;
    });
  }

  // Auto-sim every game once, skipping ones already cached today
  const autoRanRef = useRef(false);
  useEffect(() => {
    if (!games.length || autoRanRef.current) return;
    autoRanRef.current = true;
    const needsSim = games.filter(g => TEAM_PARAMS[g.homeTeam] && TEAM_PARAMS[g.awayTeam] && !simData[g.homeTeam + "|" + g.awayTeam]);
    let idx = 0;
    function runNext() {
      if (idx >= needsSim.length) return;
      const game = needsSim[idx++];
      const key = game.homeTeam + "|" + game.awayTeam;
      setRunningId(key);
      setTimeout(() => {
        const result = runWNBASim(game.homeTeam, game.awayTeam);
        if (result) { saveSim(key, result); setRunCounts(prev => ({ ...prev, [key]: 1 })); }
        setRunningId(null);
        setTimeout(runNext, 30);
      }, 50);
    }
    setTimeout(runNext, 200);
  }, [games]);

  async function loadAll() {
    setLoadingGames(true); setGamesError("");
    setKx(k => k.status === "ok" ? k : { status: "loading" });
    const gp = fetchWNBAGames().then(setGames).catch(e => setGamesError(e.message));
    const kp = fetchKalshiWNBA().then(d => setKx({ status: "ok", ...d })).catch(e => setKx({ status: "error", error: e.message }));
    await Promise.all([gp, kp]);
    setLastFetched(Date.now());
    setLoadingGames(false);
  }
  useEffect(() => { loadAll(); }, []);

  function runSim(game) {
    if (!game || runningId) return;
    const key = game.homeTeam + "|" + game.awayTeam;
    setRunningId(key);
    setTimeout(() => {
      const result = runWNBASim(game.homeTeam, game.awayTeam);
      if (result) { saveSim(key, result); setRunCounts(prev => ({ ...prev, [key]: (prev[key] || 0) + 1 })); }
      setRunningId(null);
    }, 50);
  }

  // Kalshi rows for every game (best side of each market, graded)
  const rowsByGame = useMemo(() => {
    const out = {};
    if (kx.status !== "ok") return out;
    for (const g of games) out[g.id] = buildKalshiRows(g, simData[g.homeTeam + "|" + g.awayTeam], kx, settings);
    return out;
  }, [games, simData, kx, settings]);
  const allRows = useMemo(() => Object.values(rowsByGame).flatMap(x => x.rows), [rowsByGame]);
  const picks = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD");
  const picksKey = picks.map(r => r.key).sort().join(",");

  // STRONG / GOOD picks go on the shared record (logPicks dedupes; first grade sticks)
  useEffect(() => {
    if (!picks.length) return;
    SB.logPicks(picks.map(r => ({ sport: SPORT, gameId: r.gameId, gameDate: r.gameDate, home: r.home, away: r.away,
      market: r.label, ticker: r.ticker, side: r.side, chance: r.chance, price: r.price, tier: r.g.key })));
  }, [picksKey]);

  // Legs for the cross-sport parlay page (empty list once loaded on a day with no picks)
  useEffect(() => {
    if (loadingGames || kx.status === "loading") return;
    if (games.some(g => TEAM_PARAMS[g.homeTeam] && TEAM_PARAMS[g.awayTeam] && !simData[g.homeTeam + "|" + g.awayTeam])) return;
    const legs = picks.map(r => ({ matchId: r.gameId, match: r.away + " @ " + r.home, market: r.label, prob: r.chance / 100,
      probPct: r.chance.toFixed(1) + "%", tier: r.g.key, grade: r.g.label, price: r.price, edge: +r.edge.toFixed(1), ticker: r.ticker, side: r.side, sport: "WNBA" }));
    try { localStorage.setItem("sharp_xsport_legs_wnba_" + new Date().toLocaleDateString("en-CA"), JSON.stringify({ legs, ts: Date.now() })); } catch(e) {}
  }, [picksKey, loadingGames, kx.status, games, simData]);

  const activeGameIdx = activeTab.startsWith("game_") ? parseInt(activeTab.split("_")[1]) : 0;
  const isSpecialTab = activeTab === "top_picks" || activeTab === "parlays";
  const activeGame = isSpecialTab ? null : games[activeGameIdx];
  const gameKey = activeGame ? activeGame.homeTeam + "|" + activeGame.awayTeam : null;
  const edgeCount = allRows.filter(r => r.g.key === "STRONG" || r.g.key === "GOOD" || r.g.key === "SMALL").length;

  return (
    <div style={S.wrap}>
      {/* Nav */}
      <div style={{ background:T.navy, borderBottom:"1px solid "+T.border, padding:"10px 16px", display:"flex", alignItems:"center", gap:12, justifyContent:"space-between" }}>
        <a href="index.html" style={{ fontSize:9, color:T.muted, letterSpacing:"1px" }}>← SHARP SIM</a>
        <div style={{ flex:1 }}/>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          {lastFetched && <span style={{ fontSize:9, color:T.muted }}>fetched {formatAge(lastFetched)}</span>}
          <button style={{ background:"none", border:"1px solid "+T.border, color:T.muted, fontSize:9, padding:"4px 10px", borderRadius:3, cursor:"pointer", fontFamily:"inherit" }}
            onClick={loadAll} disabled={loadingGames}>
            {loadingGames ? "..." : "⟳ Refresh"}
          </button>
          <a href="settings.html" style={{ fontSize:9, color:T.muted, letterSpacing:"1px", textDecoration:"none", border:"1px solid "+T.border, padding:"4px 10px", borderRadius:3 }}>⚙ SETTINGS</a>
        </div>
      </div>

      {/* Game tabs */}
      <div style={S.tabBar}>
        {games.map((g, i) => (
          <button key={g.id} style={S.tab(activeTab === "game_" + i)} onClick={() => setActiveTab("game_" + i)}>
            {(TEAM_PARAMS[g.awayTeam]?.abbr || g.awayTeam.split(" ").pop())} @ {(TEAM_PARAMS[g.homeTeam]?.abbr || g.homeTeam.split(" ").pop())}
            {runningId === (g.homeTeam + "|" + g.awayTeam) ? " ⟳" : !simData[g.homeTeam + "|" + g.awayTeam] ? " ·" : ""}
          </button>
        ))}
        <div style={{ flex:1 }}/>
        <button style={{ ...S.tab(activeTab === "top_picks"), color:activeTab==="top_picks"?T.green:T.muted, borderBottom:activeTab==="top_picks"?"2px solid "+T.green:"2px solid transparent", borderLeft:"1px solid "+T.border }}
          onClick={() => setActiveTab("top_picks")}>
          ⭐ TOP PICKS {edgeCount > 0 ? "(" + edgeCount + ")" : ""}
        </button>
        <button style={{ ...S.tab(activeTab === "parlays"), color:activeTab==="parlays"?T.purple:T.muted, borderBottom:activeTab==="parlays"?"2px solid "+T.purple:"2px solid transparent", borderLeft:"1px solid "+T.border }}
          onClick={() => setActiveTab("parlays")}>
          🎲 PARLAYS
        </button>
      </div>

      <div style={{ maxWidth:960, margin:"0 auto", padding:"16px 16px 0" }}>
        <GradeLegend sport={SPORT}/>
        <RecordCard sport={SPORT}/>
      </div>

      {gamesError && (
        <div style={{ background:T.red+"22", border:"1px solid "+T.red+"44", color:T.red, padding:"10px 16px", fontSize:10 }}>
          Error loading games from ESPN: {gamesError}
        </div>
      )}

      {loadingGames && games.length === 0 && (
        <div style={{ padding:40, textAlign:"center", color:T.muted, fontSize:10 }}>Loading today's WNBA games...</div>
      )}

      {!loadingGames && games.length === 0 && !gamesError && !isSpecialTab && (
        <div style={{ maxWidth:960, margin:"0 auto", padding:"8px 16px 40px" }}>
          <div style={{ ...S.note, textAlign:"center", padding:30 }}>
            No WNBA games today.{kx.status === "ok" && !kx.markets.length ? " Kalshi has no WNBA markets open either, which is normal in the offseason." : ""}
            {kx.status === "error" && <div style={{ color:T.yellow, marginTop:6 }}>Kalshi prices couldn't be loaded ({kx.error}).</div>}
          </div>
        </div>
      )}

      {activeTab === "top_picks" && <TopPicksTab games={games} simData={simData} kx={kx} allRows={allRows}/>}
      {activeTab === "parlays" && <WNBAParlayTab kx={kx} allRows={allRows}/>}
      {!isSpecialTab && activeGame && (
        <GameSimView
          game={activeGame}
          agg={simData[gameKey]}
          running={runningId === gameKey}
          runCount={runCounts[gameKey] || 0}
          onRun={() => runSim(activeGame)}
          kx={kx}
          rowsInfo={rowsByGame[activeGame.id]}
        />
      )}
      {!isSpecialTab && activeGame && (!TEAM_PARAMS[activeGame.homeTeam] || !TEAM_PARAMS[activeGame.awayTeam]) && (
        <div style={{ padding:20, color:T.yellow, fontSize:10 }}>
          Team not in model: {activeGame.homeTeam} or {activeGame.awayTeam} — parameters not yet calibrated.
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
