<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const CFB = window.CFB;

// ── Constants ────────────────────────────────────────────────────────────────
const ESPN_SB = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300";
const ESPN_SUMMARY = "https://site.api.espn.com/apis/site/v2/sports/football/college-football/summary?event=";
const SERIES = ["KXNCAAFGAME", "KXNCAAFSPREAD", "KXNCAAFTOTAL"];
const LS = { cfg: "sharp_live_cfg_v1", paper: "sharp_live_paper_v1", meta: "sharp_live_meta_v1", log: "sharp_live_log_v1",
             enabled: "sharp_live_enabled_v1", pre: "sharp_live_pre_v1", mode: "sharp_live_mode_v1" };
const TICK_MS = 3000, ESPN_MS = 5000, EVENTS_MS = 5 * 60000, IDLE_MARKET_MS = 20000;

const T = { bg:"#070b14", navy:"#101d30", navy2:"#0c1526", border:"#1a2a3e", text:"#dde5f0", muted:"#4b6280", dim:"#2a3a52",
  green:"#22c55e", red:"#ef4444", gold:"#e8c547", purple:"#a78bfa", blue:"#3b82f6", orange:"#f97316", accent:"#f97316" };

function load(key, dflt) { try { const v = JSON.parse(localStorage.getItem(key) || "null"); return v == null ? dflt : v; } catch (e) { return dflt; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
const fmt$ = (x) => (x < 0 ? "-$" : "$") + Math.abs(x).toFixed(2);
const fmtSigned$ = (x) => (x >= 0 ? "+" : "-") + "$" + Math.abs(x).toFixed(2);
const nowStr = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
// Background tabs get their timers throttled (to once a minute after a few minutes hidden); worker timers don't.
const sleep = (() => {
  let w = null, n = 0; const waiting = {};
  try {
    w = new Worker(URL.createObjectURL(new Blob(["onmessage=e=>setTimeout(()=>postMessage(e.data.id),e.data.ms)"], { type: "text/javascript" })));
    w.onmessage = (e) => { const r = waiting[e.data]; delete waiting[e.data]; if (r) r(); };
  } catch (e) { w = null; }
  return (ms) => new Promise(r => { if (!w) return setTimeout(r, ms); const id = ++n; waiting[id] = r; w.postMessage({ id, ms }); });
})();

// Kalshi allows ~20 reads/s per key (and an IP bucket for unsigned reads): pace our calls.
const kxQueue = { next: 0, gap: 110, backoffUntil: 0 };
async function kxPace() {
  // reserve the next slot so concurrent callers queue up ~9 requests/second
  const now = Date.now();
  const at = Math.max(now, kxQueue.next, kxQueue.backoffUntil);
  kxQueue.next = at + kxQueue.gap;
  if (at > now) await sleep(at - now);
}
async function getJSON(url) {
  if (url.startsWith("/api/kx")) await kxPace();
  const r = await fetch(url, { cache: "no-store" });
  if (r.status === 429 && url.startsWith("/api/kx")) kxQueue.backoffUntil = Date.now() + 2000;
  const text = await r.text();
  let d; try { d = JSON.parse(text); } catch (e) { d = { error: text.slice(0, 200) }; }
  if (!r.ok) { const err = new Error((d && (d.error && (d.error.message || d.error)) || d.message) || ("HTTP " + r.status)); err.status = r.status; err.body = d; throw err; }
  return d;
}
async function sendJSON(method, url, body) {
  await kxPace();
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body == null ? undefined : JSON.stringify(body) });
  const text = await r.text();
  let d; try { d = JSON.parse(text); } catch (e) { d = { raw: text }; }
  if (!r.ok) { const msg = d && (typeof d.error === "string" ? d.error : d.error && (d.error.message || d.error.code)) || d.message || ("HTTP " + r.status); const err = new Error(msg); err.body = d; throw err; }
  return d;
}

// Order translation. Kalshi v2 quotes every order on the YES leg:
//   buy YES at c  -> side:"bid", price c        buy NO at c  -> side:"ask", price 100-c
//   sell YES at c -> side:"ask", price c        sell NO at c -> side:"bid", price 100-c
function toOrder(type, side, cents, count) {
  const yesPrice = side === "yes" ? cents : 100 - cents;
  const book = (type === "buy") === (side === "yes") ? "bid" : "ask";
  return { side: book, price: (Math.min(99, Math.max(1, yesPrice)) / 100).toFixed(2), count: String(count) };
}

// ── Main app ─────────────────────────────────────────────────────────────────
function App() {
  const [cfg, setCfg] = useState(() => { const c = { ...CFB.DEFAULT_CONFIG, ...load(LS.cfg, {}) }; if (!c.feedV2) { c.liveFeed = "auto"; c.feedV2 = true; } if (!c.cfgV3) { c.sims = CFB.DEFAULT_CONFIG.sims; c.cfgV3 = true; } return c; });
  const [mode, setMode] = useState(() => load(LS.mode, "paper") === "live" ? "paper" : "paper"); // always boot in paper
  const [running, setRunning] = useState(false);
  const [runnerSt, setRunnerSt] = useState(null);
  const [showTab, setShowTab] = useState(() => load("sharp_tab_bot_open", false));
  useEffect(() => save("sharp_tab_bot_open", showTab), [showTab]);
  const [paused, setPaused] = useState(false);
  const [server, setServer] = useState(null);
  const [balance, setBalance] = useState(null);
  const [games, setGames] = useState([]);            // parsed ESPN games
  const [enabled, setEnabled] = useState(() => load(LS.enabled, {}));
  const [view, setView] = useState({});              // per game: {markets, evals, proj, eventSuffix}
  const [positions, setPositions] = useState({});    // ticker -> position (mode-dependent)
  const [paper, setPaper] = useState(() => load(LS.paper, { positions: {}, realized: 0, trades: [], startBankroll: null }));
  const [log, setLog] = useState(() => load(LS.log, []));
  const [showCfg, setShowCfg] = useState(false);
  const [err, setErr] = useState("");
  const [lastTick, setLastTick] = useState(null);
  const [tickMs, setTickMs] = useState(0);

  // refs mirror state for the async loop
  const R = useRef({});
  R.current.cfg = cfg; R.current.mode = mode; R.current.running = running; R.current.paused = paused;
  R.current.enabled = enabled; R.current.paper = paper;
  const S = useRef({ events: [], eventsTs: 0, espnTs: 0, games: [], pre: load(LS.pre, {}), meta: load(LS.meta, {}),
                     marketTs: {}, markets: {}, gameState: {}, cooldowns: {}, inflight: {}, killed: false, sessionStart: Date.now(),
                     sessionRealized: 0, livePositions: {}, candSeen: {}, kLive: {}, core: {}, espnGames: [] });

  const addLog = useCallback((kind, msg, extra) => {
    setLog(prev => { const next = [{ t: nowStr(), ts: Date.now(), kind, msg, ...extra }, ...prev].slice(0, 300); save(LS.log, next); return next; });
  }, []);

  useEffect(() => save(LS.cfg, cfg), [cfg]);
  useEffect(() => save(LS.enabled, enabled), [enabled]);
  useEffect(() => save(LS.paper, paper), [paper]);
  useEffect(() => save(LS.mode, mode), [mode]);

  // server status
  useEffect(() => { getJSON("/api/kx/_status").then(setServer).catch(e => setServer({ error: e.message })); }, []);

  // keep the screen awake while running
  useEffect(() => {
    let lock = null;
    if (running && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { lock = l; }).catch(() => {});
    return () => { if (lock) lock.release().catch(() => {}); };
  }, [running]);

  // browsers throttle timers in hidden tabs (down to once a minute), so say so while running
  useEffect(() => {
    const h = () => { if (R.current.running && document.hidden) addLog("warn", "Tab hidden: the browser slows background tabs, so ticks and exits can lag. Keep this tab visible while auto is on."); };
    document.addEventListener("visibilitychange", h); return () => document.removeEventListener("visibilitychange", h);
  }, []);

  // warn before closing while live
  useEffect(() => {
    const h = (e) => { if (R.current.running && R.current.mode === "live") { e.preventDefault(); e.returnValue = ""; } };
    window.addEventListener("beforeunload", h); return () => window.removeEventListener("beforeunload", h);
  }, []);

  // ── Data fetching ──────────────────────────────────────────────────────────
  async function refreshEvents(force) {
    const st = S.current;
    if (!force && Date.now() - st.eventsTs < EVENTS_MS && st.events.length) return;
    const d = await getJSON("/api/kx/events?series_ticker=KXNCAAFGAME&status=open&limit=200");
    st.events = d.events || []; st.eventsTs = Date.now();
  }

  async function refreshEspn(force) {
    const st = S.current;
    if (!force && Date.now() - st.espnTs < ESPN_MS) return;
    const d = await getJSON(ESPN_SB + "&_=" + Date.now());
    const today = new Date();
    const parsed = (d.events || []).map(CFB.parseEspnEvent).filter(Boolean)
      .filter(g => g.state === "in" || (g.state === "pre" && new Date(g.date) - today < 14 * 3600e3) || (g.state === "post" && today - new Date(g.date) < 8 * 3600e3));
    const ts = Date.now();
    for (const g of parsed) {
      const gs = st.gameState[g.id] = st.gameState[g.id] || {};
      gs.espnTs = ts;
      // capture the pregame line while ESPN still shows it
      if (g.spreadHome != null && g.total != null && g.state === "pre") st.pre[g.id] = { spreadHome: g.spreadHome, total: g.total, src: "espn" };
      // match to a Kalshi event once
      if (!gs.suffix) {
        let best = null;
        for (const e of st.events) {
          const sc = CFB.matchEventScore(e.title, g);
          const dayOk = Math.abs(new Date(g.date) - kalshiDate(e.event_ticker)) < 36 * 3600e3;
          if (dayOk && (!best || sc > best.sc)) best = { sc, e };
        }
        if (best && best.sc >= 0.6) gs.suffix = best.e.event_ticker.split("-").slice(1).join("-");
      }
    }
    st.espnGames = parsed; st.espnTs = ts;
    mergeGames();
    // pregame lines for games already live (ESPN summary pickcenter), fetched once per game
    for (const g of parsed) {
      if (st.pre[g.id] || g.state === "post") continue;
      try {
        const s = await getJSON(ESPN_SUMMARY + g.id);
        const pc = (s.pickcenter || [])[0];
        if (pc && pc.spread != null && pc.overUnder != null) st.pre[g.id] = { spreadHome: -Number(pc.spread), total: Number(pc.overUnder), src: "espn-pickcenter" };
        else st.pre[g.id] = { spreadHome: null, total: null, src: "none" };
      } catch (e) {}
    }
    save(LS.pre, st.pre);
  }

  // Game state: pick whichever feed is furthest along (ESPN core ≈ 12s ahead of the scoreboard, ≈ 27s ahead of Kalshi).
  // Kalshi's feed still contributes its review / PAT-pending flags when its score agrees.
  function mergeGames() {
    const st = S.current, now = Date.now();
    const feed = R.current.cfg.liveFeed || "auto";
    const merged = (st.espnGames || []).map(g => {
      const gs = st.gameState[g.id] || {};
      const cands = [{ g: { ...g, feed: "espn" }, ts: gs.espnTs || 0, rank: 0 }];
      const kl = st.kLive[g.id], co = st.core[g.id];
      if (feed !== "espn" && kl && now - kl.fetchedTs < 15000 && (g.state !== "pre" || /inprogress|halftime/.test(kl.d.status || "")))
        cands.push({ g: CFB.applyKalshiLive(g, kl.d, gs.milestone, gs.flip), ts: kl.fetchedTs, rank: 1 });
      if ((feed === "auto" || feed === "core") && co && now - co.fetchedTs < 15000 && co.status && co.status.type && co.status.type.state !== "pre")
        cands.push({ g: CFB.applyEspnCore(g, co), ts: co.fetchedTs, rank: 2 });
      let pick = cands[0];
      if (feed === "kalshi") pick = cands.find(c => c.rank === 1) || pick;
      else if (feed === "core") pick = cands.find(c => c.rank === 2) || pick;
      else for (const c of cands) { const a = CFB.feedProgress(c.g), b = CFB.feedProgress(pick.g); if (a > b || (a === b && c.rank > pick.rank)) pick = c; }
      const out = { ...pick.g, feedTs: pick.ts };
      const kg = cands.find(c => c.rank === 1);
      if (kg && kg.g.reviewPending && kg.g.home.score === out.home.score && kg.g.away.score === out.away.score) out.reviewPending = true;
      return out;
    });
    for (const g of merged) {
      const gs = st.gameState[g.id] = st.gameState[g.id] || {};
      const sig = [g.home.score, g.away.score, g.period, g.clock, g.possession, g.down, g.distance, g.yardsToGoal].join("|");
      const scoreSig = g.home.score + "-" + g.away.score;
      gs.dataTs = g.feedTs || gs.espnTs;
      if (gs.sig !== sig) { gs.sig = sig; gs.stateChangeTs = now; gs.midAtChange = gs.lastMid; }
      if (gs.scoreSig && gs.scoreSig !== scoreSig) { gs.lastScoreChangeTs = now; gs.lastScoreFeed = g.feed; }
      gs.scoreSig = scoreSig;
    }
    st.games = merged;
    setGames(merged);
  }

  // ESPN core API: /status + /situation every pass for games we care about, the play only when lastPlay changes.
  const CORE = "https://sports.core.api.espn.com/v2/sports/football/leagues/college-football/events/";
  async function refreshCore(pass) {
    const st = S.current, en = R.current.enabled || {};
    const live = (st.espnGames || []).filter(g => g.state === "in" || (g.state === "pre" && new Date(g.date) - Date.now() < 900e3));
    const hot = live.filter(g => en[g.id] || hasPositionInGame(g.id));
    const list = pass % 3 === 0 ? live : hot;
    await Promise.all(list.map(async g => {
      const base = CORE + g.id + "/competitions/" + g.id + "/";
      try {
        const [status, situation] = await Promise.all([getJSON(base + "status?_=" + Date.now()), getJSON(base + "situation?_=" + Date.now())]);
        const prev = st.core[g.id] || {};
        let play = prev.play, playRef = prev.playRef;
        const ref = situation && situation.lastPlay && situation.lastPlay.$ref;
        if (ref && ref !== playRef) { try { play = await getJSON(ref.replace(/^http:/, "https:")); playRef = ref; } catch (e) {} }
        st.core[g.id] = { status, situation, play, playRef, fetchedTs: Date.now() };
      } catch (e) {}
    }));
  }

  // Kalshi live data: one milestone lookup per game, then one batch call for every live game.
  async function refreshKalshiLive() {
    const st = S.current;
    const want = (st.espnGames || []).filter(g => (g.state === "in" || (g.state === "pre" && new Date(g.date) - Date.now() < 3600e3)) && st.gameState[g.id] && st.gameState[g.id].suffix);
    for (const g of want) {
      const gs = st.gameState[g.id];
      if (gs.milestone !== undefined && !(gs.milestone === null && Date.now() - (gs.milestoneTs || 0) > 120000)) continue;
      gs.milestoneTs = Date.now();
      try {
        const r = await getJSON("/api/kx/milestones?limit=5&related_event_ticker=KXNCAAFGAME-" + gs.suffix);
        const m = (r.milestones || []).find(x => x.type === "football_game") || null;
        gs.milestone = m;
        if (m) { const parts = String(m.title || "").split(/\s+at\s+/i); gs.flip = parts.length === 2 && CFB.nameScore(parts[1], g.away) > CFB.nameScore(parts[1], g.home); }
      } catch (e) { gs.milestone = null; }
    }
    const ids = want.map(g => st.gameState[g.id].milestone).filter(Boolean).map(m => m.id);
    if (!ids.length) return;
    const r = await getJSON("/api/kx/live_data/batch?" + ids.map(i => "milestone_ids=" + i).join("&"));
    const now = Date.now();
    for (const ld of (r.live_datas || r.live_data || [])) {
      const g = want.find(x => st.gameState[x.id].milestone && st.gameState[x.id].milestone.id === ld.milestone_id);
      if (g && ld.details) st.kLive[g.id] = { d: ld.details, fetchedTs: now };
    }
  }

  function kalshiDate(eventTicker) {
    // KXNCAAFGAME-26NOV21XXXYYY -> 2026-11-21
    const m = /-(\d\d)([A-Z]{3})(\d\d)/.exec(eventTicker || ""); if (!m) return new Date(0);
    const mon = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"].indexOf(m[2]);
    return new Date(2000 + +m[1], mon, +m[3], 18);
  }

  async function refreshMarkets(g, force) {
    const st = S.current, gs = st.gameState[g.id]; if (!gs || !gs.suffix) return;
    const hot = R.current.enabled[g.id] || hasPositionInGame(g.id);
    const age = Date.now() - (st.marketTs[g.id] || 0);
    if (!force && !hot && (g.state === "pre" || age < IDLE_MARKET_MS)) return;
    // with the WebSocket streaming prices, REST only needs to refresh the ladder structure occasionally
    if (!force && hot && stream.current.status === "live" && stream.current.tickerSid != null && age < 10000) return;
    if (!force && g.state === "post" && age < 60000) return;
    const lists = await Promise.all(SERIES.map(s => getJSON("/api/kx/markets?limit=200&event_ticker=" + s + "-" + gs.suffix).catch(() => ({ markets: [] }))));
    applyMarkets(g, lists.flatMap(l => l.markets || []));
  }

  // One request per series covers every game (~170 / 870 / 580 markets, no paging), instead of 3 requests per game.
  async function refreshAllMarkets() {
    const st = S.current;
    const lists = await Promise.all(SERIES.map(s => getJSON("/api/kx/markets?limit=1000&status=open&series_ticker=" + s).catch(() => null)));
    if (lists.some(l => !l)) { await Promise.all(st.games.map(g => refreshMarkets(g).catch(() => {}))); return; }
    const bySuffix = {};
    for (const m of lists.flatMap(l => l.markets || [])) {
      const suf = String(m.event_ticker || "").split("-").slice(1).join("-");
      (bySuffix[suf] = bySuffix[suf] || []).push(m);
    }
    for (const g of st.games) {
      const gs = st.gameState[g.id];
      if (!gs || !gs.suffix) continue;
      if (bySuffix[gs.suffix]) applyMarkets(g, bySuffix[gs.suffix]);
      else if (g.state !== "pre") await refreshMarkets(g, true).catch(() => {});   // closed / settled: fetch that game directly
    }
  }

  function applyMarkets(g, raw) {
    const st = S.current, gs = st.gameState[g.id];
    st.markets[g.id] = raw.map(m => CFB.parseKalshiMarket(m, g)).filter(Boolean);
    st.marketTs[g.id] = Date.now();
    // market-jump detection on the moneyline
    const win = st.markets[g.id].find(m => m.kind === "win" && m.side === "home");
    const md = win ? CFB.mid(win) : null;
    if (md != null) {
      const cfgNow = R.current.cfg;
      if (gs.midAtChange != null && Math.abs(md - gs.midAtChange) >= cfgNow.marketJumpCents && Date.now() - (gs.freezeUntil || 0) > 0) {
        const moved = Math.round(Math.abs(md - gs.midAtChange));
        gs.freezeUntil = Date.now() + cfgNow.marketJumpFreezeSecs * 1000;
        gs.midAtChange = md;
        if (R.current.enabled[g.id]) addLog("info", `${g.shortName}: moneyline moved ${moved}¢ with no change in the game feed — freezing entries ${cfgNow.marketJumpFreezeSecs}s`);
      }
      if (gs.midAtChange == null) gs.midAtChange = md;
      gs.lastMid = md;
    }
  }

  function hotScore(g) { return (R.current.enabled[g.id] ? 2 : 0) + (hasPositionInGame(g.id) ? 4 : 0) + (g.state === "in" ? 1 : 0); }
  function hasPositionInGame(gameId) {
    const st = S.current;
    return Object.values(currentPositions()).some(p => p.gameId === gameId && p.count > 0);
  }

  // positions for the active mode, as engine-ready objects
  function currentPositions() {
    const st = S.current;
    if (R.current.mode === "paper") return R.current.paper.positions || {};
    return st.livePositions;
  }

  async function refreshLivePositions() {
    const st = S.current;
    const d = await getJSON("/api/kx/portfolio/positions?count_filter=position&limit=1000");
    const out = {};
    for (const p of d.market_positions || []) {
      const t = p.ticker; if (!/^KXNCAAF(GAME|SPREAD|TOTAL)-/.test(t)) continue;
      const pos = parseFloat(p.position_fp != null ? p.position_fp : p.position || 0);
      if (!pos) continue;
      const count = Math.abs(pos);
      const exposure = parseFloat(p.market_exposure_dollars != null ? p.market_exposure_dollars : (p.market_exposure || 0) / 100);
      const meta = st.meta[t] || {};
      const botOwned = !!meta.botOwned;
      if (!botOwned && !R.current.cfg.manageManual) { out[t] = { ...meta, side: pos > 0 ? "yes" : "no", count, avgCost: Math.round(exposure / count * 100), unmanaged: true, gameId: meta.gameId || gameIdForTicker(t) }; continue; }
      out[t] = { ...meta, side: pos > 0 ? "yes" : "no", count, avgCost: meta.avgCost || Math.round(exposure / count * 100),
                 gameId: meta.gameId || gameIdForTicker(t), peakBid: meta.peakBid || 0, openedAt: meta.openedAt || Date.now() };
    }
    st.livePositions = out; st.posTs = Date.now();
    setPositions(out);
    try { const b = await getJSON("/api/kx/portfolio/balance"); setBalance(b.balance_dollars != null ? parseFloat(b.balance_dollars) : b.balance / 100); } catch (e) {}
  }

  function gameIdForTicker(t) {
    const st = S.current; const suffix = t.split("-").slice(1, 2)[0];
    for (const [id, gs] of Object.entries(st.gameState)) if (gs.suffix === suffix) return id;
    return null;
  }

  // ── Execution ──────────────────────────────────────────────────────────────
  async function execute(a, g) {
    const st = S.current, cfgNow = R.current.cfg;
    if (st.inflight[a.ticker]) return;
    st.inflight[a.ticker] = true;
    const label = labelFor(a.ticker, g);
    try {
      if (R.current.mode === "paper") paperFill(a, label);
      else await liveExecute(a, label, cfgNow);
    } catch (e) {
      addLog("error", `${a.type.toUpperCase()} ${label} failed: ${e.message}`);
    } finally { st.inflight[a.ticker] = false; }
  }

  function paperFill(a, label) {
    const cfgNow = R.current.cfg;
    setPaper(prev => {
      const next = { ...prev, positions: { ...prev.positions }, trades: [...(prev.trades || [])] };
      const fee = CFB.feeCents(a.limit, a.count, cfgNow.feeRate) / 100;
      if (a.type === "buy") {
        next.positions[a.ticker] = { side: a.side, count: a.count, avgCost: a.limit, peakBid: a.limit, openedAt: Date.now(), gameId: a.gameId, fees: fee, botOwned: true, label, lead: !!a.lead, tpPrice: a.takeProfitPrice };
        next.realized = (next.realized || 0) - fee;
        addLog("buy", `PAPER BUY ${a.count}× ${label} ${a.side.toUpperCase()} @ ${a.limit}¢ — ${a.reason}`, { ticker: a.ticker });
      } else {
        const p = next.positions[a.ticker]; if (!p) return prev;
        const pnl = (a.limit - p.avgCost) * p.count / 100 - fee;
        next.realized = (next.realized || 0) + (a.limit - p.avgCost) * p.count / 100 - fee;
        next.trades.unshift({ ticker: a.ticker, label, side: p.side, count: p.count, entry: p.avgCost, exit: a.limit, pnl: pnl - (p.fees || 0), reason: a.reason, ts: Date.now() });
        next.trades = next.trades.slice(0, 200);
        delete next.positions[a.ticker];
        addLog(pnl >= 0 ? "win" : "loss", `PAPER CASH OUT ${p.count}× ${label} @ ${a.limit}¢ (cost ${p.avgCost}¢) ${fmtSigned$(pnl - (p.fees || 0))} — ${a.reason}`, { ticker: a.ticker });
        S.current.cooldowns[a.ticker] = { until: Date.now() + cfgNow.cooldownSecs * 1000, exits: ((S.current.cooldowns[a.ticker] || {}).exits || 0) + 1 };
        if (/^stop loss/.test(a.reason)) { const cd = S.current.cooldowns, n = (cd["stops:" + a.gameId] || 0) + 1; cd["stops:" + a.gameId] = n; cd["game:" + a.gameId] = { until: Date.now() + (n >= (cfgNow.maxStopsPerGame || 2) ? 12 * 3600e3 : cfgNow.gameTimeoutSecs * 1000) }; if (n >= (cfgNow.maxStopsPerGame || 2)) addLog("info", `${n} stop-losses in this game: no more entries in it tonight`); }
      }
      R.current.paper = next;
      return next;
    });
  }

  async function liveExecute(a, label, cfgNow) {
    const st = S.current;
    if (a.type === "buy") {
      const o = toOrder("buy", a.side, a.limit, a.count);
      const res = await sendJSON("POST", "/api/kx/portfolio/events/orders", { ticker: a.ticker, ...o, time_in_force: "immediate_or_cancel" });
      const filled = parseFloat(res.fill_count || res.fill_count_fp || 0);
      if (!(filled > 0)) { addLog("info", `No fill: ${label} ${a.side.toUpperCase()} @ ${a.limit}¢ (book moved)`); return; }
      const avg = res.average_fill_price != null ? Math.round(parseFloat(res.average_fill_price) * 100) : a.limit;
      const avgSide = a.side === "yes" ? avg : (res.average_fill_price != null ? 100 - avg : a.limit);
      st.meta[a.ticker] = { botOwned: true, avgCost: avgSide, peakBid: avgSide, openedAt: Date.now(), gameId: a.gameId, label, lead: !!a.lead, tpPrice: a.takeProfitPrice };
      addLog("buy", `LIVE BUY ${filled}× ${label} ${a.side.toUpperCase()} @ ${avgSide}¢ — ${a.reason}`, { ticker: a.ticker });
      if (cfgNow.restingTakeProfit) {
        const tp = Math.min(99, avgSide + cfgNow.takeProfit);
        try {
          const to = toOrder("sell", a.side, tp, Math.floor(filled));
          if (Math.floor(filled) >= 1) {
            const r2 = await sendJSON("POST", "/api/kx/portfolio/events/orders", { ticker: a.ticker, ...to, time_in_force: "good_till_canceled", closing: true });
            st.meta[a.ticker].tpOrderId = r2.order_id;
            addLog("info", `Resting take-profit on Kalshi: sell ${Math.floor(filled)}× ${label} @ ${tp}¢`);
          }
        } catch (e) { addLog("error", `Resting take-profit not placed: ${e.message}`); }
      }
      save(LS.meta, st.meta);
      await refreshLivePositions();
    } else {
      const meta = st.meta[a.ticker] || {};
      if (meta.tpOrderId) {
        try { await sendJSON("DELETE", `/api/kx/portfolio/events/orders/${meta.tpOrderId}?market_ticker=${a.ticker}`); } catch (e) {}
        meta.tpOrderId = null;
      }
      const limit = Math.max(1, a.limit - (cfgNow.exitSlippage || 1));
      const o = toOrder("sell", a.side, limit, a.count);
      const res = await sendJSON("POST", "/api/kx/portfolio/events/orders", { ticker: a.ticker, ...o, time_in_force: "immediate_or_cancel", reduce_only: true });
      const filled = parseFloat(res.fill_count || 0);
      const avg = res.average_fill_price != null ? Math.round(parseFloat(res.average_fill_price) * 100) : a.limit;
      const avgSide = a.side === "yes" ? avg : (res.average_fill_price != null ? 100 - avg : a.limit);
      if (!(filled > 0)) { addLog("info", `Cash-out not filled: ${label} @ ${limit}¢ — will retry`); return; }
      const pnl = (avgSide - (meta.avgCost || avgSide)) * filled / 100;
      st.sessionRealized += pnl;
      addLog(pnl >= 0 ? "win" : "loss", `LIVE CASH OUT ${filled}× ${label} @ ${avgSide}¢ (cost ${meta.avgCost}¢) ${fmtSigned$(pnl)} — ${a.reason}`, { ticker: a.ticker });
      if (filled >= a.count - 1e-9) delete st.meta[a.ticker];
      st.cooldowns[a.ticker] = { until: Date.now() + cfgNow.cooldownSecs * 1000, exits: ((st.cooldowns[a.ticker] || {}).exits || 0) + 1 };
      if (/^stop loss/.test(a.reason)) { const cd = st.cooldowns, n = (cd["stops:" + a.gameId] || 0) + 1; cd["stops:" + a.gameId] = n; cd["game:" + a.gameId] = { until: Date.now() + (n >= (cfgNow.maxStopsPerGame || 2) ? 12 * 3600e3 : cfgNow.gameTimeoutSecs * 1000) }; if (n >= (cfgNow.maxStopsPerGame || 2)) addLog("info", `${n} stop-losses in this game: no more entries in it tonight`); }
      save(LS.meta, st.meta);
      await refreshLivePositions();
    }
  }

  function labelFor(ticker, g) {
    const st = S.current;
    for (const ms of Object.values(st.markets)) { const m = ms.find(x => x.ticker === ticker); if (m) return marketLabel(m, gamesById()[gameIdForTicker(ticker)] || g); }
    return ticker;
  }
  function gamesById() { const o = {}; for (const g of S.current.games) o[g.id] = g; return o; }

  // ── The loop ───────────────────────────────────────────────────────────────
  // tick(): refresh feeds (REST) then decide. decideAndAct(): decide from cached data — also
  // called straight from the WebSocket when a held market's price moves (exits only).
  const tickingRef = useRef(false), decidingRef = useRef(false);
  async function tick() {
    if (tickingRef.current) return;
    tickingRef.current = true;
    const t0 = performance.now();
    const st = S.current;
    try {
      await refreshEvents();
      await refreshEspn();
      // hot games (auto on / holding a position) first, then the rest
            await refreshAllMarkets();
      if (R.current.mode === "live" && (!stream.current.privateLive || Date.now() - (st.posTs || 0) > 15000)) await refreshLivePositions();
      syncStreamSubscriptions();
      await decideAndAct({ exitsOnly: false });
      setErr("");
    } catch (e) {
      setErr(e.message);
    } finally {
      tickingRef.current = false;
      setLastTick(Date.now()); setTickMs(Math.round(performance.now() - t0));
    }
  }

  async function decideAndAct({ exitsOnly, fast }) {
    if (decidingRef.current) return;
    decidingRef.current = true;
    const st = S.current, cfgNow = R.current.cfg;
    try {
      const pos = currentPositions();
      const now = Date.now();
      const input = { now, cfg: cfgNow, paused: R.current.paused || exitsOnly, killed: st.killed, positions: {}, cooldowns: st.cooldowns,
                      dailyPnl: sessionPnl(), games: [] };
      for (const [t, p] of Object.entries(pos)) if (!p.unmanaged) input.positions[t] = p;
      for (const g of st.games) {
        if (exitsOnly && !Object.values(input.positions).some(p => p.gameId === g.id)) continue;
        const gs = st.gameState[g.id] || {};
        input.games.push({ g, pre: st.pre[g.id], dataTs: gs.dataTs, lastScoreChangeTs: gs.lastScoreChangeTs, freezeUntil: gs.freezeUntil,
                           markets: st.markets[g.id] || [], marketTs: st.marketTs[g.id] || 0, enabled: !!R.current.enabled[g.id] });
      }
      const res = CFB.decide(input);
      // peak tracking for trailing stops
      for (const ev of res.evals) {
        const p = pos[ev.ticker]; if (!p) continue;
        const mk = (st.markets[ev.gameId] || []).find(m => m.ticker === ev.ticker); if (!mk) continue;
        const bid = CFB.sideQuotes(mk, p.side).bid;
        if (bid != null && bid > (p.peakBid || 0)) {
          if (R.current.mode === "paper") setPaper(prev => { if (!prev.positions[ev.ticker]) return prev; const n = { ...prev, positions: { ...prev.positions, [ev.ticker]: { ...prev.positions[ev.ticker], peakBid: bid } } }; R.current.paper = n; return n; });
          else if (st.meta[ev.ticker]) { st.meta[ev.ticker].peakBid = bid; p.peakBid = bid; }
        }
      }
      if (!exitsOnly) {
        const v = {};
        for (const G of input.games) v[G.g.id] = { markets: G.markets, proj: G.proj, evals: res.evals.filter(e => e.gameId === G.g.id) };
        setView(v);
      } else setView(prev => ({ ...prev })); // re-render positions with fresh quotes
      if (R.current.running) {
        // exits first, then entries
        const ordered = [...res.actions].filter(a => !exitsOnly || a.type === "sell")
          .sort((x, y) => (x.type === "sell" ? 0 : 1) - (y.type === "sell" ? 0 : 1));
        // an entry must survive confirmTicks consecutive ticks (filters one-tick stale quotes), and
        // nothing is bought in the first warm-up seconds after starting (no state history yet)
        const seen = {};
        for (const a of ordered) {
          if (a.type === "buy") {
            seen[a.ticker] = (st.candSeen[a.ticker] || 0) + 1;
            // feed-lead entries are a race against the market: no multi-tick confirmation
            if (!a.lead && seen[a.ticker] < (cfgNow.confirmTicks || 1)) continue;
            if (Date.now() - st.sessionStart < 15000) continue;
          }
          if (exitsOnly) addLog("info", `Stream: ${a.ticker} price moved — acting immediately`);
          else if (fast) addLog("info", `Fresh score on the core feed — acting before the next tick`);
          await execute(a, gamesById()[a.gameId]);
        }
        if (!exitsOnly && !fast) st.candSeen = seen;
        if (!exitsOnly && st.killed && !res.actions.some(a => a.type === "sell") && Object.keys(input.positions).length === 0) {
          st.killed = false; setRunning(false); addLog("info", "Kill switch complete: all bot positions closed, auto mode stopped.");
        }
      }
    } finally { decidingRef.current = false; }
  }

  // ── Kalshi WebSocket (via /api/kx-ws relay) ─────────────────────────────────
  // ticker channel: ~1s price updates for the markets we care about; fill + market_positions in live mode.
  const stream = useRef({ ws: null, status: "off", tickerSid: null, subTickers: "", backoff: 1000, lastMsg: 0, privateLive: false, msgs: 0, nextId: 1, pending: {} });
  const [streamInfo, setStreamInfo] = useState({ status: "off" });
  function hotTickers() {
    const st = S.current, out = [];
    for (const g of st.games) {
      if (g.state !== "in" && !R.current.enabled[g.id]) continue;
      if (!(R.current.enabled[g.id] || hasPositionInGame(g.id))) continue;
      for (const m of st.markets[g.id] || []) if (!m.half) out.push(m.ticker);
    }
    for (const t of Object.keys(currentPositions())) if (!out.includes(t)) out.push(t);
    return out.slice(0, 1500);
  }
  function wsSend(obj) { const s = stream.current; if (s.ws && s.ws.readyState === 1) { obj.id = s.nextId++; s.ws.send(JSON.stringify(obj)); return obj.id; } return null; }
  function syncStreamSubscriptions() {
    const s = stream.current; if (!s.ws || s.ws.readyState !== 1 || s.status !== "live") return;
    const want = hotTickers(); const key = want.slice().sort().join(",");
    if (key === s.subTickers) return;
    if (s.tickerSid != null) wsSend({ cmd: "unsubscribe", params: { sids: [s.tickerSid] } });
    s.tickerSid = null; s.subTickers = key;
    if (want.length) { const id = wsSend({ cmd: "subscribe", params: { channels: ["ticker"], market_tickers: want } }); s.pending[id] = "ticker"; }
  }
  function connectStream() {
    const s = stream.current;
    if (s.ws) return;
    const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/api/kx-ws";
    const ws = new WebSocket(url); s.ws = ws; s.status = "connecting"; setStreamInfo({ status: "connecting" });
    ws.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      s.lastMsg = Date.now(); s.msgs++;
      if (m.type === "relay_ready") {
        s.status = "live"; s.backoff = 1000; s.subTickers = ""; s.tickerSid = null;
        setStreamInfo({ status: "live" });
        syncStreamSubscriptions();
        if (R.current.mode === "live") { const id = wsSend({ cmd: "subscribe", params: { channels: ["fill", "market_positions"] } }); s.pending[id] = "private"; }
        return;
      }
      if (m.type === "relay_error") { s.status = "error"; setStreamInfo({ status: "error", msg: m.msg }); return; }
      if (m.type === "subscribed") {
        const what = s.pending[m.id]; delete s.pending[m.id];
        if (m.msg && m.msg.channel === "ticker") s.tickerSid = m.msg.sid;
        if (what === "private" || (m.msg && m.msg.channel === "fill")) s.privateLive = true;
        return;
      }
      if (m.type === "error") { addLog("error", `Stream error ${m.msg && m.msg.code}: ${m.msg && m.msg.msg}`); return; }
      if (m.type === "ticker") return onTicker(m.msg);
      if (m.type === "fill" || m.type === "market_position") { if (R.current.mode === "live") refreshLivePositions().catch(() => {}); return; }
    };
    ws.onclose = (ev) => {
      s.ws = null; s.privateLive = false; s.tickerSid = null; s.subTickers = "";
      const wasErr = s.status === "error";
      s.status = "off"; setStreamInfo(prev => ({ status: wasErr ? "error" : "reconnecting", msg: prev.msg }));
      s.backoff = Math.min(60000, s.backoff * 2);
      setTimeout(() => { if (server && server.credentials !== false) connectStream(); }, wasErr ? Math.max(30000, s.backoff) : s.backoff);
    };
    ws.onerror = () => {};
  }
  const fastTimer = useRef(null);
  function onTicker(t) {
    const st = S.current; const tk = t.market_ticker; if (!tk) return;
    let touched = false;
    for (const ms of Object.values(st.markets)) {
      const mk = ms.find(x => x.ticker === tk); if (!mk) continue;
      const cents = (x) => x == null ? null : Math.round(parseFloat(x) * 100);
      if (t.yes_bid_dollars != null) mk.yesBid = cents(t.yes_bid_dollars);
      if (t.yes_ask_dollars != null) mk.yesAsk = cents(t.yes_ask_dollars);
      mk.noBid = mk.yesAsk != null ? 100 - mk.yesAsk : null; mk.noAsk = mk.yesBid != null ? 100 - mk.yesBid : null;
      if (t.yes_bid_size_fp != null) mk.yesBidSize = parseFloat(t.yes_bid_size_fp);
      if (t.yes_ask_size_fp != null) mk.yesAskSize = parseFloat(t.yes_ask_size_fp);
      if (t.volume_fp != null) mk.volume = parseFloat(t.volume_fp);
      mk.streamTs = Date.now(); touched = true;
    }
    // a held market moved: evaluate exits right away instead of waiting for the next tick
    if (touched && currentPositions()[tk] && !fastTimer.current) {
      fastTimer.current = true; sleep(150).then(() => { fastTimer.current = null; decideAndAct({ exitsOnly: true }).catch(() => {}); });
    }
  }
  useEffect(() => { if (server && server.credentials) connectStream(); }, [server]);
  useEffect(() => { // (re)subscribe private channels when switching to live
    if (mode === "live" && stream.current.status === "live" && !stream.current.privateLive) { const id = wsSend({ cmd: "subscribe", params: { channels: ["fill", "market_positions"] } }); stream.current.pending[id] = "private"; }
  }, [mode]);

  function sessionPnl() {
    const st = S.current, pos = currentPositions();
    let unreal = 0;
    for (const [t, p] of Object.entries(pos)) {
      if (p.unmanaged) continue;
      const mk = Object.values(st.markets).flat().find(m => m.ticker === t); if (!mk) continue;
      const bid = CFB.sideQuotes(mk, p.side).bid; if (bid == null) continue;
      unreal += (bid - p.avgCost) * p.count / 100;
    }
    const realized = R.current.mode === "paper" ? (R.current.paper.realized || 0) : st.sessionRealized;
    return realized + unreal;
  }

  useEffect(() => {
    let alive = true;
    // Every /api call is a billed Cloudflare request (free plan: 100k/day). Poll fast only while this tab's own bot is working;
    // as a viewer, refresh every 20s (2 min when the tab is hidden). The server auto trader doesn't need this tab at all.
    const tabBusy = () => R.current.running || Object.keys(currentPositions()).some(t => !currentPositions()[t].unmanaged);
    (async () => { let nextAt = 0;
      while (alive) {
        if (Date.now() >= nextAt) { await tick(); nextAt = Date.now() + (tabBusy() ? TICK_MS : document.hidden ? 120000 : 20000); }
        await sleep(500);
      } })();
    // fast lane: ESPN core every ~1.5s (Kalshi live_data every other pass); a score change in a game we hold triggers an exit check
    (async () => {
      await sleep(2500);
      let pass = 0;
      while (alive) {
        const t0 = Date.now();
        try {
          const st = S.current, before = {};
          for (const g of st.games) before[g.id] = (st.gameState[g.id] || {}).scoreSig;
          pass++;
          if (!tabBusy() && (document.hidden || pass % 10 !== 0)) { await sleep(1500); continue; }   // viewer: ~every 15s, nothing when hidden
          await Promise.all([refreshCore(pass).catch(() => {}), pass % 2 === 0 && tabBusy() ? refreshKalshiLive().catch(() => {}) : null]);
          mergeGames();
          // a fresh score in a game we hold or have on auto: decide right away (exits, and feed-lead entries) instead of waiting for the tick
          const changed = st.games.filter(g => before[g.id] && before[g.id] !== (st.gameState[g.id] || {}).scoreSig);
          if (changed.some(g => hasPositionInGame(g.id) || R.current.enabled[g.id]))
            decideAndAct({ exitsOnly: !R.current.running || R.current.paused, fast: true }).catch(() => {});
        } catch (e) {}
        await sleep(Math.max(300, 1500 - (Date.now() - t0)));
      }
    })();
    return () => { alive = false; };
  }, []);

  // ── Controls ──────────────────────────────────────────────────────────────
  function start() {
    if (runnerSt && runnerSt.running) return alert("The server auto trader is running. Stop it first so the two don't trade the same games.");
    if (mode === "live") {
      if (!server || !server.credentials) return alert("Kalshi credentials aren't configured on the server yet. See the setup panel.");
      if (!server.tradingEnabled) return alert("KALSHI_TRADING_ENABLED is not set to 1 on the server, so orders would be rejected.");
      const typed = prompt(`LIVE MODE places real orders on Kalshi with real money.\n\nBankroll cap: $${cfg.bankroll} · max per entry: $${cfg.maxStake} · max open: $${cfg.maxTotalExposure} · stop for the night at -$${cfg.maxDailyLoss}\n\nType LIVE to start.`);
      if (typed !== "LIVE") return;
    }
    S.current.killed = false; S.current.sessionStart = Date.now();
    setRunning(true); setPaused(false);
    addLog("info", `Auto mode started (${mode.toUpperCase()}) on ${Object.values(enabled).filter(Boolean).length} game(s).`);
  }
  function stop() { setRunning(false); addLog("info", "Auto mode stopped. Open positions are left as they are (resting take-profits stay on Kalshi)."); }
  function kill() {
    if (!confirm("KILL: stop new entries and cash out every bot position at the current bid?")) return;
    S.current.killed = true; setPaused(true);
    if (!running) setRunning(true);
    addLog("error", "KILL SWITCH: cashing out all bot positions.");
  }
  function switchMode(m) {
    if (m === mode) return;
    if (running) return alert("Stop auto mode before switching between paper and live.");
    setMode(m); R.current.mode = m;
    if (m === "live") refreshLivePositions().catch(e => setErr(e.message));
    addLog("info", `Switched to ${m.toUpperCase()} mode.`);
  }
  async function manualCashOut(ticker) {
    const pos = currentPositions()[ticker]; if (!pos) return;
    const mk = Object.values(S.current.markets).flat().find(m => m.ticker === ticker);
    if (!mk) return alert("No live quote for this market yet.");
    const bid = CFB.sideQuotes(mk, pos.side).bid;
    if (!bid) return alert("No bid right now.");
    if (!confirm(`Cash out ${pos.count}× ${labelFor(ticker)} at ${bid}¢? (${fmtSigned$((bid - pos.avgCost) * pos.count / 100)})`)) return;
    await execute({ type: "sell", ticker, side: pos.side, count: pos.count, limit: bid, reason: "manual cash out", gameId: pos.gameId }, gamesById()[pos.gameId]);
  }
  function resetPaper() {
    if (!confirm("Reset the paper account (positions, P&L and history)?")) return;
    const fresh = { positions: {}, realized: 0, trades: [], startBankroll: cfg.bankroll };
    setPaper(fresh); R.current.paper = fresh; addLog("info", "Paper account reset.");
  }

  // ── Derived for render ─────────────────────────────────────────────────────
  const posList = Object.entries(mode === "paper" ? paper.positions : positions).map(([t, p]) => {
    const mk = Object.values(view).flatMap(v => v.markets || []).find(m => m.ticker === t);
    const q = mk ? CFB.sideQuotes(mk, p.side) : {};
    const ev = Object.values(view).flatMap(v => v.evals || []).find(e => e.ticker === t);
    const fair = ev ? (p.side === "yes" ? ev.fairYes : 100 - ev.fairYes) : null;
    const g = games.find(x => x.id === p.gameId);
    return { ticker: t, ...p, bid: q.bid, fair, label: mk ? marketLabel(mk, g) : (p.label || t), game: g,
             pnl: q.bid != null ? (q.bid - p.avgCost) * p.count / 100 : null, note: ev && ev.note };
  });
  const unreal = posList.filter(p => !p.unmanaged && p.pnl != null).reduce((a, p) => a + p.pnl, 0);
  const exposure = posList.filter(p => !p.unmanaged).reduce((a, p) => a + p.count * p.avgCost / 100, 0);
  const realized = mode === "paper" ? (paper.realized || 0) : S.current.sessionRealized;
  const trades = mode === "paper" ? (paper.trades || []) : [];
  const wins = trades.filter(t => t.pnl > 0).length;
  const liveGames = games.filter(g => g.state === "in");
  const upcoming = games.filter(g => g.state === "pre").sort((a, b) => new Date(a.date) - new Date(b.date));
  const finals = games.filter(g => g.state === "post");
  const nEnabled = Object.entries(enabled).filter(([id, v]) => v && games.some(g => g.id === id && g.state !== "post")).length;

  return (

// ── Components ───────────────────────────────────────────────────────────────
const card = { background: T.navy, border: "1px solid " + T.border, borderRadius: 6, padding: "12px 14px" };
const btnBase = { background: T.navy, border: "1px solid " + T.border, color: T.text, padding: "8px 12px", borderRadius: 4, cursor: "pointer", fontSize: 9, fontWeight: 700, letterSpacing: 1, fontFamily: "inherit" };
const th = { textAlign: "left", color: T.muted, fontSize: 8, letterSpacing: 1, padding: "8px 10px", borderBottom: "1px solid " + T.border, textTransform: "uppercase", whiteSpace: "nowrap" };
const td = { padding: "7px 10px", borderBottom: "1px solid " + T.border + "66", verticalAlign: "top" };

function teamTag(t) { return (t.rank ? "#" + t.rank + " " : "") + t.abbr; }

function marketLabel(m, g) {
  const nm = (side) => g ? (side === "home" ? g.home.abbr : g.away.abbr) : side;
  if (m.kind === "win") return `${nm(m.side)} to win`;
  if (m.kind === "spread") return `${nm(m.side)} by ${Math.ceil(m.line)}+`;
  if (m.kind === "total") return `Over ${m.line}`;
  return m.ticker;
}

function Section({ label, right, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", fontSize: 8, letterSpacing: 2.5, color: T.muted, textTransform: "uppercase", marginBottom: 8, paddingBottom: 6, borderBottom: "1px solid " + T.border }}>
        <span style={{ flex: 1 }}>{label}</span>{right}
      </div>
      {children}
    </div>
  );
}
function Stat({ label, value, sub, color }) {
  return (
    <div style={card}>
      <div style={{ fontSize: 8, color: T.muted, letterSpacing: 1, textTransform: "uppercase", marginBottom: 4 }}>{label}</div>
      <div style={{ fontSize: 20, fontWeight: 700, color: color || T.text }}>{value}</div>
      {sub && <div style={{ fontSize: 8, color: T.muted, marginTop: 2 }}>{sub}</div>}
    </div>
  );
}
function Toggle({ on, onClick }) {
  return (
    <button onClick={onClick} title={on ? "Auto on" : "Auto off"} style={{ width: 34, height: 18, borderRadius: 9, border: "1px solid " + (on ? T.green : T.border), background: on ? T.green + "44" : T.navy2, position: "relative", cursor: "pointer", flexShrink: 0 }}>
      <span style={{ position: "absolute", top: 2, left: on ? 17 : 2, width: 12, height: 12, borderRadius: 6, background: on ? T.green : T.muted, transition: "left .15s" }} />
    </button>
  );
}
function StreamBadge({ info, s }) {
  const c = info.status === "live" ? T.green : info.status === "error" ? T.red : T.muted;
  const label = info.status === "live" ? `stream live${s.lastMsg ? " · " + Math.max(0, Math.round((Date.now() - s.lastMsg) / 1000)) + "s" : ""}`
    : info.status === "error" ? "stream error" : info.status === "off" ? "stream off (polling)" : "stream " + info.status;
  return <span title={info.msg || ""} style={{ fontSize: 9, color: c }}>● {label}</span>;
}
function ServerBadge({ server }) {
  if (!server) return <span style={{ fontSize: 9, color: T.muted }}>checking server…</span>;
  if (server.error) return <span style={{ fontSize: 9, color: T.red }}>server: {server.error}</span>;
  const c = server.credentials && server.tradingEnabled ? T.green : server.credentials ? T.gold : T.muted;
  return <span style={{ fontSize: 9, color: c }}>Kalshi {server.env}: {server.credentials ? "keys ✓" : "no keys"} · trading {server.tradingEnabled ? "enabled" : "off"} · cap ${server.maxOrderDollars}/order</span>;
}

function GameCard({ g, v, pre, gs, on, toggle }) {
  const evals = (v && v.evals) || [];
  const proj = v && v.proj;
  const win = (v && v.markets || []).find(m => m.kind === "win" && m.side === "home");
  const mktHome = win ? CFB.mid(win) : null;
  const top = evals.filter(e => e.edge != null || e.held).sort((a, b) => (b.held - a.held) || ((b.edge || -99) - (a.edge || -99))).slice(0, 5);
  const freeze = gs && gs.freezeUntil && gs.freezeUntil > Date.now();
  const possArrow = (side) => g.possession === side ? <span style={{ color: T.gold }}> ◂</span> : null;
  return (
    <div style={{ ...card, borderColor: on ? T.green + "88" : T.border }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
        <Toggle on={on} onClick={toggle} />
        <div style={{ flex: 1, fontSize: 9, color: T.muted }}>{g.feed !== "espn" && g.state === "in" && g.statusName !== "STATUS_HALFTIME" ? `Q${g.period} ${g.clock}` : g.detail}{g.broadcast ? " · " + g.broadcast : ""}
          <span style={{ marginLeft: 6, color: g.feed === "espn" ? T.dim : T.green }}>{g.feed === "core" ? "● espn core" : g.feed === "kalshi" ? "● kalshi feed" : "espn scoreboard"}</span>
          {g.reviewPending && <span style={{ marginLeft: 6, color: T.gold }}>review/PAT</span>}</div>
        {!gs || !gs.suffix ? <span style={{ fontSize: 8, color: T.red }}>no Kalshi match</span> : freeze ? <span style={{ fontSize: 8, color: T.gold }}>catching up…</span> : null}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr auto", rowGap: 2, fontSize: 13, fontWeight: 700 }}>
        <div>{teamTag(g.away)} <span style={{ fontSize: 9, color: T.muted, fontWeight: 400 }}>{g.away.short}</span>{possArrow("away")}</div><div>{g.away.score}</div>
        <div>{teamTag(g.home)} <span style={{ fontSize: 9, color: T.muted, fontWeight: 400 }}>{g.home.short}</span>{possArrow("home")}</div><div>{g.home.score}</div>
      </div>
      <div style={{ fontSize: 9, color: T.muted, margin: "6px 0 8px", minHeight: 12 }}>{g.downDistanceText || g.lastPlay || ""}</div>
      <div style={{ display: "flex", gap: 12, fontSize: 9, marginBottom: 8, flexWrap: "wrap" }}>
        <span>Kalshi {g.home.abbr} <b>{mktHome != null ? mktHome.toFixed(0) + "%" : "—"}</b></span>
        <span>Model <b style={{ color: T.purple }}>{proj && !proj.unreliable ? (proj.pHome * 100).toFixed(0) + "%" : "—"}</b></span>
        {g.espnHomeWP != null && <span style={{ color: T.muted }}>ESPN {(g.espnHomeWP * 100).toFixed(0)}%</span>}
        <span style={{ color: T.muted }}>pre {pre && pre.spreadHome != null ? `${pre.spreadHome > 0 ? g.home.abbr : g.away.abbr} -${Math.abs(pre.spreadHome)} / ${pre.total}` : "n/a"}</span>
      </div>
      {top.length > 0 && (
        <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 9 }}>
          <tbody>
            {top.map(e => {
              const m = (v.markets || []).find(x => x.ticker === e.ticker);
              const c = e.held ? T.gold : e.edge >= 0 ? T.green : T.muted;
              return (
                <tr key={e.ticker}>
                  <td style={{ padding: "2px 0", color: e.held ? T.gold : T.text }}>{m ? marketLabel(m, g) : e.ticker}</td>
                  <td style={{ padding: "2px 4px", color: T.muted }}>{e.yesBid}/{e.yesAsk}</td>
                  <td style={{ padding: "2px 4px", color: T.purple }}>{e.fairYes.toFixed(0)}</td>
                  <td style={{ padding: "2px 0", color: c, textAlign: "right", fontSize: 8 }}>{e.held ? e.note : e.edge != null ? `${e.bestSide.toUpperCase()} ${e.edge >= 0 ? "+" : ""}${e.edge.toFixed(1)}¢` : ""}</td>
                </tr>
              );
            })}
          </tbody>
        </table>
      )}
    </div>
  );
}

// The main control: pick games, pick paper or live, press start. It runs on the server, so this tab can close.
function ServerRunner({ cfg, enabled, liveGames, nEnabled, browserRunning, onStatus, onRules, onAllOn }) {
  const [st, setSt] = useState(null), [err, setErr] = useState(""), [busy, setBusy] = useState(false);
  const [pick, setPick] = useState(() => load("sharp_runner_mode", "paper"));
  const [acct, setAcct] = useState(null), [synced, setSynced] = useState(null), [showLog, setShowLog] = useState(false);
  const refresh = useCallback(() => getJSON("/api/runner/status").then(d => { setSt(d); setErr(""); onStatus && onStatus(d); }).catch(e => setErr(e.message)), []);
  useEffect(() => { refresh(); let last = Date.now();
    const id = setInterval(() => { if (!document.hidden || Date.now() - last > 60000) { last = Date.now(); refresh(); } }, 5000);
    return () => clearInterval(id); }, [refresh]);
  useEffect(() => save("sharp_runner_mode", pick), [pick]);
  const running = !!(st && st.running), mode = running ? st.mode : pick, isLive = mode === "live";
  // Kalshi connection check whenever live is picked (read-only balance call on the runner)
  useEffect(() => {
    if (!isLive) return;
    let alive = true;
    const go = () => getJSON("/api/runner/account").then(a => alive && setAcct(a)).catch(e => alive && setAcct({ connected: false, error: e.message }));
    go(); const id = setInterval(go, 30000); return () => { alive = false; clearInterval(id); };
  }, [isLive]);
  const enabledMap = () => Object.fromEntries(Object.keys(enabled).filter(k => enabled[k]).map(k => [k, true]));
  // while running, rule and game changes on this page go to the server automatically
  const sig = JSON.stringify([cfg, enabledMap()]);
  const lastSent = useRef(null);
  useEffect(() => {
    if (!running) { lastSent.current = null; return; }
    if (lastSent.current === null) { lastSent.current = sig; return; }
    if (lastSent.current === sig) return;
    const id = setTimeout(() => sendJSON("POST", "/api/runner/config", { cfg, enabled: enabledMap() })
      .then(() => { lastSent.current = sig; setSynced(Date.now()); }).catch(e => setErr("couldn't send rules: " + e.message)), 1200);
    return () => clearTimeout(id);
  }, [sig, running]);
  async function call(path, body) {
    setBusy(true);
    try { const d = await sendJSON("POST", "/api/runner/" + path, body || {}); setSt(s => ({ ...s, ...d })); setErr(""); refresh(); }
    catch (e) { setErr(e.message); alert("Auto trader: " + e.message); }
    finally { setBusy(false); }
  }
  const entries = !!(st && st.entries), nManaged = st ? st.managedCount || 0 : 0;
  const checks = [
    { ok: nManaged > 0 || entries, label: nManaged > 0 ? `Managing ${nManaged} of your position${nManaged === 1 ? "" : "s"}` : entries ? "Not managing any of your positions (fine: it will look for new trades)" : "Pick at least one of your positions below and set its sell rules" },
  ];
  if (entries) {
    checks.push({ ok: nEnabled > 0, label: nEnabled > 0 ? `New trades in ${nEnabled} game${nEnabled === 1 ? "" : "s"}` : "Pick games for new trades with the toggles below",
      fix: nEnabled === 0 && liveGames.length > 0 ? <a style={{ color: T.accent, cursor: "pointer" }} onClick={onAllOn}>turn on all live games</a> : null });
    checks.push({ ok: true, label: `New-trade limits: up to $${Math.min(cfg.maxStake, 25)} per entry · $${Math.min(cfg.maxTotalExposure, 150)} open · stops for the night at −$${cfg.maxDailyLoss}`,
      fix: <a style={{ color: T.accent, cursor: "pointer" }} onClick={onRules}>change</a> });
  }
  if (isLive) {
    checks.push({ ok: !!(acct && acct.connected), label: !acct ? "Checking the Kalshi connection…" : acct.connected ? `Kalshi connected · ${fmt$(acct.cash)} cash` : `Kalshi not connected (${acct.error})` });
    checks.push({ ok: !!(st && st.tradingEnabled), label: st && st.tradingEnabled ? "Live trading switch is on" : "Live trading switch is off on the server",
      fix: st && !st.tradingEnabled ? <span style={{ color: T.muted }}>turn it on in a terminal: <code style={{ color: T.text }}>cd ~/Documents/Apps/wc26/runner && echo 1 | npx --yes wrangler@3 secret put KALSHI_TRADING_ENABLED</code></span> : null });
  }
  if (browserRunning) checks.push({ ok: false, label: "The in-tab bot below is running. Stop it first so the two don't trade the same games." });
  const ready = st && checks.every(c => c.ok);
  function start() {
    if (!ready) return;
    if (isLive) {
      const what = (nManaged ? `It will SELL your managed positions on Kalshi when their rules hit (${nManaged} position${nManaged === 1 ? "" : "s"}).` : "")
        + (entries ? `\nIt will also OPEN new trades: up to $${Math.min(cfg.maxStake, 25)} per entry · $${Math.min(cfg.maxTotalExposure, 150)} open · stops for the night at −$${cfg.maxDailyLoss}.` : "\nIt will not open any new trades.");
      const typed = prompt(`LIVE: real orders on Kalshi from the server, even with this page closed.\n\n${what}\n\nType LIVE to start.`);
      if (typed !== "LIVE") return;
      call("start", { mode: "live", confirm: "LIVE", cfg, enabled: enabledMap() });
    } else call("start", { mode: "paper", cfg, enabled: enabledMap() });
  }
  function setEntries(on) {
    if (on && !confirm("Also let it open its own trades?\n\nTesting so far shows no edge: the free score feeds are slower than Kalshi's prices. Leave this off unless you're testing.")) return;
    call("settings", { entries: on });
  }
  const ago = (ts) => ts ? Math.max(0, Math.round((Date.now() - ts) / 1000)) + "s ago" : "never";
  const stale = running && st.lastTick && Date.now() - st.lastTick > 90000;
  const pnl = st ? (st.realized || 0) + (st.open || 0) : 0;
  const accent = running ? (isLive ? T.red : T.green) : T.border;
  const big = { ...btnBase, padding: "10px 18px", fontSize: 11 };
  return (
    <div style={{ ...card, borderColor: accent, borderWidth: running ? 2 : 1, marginBottom: 14 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
        <div>
          <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1.5, color: T.text }}>AUTO TRADER</div>
          <div style={{ fontSize: 9, color: T.muted, marginTop: 2 }}>Runs on the server. You can close this page once it's started.</div>
        </div>
        <div style={{ flex: 1 }} />
        <div style={{ display: "flex", border: "1px solid " + T.border, borderRadius: 4, overflow: "hidden", opacity: running ? 0.5 : 1 }} title={running ? "Stop before switching" : ""}>
          {["paper", "live"].map(m => (
            <button key={m} disabled={running} onClick={() => setPick(m)} style={{ ...btnBase, border: "none", borderRadius: 0, background: mode === m ? (m === "live" ? T.red : T.blue) + "33" : "transparent", color: mode === m ? (m === "live" ? T.red : T.blue) : T.muted }}>
              {m === "paper" ? "PAPER (practice)" : "LIVE $"}
            </button>))}
        </div>
        {!running && <button disabled={busy || !ready} onClick={start} style={{ ...big, background: (isLive ? T.red : T.green) + (ready ? "33" : "11"), borderColor: isLive ? T.red : T.green, color: isLive ? T.red : T.green, opacity: ready ? 1 : 0.5, cursor: ready ? "pointer" : "not-allowed" }}>
          ▶ START {isLive ? "LIVE" : "PAPER"}</button>}
        {running && <button disabled={busy} onClick={() => call("stop")} style={{ ...big, color: T.gold, borderColor: T.gold }}>■ STOP</button>}
        {(running || (st && st.positions.length > 0)) && <button disabled={busy} onClick={() => { if (confirm(isLive ? "Sell every position the auto trader manages (including the ones you handed over) at the current bid, and stop?" : "Paper: close the bot's paper positions and record would-sells for your managed positions, then stop?")) call("kill"); }} style={{ ...big, color: T.red, borderColor: T.red }}>✕ CASH OUT ALL</button>}
      </div>

      {st && (
        <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap", fontSize: 9, color: T.muted }}>
          <span>What it does:</span>
          <div style={{ display: "flex", border: "1px solid " + T.border, borderRadius: 4, overflow: "hidden" }}>
            <button disabled={busy} onClick={() => entries && setEntries(false)} style={{ ...btnBase, padding: "5px 10px", border: "none", borderRadius: 0, background: !entries ? T.accent + "22" : "transparent", color: !entries ? T.accent : T.muted }}>MANAGE MY POSITIONS</button>
            <button disabled={busy} onClick={() => !entries && setEntries(true)} style={{ ...btnBase, padding: "5px 10px", border: "none", borderRadius: 0, background: entries ? T.gold + "22" : "transparent", color: entries ? T.gold : T.muted }}>+ FIND NEW TRADES (experimental)</button>
          </div>
          <span>{entries ? "Manages the positions you pick and also opens its own trades." : "Sells the positions you pick at your target, stop or trailing stop. It never buys."}</span>
        </div>)}
      {err && <div style={{ fontSize: 9, color: T.red, marginTop: 8 }}>{err}</div>}
      {!st && !err && <div style={{ fontSize: 9, color: T.muted, marginTop: 8 }}>Connecting to the server…</div>}

      {st && !running && (
        <div style={{ marginTop: 10, display: "grid", gap: 4 }}>
          {checks.map((c, i) => (
            <div key={i} style={{ fontSize: 10, color: c.ok ? T.text : T.gold, display: "flex", gap: 6, flexWrap: "wrap" }}>
              <span style={{ color: c.ok ? T.green : T.gold, width: 12 }}>{c.ok ? "✓" : "○"}</span><span>{c.label}</span>{c.fix && <span style={{ fontSize: 9 }}>· {c.fix}</span>}
            </div>))}
        </div>)}

      {st && running && (
        <div style={{ marginTop: 10, fontSize: 10, display: "flex", gap: 14, flexWrap: "wrap", alignItems: "center" }}>
          <span style={{ color: accent, fontWeight: 700, animation: "pulse 1.5s infinite" }}>● {isLive ? "LIVE · REAL MONEY" : "PAPER TRADING"}{st.killed ? " · CASHING OUT" : ""}</span>
          <span style={{ color: stale ? T.red : T.muted }}>{stale ? "⚠ server hasn't checked in for 90s" : `checking ${st.games} live games · last ${ago(st.lastTick)}`}</span>
          <span style={{ color: pnl >= 0 ? T.green : T.red, fontWeight: 700 }}>P&L {fmtSigned$(pnl)}</span>
          <span style={{ color: T.muted }}>{st.record.n} trades · {st.record.wins}W-{st.record.n - st.record.wins}L</span>
          <span style={{ color: T.muted }}>{nEnabled} games picked{synced ? " · rule changes sent " + new Date(synced).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : " · rule and game changes here are sent automatically"}</span>
        </div>)}

      {st && <MyPositions st={st} busy={busy} call={call} isLive={isLive} running={running} />}

      {st && (st.shadowTrades || []).length > 0 && (
        <div style={{ marginTop: 10, borderTop: "1px solid " + T.border, paddingTop: 10 }}>
          <div style={{ fontSize: 8, letterSpacing: 2, color: T.muted, marginBottom: 4 }}>PAPER: WHAT IT WOULD HAVE SOLD (nothing was sold)</div>
          {st.shadowTrades.slice(0, 8).map((t, i) => (
            <div key={i} style={{ fontSize: 10, color: T.text, display: "flex", gap: 6 }}>
              <span style={{ flex: 1 }}>{new Date(t.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} {t.label} {t.side.toUpperCase()} · {t.reason}</span>
              <span>{t.count}× {t.entry}→{t.exit}¢</span><span style={{ color: t.pnl >= 0 ? T.green : T.red }}>{fmtSigned$(t.pnl)}</span>
            </div>))}
        </div>)}

      {st && (st.positions.filter(p => !p.unmanaged && !st.myPositions.some(m => m.ticker === p.ticker && m.rules)).length > 0 || st.trades.length > 0 || (running && entries)) && (
        <div style={{ marginTop: 10, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(260px,1fr))", gap: 12, borderTop: "1px solid " + T.border, paddingTop: 10 }}>
          <div>
            <div style={{ fontSize: 8, letterSpacing: 2, color: T.muted, marginBottom: 4 }}>BOT'S OWN POSITIONS ({st.positions.filter(p => !p.unmanaged).length})</div>
            {st.positions.filter(p => !p.unmanaged).length === 0 && <div style={{ fontSize: 9, color: T.dim }}>none</div>}
            {st.positions.filter(p => !p.unmanaged).map(p => (
              <div key={p.ticker} style={{ fontSize: 10, color: T.text, display: "flex", gap: 6 }}>
                <span style={{ flex: 1 }}>{p.label} {p.side.toUpperCase()}{p.lead ? " ⚡" : ""}{p.unmanaged ? " (yours, not managed)" : ""}</span>
                <span>{p.count}× {p.avgCost}¢ → {p.bid == null ? "—" : p.bid + "¢"}</span>
                <span style={{ color: p.bid != null && p.bid >= p.avgCost ? T.green : T.red }}>{p.bid != null ? fmtSigned$((p.bid - p.avgCost) * p.count / 100) : ""}</span>
              </div>))}
          </div>
          <div>
            <div style={{ fontSize: 8, letterSpacing: 2, color: T.muted, marginBottom: 4 }}>BOT'S CLOSED TRADES</div>
            {st.trades.length === 0 && <div style={{ fontSize: 9, color: T.dim }}>none yet</div>}
            {st.trades.slice(0, 8).map((t, i) => (
              <div key={i} style={{ fontSize: 10, color: T.text, display: "flex", gap: 6 }}>
                <span style={{ flex: 1 }}>{new Date(t.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })} {t.label}{t.lead ? " ⚡" : ""}</span>
                <span>{t.entry}→{t.exit}¢</span><span style={{ color: t.pnl >= 0 ? T.green : T.red }}>{fmtSigned$(t.pnl)}</span>
              </div>))}
          </div>
        </div>)}

      {st && (st.log || []).length > 0 && (
        <div style={{ marginTop: 8 }}>
          <a style={{ fontSize: 9, color: T.muted, cursor: "pointer" }} onClick={() => setShowLog(s => !s)}>{showLog ? "▾ hide server log" : "▸ server log"}</a>
          {showLog && <div style={{ maxHeight: 180, overflowY: "auto", marginTop: 4 }}>
            {st.log.slice(0, 60).map((l, i) => (
              <div key={i} style={{ fontSize: 9, color: l.kind === "error" || l.kind === "loss" ? T.red : l.kind === "win" ? T.green : T.muted }}>{new Date(l.ts).toLocaleTimeString()} {l.msg}</div>))}
          </div>}
        </div>)}
    </div>
  );
}


// Your own Kalshi positions, read from your account by the server. Tick one to hand it over with your sell rules.
function MyPositions({ st, busy, call, isLive, running }) {
  const list = (st.myPositions || []).filter(p => !p.botOwned);
  const [edit, setEdit] = useState({});
  if (!st.credentials) return <div style={{ marginTop: 10, fontSize: 9, color: T.muted }}>Your Kalshi positions show here once the server has your Kalshi key.</div>;
  const age = st.myPositionsTs ? Math.round((Date.now() - st.myPositionsTs) / 1000) : null;
  const inp = { width: 38, background: T.bg, border: "1px solid " + T.border, color: T.text, fontFamily: "inherit", fontSize: 10, padding: "3px 4px", borderRadius: 3 };
  const draft = (p) => edit[p.ticker] || (p.rules ? { tp: p.rules.tpPrice || "", sl: p.rules.slPrice || "", arm: p.rules.trailArm || "", give: p.rules.trailGive || "" }
    : { tp: Math.min(95, p.avgCost + 15), sl: Math.max(1, p.avgCost - 15), arm: "", give: "" });
  const set = (p, k, v) => setEdit(e => ({ ...e, [p.ticker]: { ...draft(p), [k]: v } }));
  const save = (p) => { const d = draft(p); call("manage", { ticker: p.ticker, rules: { tpPrice: d.tp, slPrice: d.sl, trailArm: d.arm, trailGive: d.give } }); setEdit(e => { const n = { ...e }; Reflect.deleteProperty(n, p.ticker); return n; }); };
  return (
    <div style={{ marginTop: 10, borderTop: "1px solid " + T.border, paddingTop: 10 }}>
      <div style={{ fontSize: 8, letterSpacing: 2, color: T.muted, marginBottom: 6 }}>
        YOUR KALSHI POSITIONS ({list.length}){age != null ? ` · read ${age}s ago` : ""}
        <span style={{ letterSpacing: 0, marginLeft: 8, color: T.dim }}>{isLive ? "live: rules sell for real" : "paper: rules only record what would have sold"}</span>
      </div>
      {list.length === 0 && <div style={{ fontSize: 9, color: T.dim }}>No college football positions in your account right now.</div>}
      {list.map(p => {
        const d = draft(p), dirty = !!edit[p.ticker], pnl = p.bid != null ? (p.bid - p.avgCost) * p.count / 100 : null;
        return (
          <div key={p.ticker} style={{ padding: "6px 0", borderBottom: "1px solid " + T.border + "88", display: "flex", gap: 10, flexWrap: "wrap", alignItems: "center", fontSize: 10 }}>
            <div style={{ minWidth: 200, flex: 1 }}>
              <div style={{ color: T.text, fontWeight: 700 }}>{p.label} {p.side.toUpperCase()} {p.rules && <span style={{ color: T.green, fontWeight: 400 }}>✓ managed</span>}</div>
              <div style={{ fontSize: 8, color: T.muted }}>{p.game}</div>
            </div>
            <div style={{ color: T.text }}>{p.count}× {p.avgCost}¢ → {p.bid == null ? "—" : p.bid + "¢"} <span style={{ color: (pnl || 0) >= 0 ? T.green : T.red }}>{pnl != null ? fmtSigned$(pnl) : ""}</span></div>
            <div style={{ display: "flex", gap: 6, alignItems: "center", color: T.muted, fontSize: 9, flexWrap: "wrap" }}>
              sell at <input style={inp} value={d.tp} onChange={e => set(p, "tp", e.target.value)} />¢
              stop at <input style={inp} value={d.sl} onChange={e => set(p, "sl", e.target.value)} />¢
              trail <input style={inp} placeholder="off" value={d.give} onChange={e => set(p, "give", e.target.value)} />¢ after +<input style={inp} placeholder="0" value={d.arm} onChange={e => set(p, "arm", e.target.value)} />¢
            </div>
            <div style={{ display: "flex", gap: 6 }}>
              {(!p.rules || dirty) && <button disabled={busy} onClick={() => save(p)} style={{ ...btnBase, padding: "4px 10px", fontSize: 8, color: T.accent, borderColor: T.accent }}>{p.rules ? "SAVE" : "MANAGE"}</button>}
              {p.rules && <button disabled={busy} onClick={() => call("manage", { ticker: p.ticker, rules: null })} style={{ ...btnBase, padding: "4px 10px", fontSize: 8, color: T.muted }}>STOP MANAGING</button>}
            </div>
            {p.rules && !isLive && p.shadowDone && <div style={{ width: "100%", fontSize: 8, color: T.gold }}>paper: its rule hit, see "would have sold" below. Save the rules again to keep watching.</div>}
            {p.rules && !p.live && <div style={{ width: "100%", fontSize: 8, color: T.dim }}>acts once the game is live{running ? "" : " and the auto trader is started"}</div>}
          </div>);
      })}
    </div>
  );
}

function ConfigPanel({ cfg, setCfg, mode, onResetPaper, server }) {
  const set = (k, v) => setCfg(c => ({ ...c, [k]: v }));
  return (
    <div style={{ ...card, marginBottom: 14 }}>
      {CFG_FIELDS.map(([title, fields]) => (
        <div key={title} style={{ marginBottom: 12 }}>
          <div style={{ fontSize: 8, color: T.gold, letterSpacing: 2, textTransform: "uppercase", marginBottom: 6 }}>{title}</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(200px,1fr))", gap: 8 }}>
            {fields.map(([k, label, step]) => (
              <label key={k} style={{ fontSize: 9, color: T.muted }}>
                {label}
                <input type="number" step={step || 1} value={cfg[k] ?? ""} onChange={e => set(k, e.target.value === "" ? "" : Number(e.target.value))}
                  style={{ display: "block", width: "100%", marginTop: 3, background: T.bg, border: "1px solid " + T.border, color: T.text, padding: "6px 8px", borderRadius: 4, fontSize: 10 }} />
              </label>
            ))}
          </div>
        </div>
      ))}
      <div style={{ display: "flex", gap: 16, flexWrap: "wrap", fontSize: 9, color: T.muted, alignItems: "center" }}>
        {["win", "spread", "total"].map(k => (
          <label key={k}><input type="checkbox" checked={!!cfg.kinds[k]} onChange={e => set("kinds", { ...cfg.kinds, [k]: e.target.checked })} /> trade {k === "win" ? "moneyline" : k === "spread" ? "spreads" : "totals"}</label>
        ))}
        <label><input type="checkbox" checked={!!cfg.restingTakeProfit} onChange={e => set("restingTakeProfit", e.target.checked)} /> rest a take-profit sell on Kalshi after each buy</label>
        <label>game feed <select value={cfg.liveFeed || "auto"} onChange={e => set("liveFeed", e.target.value)} style={{ background: T.bg, color: T.text, border: "1px solid " + T.border, fontSize: 9 }}><option value="auto">Auto (fastest)</option><option value="core">ESPN core</option><option value="kalshi">Kalshi (Stats Perform)</option><option value="espn">ESPN scoreboard</option></select></label>
        <label><input type="checkbox" checked={!!cfg.manageManual} onChange={e => set("manageManual", e.target.checked)} /> also manage CFB positions I opened myself (live)</label>
        <div style={{ flex: 1 }} />
        <button style={{ ...btnBase, padding: "4px 8px", fontSize: 8 }} onClick={() => setCfg({ ...CFB.DEFAULT_CONFIG })}>RESET RULES</button>
        {mode === "paper" && <button style={{ ...btnBase, padding: "4px 8px", fontSize: 8 }} onClick={onResetPaper}>RESET PAPER ACCOUNT</button>}
      </div>
      {server && !server.credentials && (
        <div style={{ marginTop: 12, fontSize: 9, color: T.muted, lineHeight: 1.7, borderTop: "1px solid " + T.border, paddingTop: 10 }}>
          <b style={{ color: T.gold }}>Live setup:</b> create an API key at kalshi.com → Account → API Keys, then in Cloudflare Pages → Settings → Environment variables add secrets
          <code> KALSHI_API_KEY_ID</code>, <code>KALSHI_PRIVATE_KEY</code> (paste the whole PEM), <code>KALSHI_TRADING_ENABLED=1</code> and <code>KALSHI_MAX_ORDER_DOLLARS</code> (server-side cap per order), then redeploy.
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
