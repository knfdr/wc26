function ServerRunner({ cfg, enabled, liveGames, nEnabled, browserRunning, browserMode, onStatus, onRules, onAllOn, foot, pnl }) {
  const [st, setSt] = useState(null), [err, setErr] = useState(""), [busy, setBusy] = useState(false);
  const [pick, setPick] = useState(() => load("sharp_runner_mode", "paper"));
  const [acct, setAcct] = useState(null), [synced, setSynced] = useState(null), [showLog, setShowLog] = useState(false);
  const refresh = useCallback(() => getJSON("/api/runner/status").then(d => {
      // when Cloudflare's daily request limit is hit, the site serves its home page instead of the API: don't render that as a status
      if (!d || typeof d !== "object" || !Array.isArray(d.positions)) throw new Error("Can't reach the server auto trader right now (Cloudflare's daily request limit may be used up; it resets at 7 PM Eastern).");
      d.trades = d.trades || []; d.myPositions = d.myPositions || []; d.shadowTrades = d.shadowTrades || []; d.record = d.record || { n: 0, wins: 0 };
      setSt(d); setErr(""); onStatus && onStatus(d); }).catch(e => { setErr(e.message); setSt(null); onStatus && onStatus(null); }), []);
  useEffect(() => { refresh(); let last = Date.now();
    const id = setInterval(() => { if (!document.hidden || Date.now() - last > 60000) { last = Date.now(); refresh(); } }, 3000);
    return () => clearInterval(id); }, [refresh]);
  useEffect(() => save("sharp_runner_mode", pick), [pick]);
  const running = !!(st && st.running), mode = running ? st.mode : pick, isLive = mode === "live";
  // Kalshi connection check whenever live is picked (read-only balance call on the runner)
  useEffect(() => {
    if (!isLive) return;
    let alive = true;
    const go = () => getJSON("/api/runner/account").then(a => alive && setAcct(a)).catch(e => alive && setAcct({ connected: false, error: e.message }));
    go(); const id = setInterval(go, 30000); return () => { alive = false; clearInterval(id); };
  }, [isLive]);
  // this page only knows one league's games: merge its picks over the server's so the other league's picks survive
  const enabledMap = () => { const out = { ...((st && st.enabled) || {}) }; Reflect.deleteProperty(out, "all");
    for (const [k, v] of Object.entries(enabled)) { if (v) out[k] = true; else Reflect.deleteProperty(out, k); } return out; };
  // while running, rule and game changes on this page go to the server automatically
  const sig = JSON.stringify([cfg, enabledMap()]);
  const lastSent = useRef(null);
  useEffect(() => {
    if (!running) { lastSent.current = null; return; }
    if (lastSent.current === null) { lastSent.current = sig; return; }
    if (lastSent.current === sig) return;
    const id = setTimeout(() => sendJSON("POST", "/api/runner/config", { cfg, enabled: enabledMap() })
      .then(() => { lastSent.current = sig; setSynced(Date.now()); }).catch(e => setErr("couldn't send rules: " + e.message)), 1200);
    return () => clearTimeout(id);
  }, [sig, running]);
  async function call(path, body) {
    setBusy(true);
    try { const d = await sendJSON("POST", "/api/runner/" + path, body || {}); setSt(s => ({ ...s, ...d })); setErr(""); refresh(); }
    catch (e) { setErr(e.message); alert("Auto trader: " + e.message); }
    finally { setBusy(false); }
  }
  const entries = !!(st && st.entries), nManaged = st ? st.managedCount || 0 : 0;
  const link = (onClick, text) => <button className="link" style={{ background: "none", border: 0, padding: 0, font: "inherit" }} onClick={onClick}>{text}</button>;
  const checks = [
    { ok: nManaged > 0 || entries, label: nManaged > 0 ? `Managing ${nManaged} of your position${nManaged === 1 ? "" : "s"}` : entries ? "Not managing any of your positions (fine: it will look for new trades)" : "Pick at least one of your positions below and set its sell rules" },
  ];
  if (entries) {
    checks.push({ ok: nEnabled > 0, label: nEnabled > 0 ? `New trades in ${nEnabled} game${nEnabled === 1 ? "" : "s"}` : "Pick games for new trades with the switches below",
      fix: nEnabled === 0 && liveGames.length > 0 ? link(onAllOn, "Turn on all live games") : null });
    checks.push({ ok: true, label: `New-trade limits: up to $${Math.min(cfg.maxStake, 25)} per entry · $${Math.min(cfg.maxTotalExposure, 150)} open · stops for the night at −$${cfg.maxDailyLoss}`,
      fix: link(onRules, "Change") });
  }
  if (isLive) {
    checks.push({ ok: !!(acct && acct.connected), label: !acct ? "Checking the Kalshi connection…" : acct.connected ? `Kalshi connected · ${fmt$(acct.cash)} cash` : `Kalshi not connected (${acct.error})` });
    checks.push({ ok: !!(st && st.tradingEnabled), label: st && st.tradingEnabled ? "Live trading switch is on" : "Live trading switch is off on the server",
      fix: st && !st.tradingEnabled ? <span>Turn it on in a terminal: <code>cd ~/Documents/Apps/wc26/runner && echo 1 | npx --yes wrangler@3 secret put KALSHI_TRADING_ENABLED</code></span> : null });
  }
  if (browserRunning) checks.push({ ok: false, label: "The in-tab bot below is running. Stop it first so the two don't trade the same games." });
  const ready = st && checks.every(c => c.ok);
  function start() {
    if (!ready) return;
    if (isLive) {
      const what = (nManaged ? `It will SELL your managed positions on Kalshi when their rules hit (${nManaged} position${nManaged === 1 ? "" : "s"}).` : "")
        + (entries ? `\nIt will also OPEN new trades: up to $${Math.min(cfg.maxStake, 25)} per entry · $${Math.min(cfg.maxTotalExposure, 150)} open · stops for the night at −$${cfg.maxDailyLoss}.` : "\nIt will not open any new trades.");
      const typed = prompt(`LIVE: real orders on Kalshi from the server, even with this page closed.\n\n${what}\n\nType LIVE to start.`);
      if (typed !== "LIVE") return;
      call("start", { mode: "live", confirm: "LIVE", cfg, enabled: enabledMap() });
    } else call("start", { mode: "paper", cfg, enabled: enabledMap() });
  }
  function setEntries(on) {
    if (on && !confirm("Also let it open its own trades?\n\nTesting so far shows no edge: the free score feeds are slower than Kalshi's prices. Leave this off unless you're testing.")) return;
    call("settings", { entries: on });
  }
  const stale = running && st.lastTick && Date.now() - st.lastTick > 90000;
  const pnlNow = st ? (st.realized || 0) + (st.open || 0) : 0;
  const tone = running ? (isLive ? "live" : "paper") : "off";
  const dot = running ? (isLive ? "var(--neg)" : "var(--pos)") : st ? "var(--faint)" : err ? "var(--small)" : "var(--faint)";
  const title = running ? (isLive ? "Running with real money" : "Running in paper mode") + (st.killed ? ": cashing out" : "")
    : st ? "Stopped" : err ? "Can't reach the server trader" : "Connecting to the server…";
  const sub = running ? (isLive ? "Live mode: it places real orders on Kalshi, even with this page closed." : "Paper mode: practice only. Nothing is really bought or sold.")
    : st ? (isLive ? "Live mode (real money) is picked. Nothing happens until you press Start." : "Paper mode (practice) is picked. Nothing happens until you press Start.")
    : err ? err : "Checking whether the server trader is running.";
  const botPos = st ? st.positions.filter(p => !p.unmanaged) : [];
  return (
    <>
      <div className={"card lv-status" + (tone === "live" ? " is-live" : tone === "paper" ? " is-paper" : "")} role="status" aria-live="polite">
        <div className="row" style={{ marginBottom: 8 }}>
          <span className="small muted" style={{ fontWeight: 500 }}>Server auto trader</span>
          <span className={"lv-pill " + (isLive ? "live" : "paper")}>{isLive ? "LIVE · real money" : "PAPER · practice"}</span>
        </div>
        <div className="lv-state">
          <span className={"lv-dot" + (running ? " pulse" : "")} style={{ "--c": dot }} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div className="lv-state-title">{title}</div>
            <div className="lv-state-sub">{sub}</div>
          </div>
        </div>

        {st && running && (
          <div className="lv-running">
            <span>P&amp;L <b style={{ color: pnlNow >= 0 ? "var(--pos)" : "var(--neg)" }}>{fmtSigned$(pnlNow)}</b></span>
            <span><b>{st.record.n}</b> trades · {st.record.wins}W–{st.record.n - st.record.wins}L</span>
            <span style={stale ? { color: "var(--neg)", fontWeight: 600 } : null}>{stale ? "The server hasn't checked in for 90s" : `Checking ${st.games} live games · last check ${agoS(st.lastTick)}`}</span>
            <span>{nEnabled} game{nEnabled === 1 ? "" : "s"} picked{synced ? " · rule changes sent " + new Date(synced).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : " · rule and game changes here are sent automatically"}</span>
          </div>)}
        {browserRunning && <div className="note warn" style={{ marginTop: 10 }}>The in-tab bot is also running ({browserMode === "live" ? "real money" : "paper"}). See Advanced below.</div>}

        <div className="lv-sep" />
        <ModeSeg value={mode} onPick={setPick} locked={running} />

        {st && (
          <div style={{ marginTop: 14 }}>
            <div className="lv-k">What it does</div>
            <div className="lv-seg" role="group" aria-label="What the trader does">
              <button disabled={busy} aria-pressed={!entries} onClick={() => entries && setEntries(false)}>Manage my positions<small>sells only, never buys</small></button>
              <button disabled={busy} aria-pressed={entries} onClick={() => !entries && setEntries(true)}>Also find new trades<small>experimental</small></button>
            </div>
            <div className="lv-help">{entries ? "Manages the positions you pick and also opens its own trades." : "Sells the positions you pick at your target, stop or trailing stop. It never buys."}</div>
          </div>)}

        {st && !running && (
          <div className="lv-checks">
            {checks.map((c, i) => (
              <div key={i} className="lv-check">
                <span className={"ic " + (c.ok ? "ok" : "no")} aria-hidden="true">{c.ok ? "✓" : "!"}</span>
                <div style={{ minWidth: 0 }}><div>{c.label}</div>{c.fix && <div className="fix">{c.fix}</div>}</div>
              </div>))}
          </div>)}

        <div className="lv-actions">
          {!running && <button className={"btn " + (isLive ? "lv-go-live" : "btn-primary")} disabled={busy || !ready} onClick={start}>
            Start {isLive ? "with real money" : "paper trading"}</button>}
          {running && <button className="btn" disabled={busy} onClick={() => call("stop")}>Stop</button>}
          {(running || (st && st.positions.length > 0)) && <button className="btn lv-danger" disabled={busy} onClick={() => { if (confirm(isLive ? "Sell every position the auto trader manages (including the ones you handed over) at the current bid, and stop?" : "Paper: close the bot's paper positions and record would-sells for your managed positions, then stop?")) call("kill"); }}>Cash out all</button>}
        </div>
        {foot}
      </div>

      {pnl}

      {st && <MyPositions st={st} busy={busy} call={call} isLive={isLive} running={running} />}

      {st && (botPos.length > 0 || (running && entries)) && <>
        <UI.H2 aside={`${botPos.length}`}>Trader's own positions</UI.H2>
        {botPos.length === 0 ? <div className="note">None open.</div> : <div className="lv-plist">
          {botPos.map(p => (
            <PositionCard key={p.ticker} title={p.label} side={p.side} count={p.count} entry={p.avgCost} bid={p.bid}
              tp={p.tpPrice || Math.min(99, p.avgCost + cfg.takeProfit)} sl={p.avgCost - cfg.stopLoss} peak={p.peakBid}
              tag={p.lead ? <span className="chip">Fast entry</span> : null} />))}
        </div>}
      </>}

      {st && (st.log || []).length > 0 && (
        <div style={{ marginTop: 16 }}>
          <button className="lv-fold" aria-expanded={showLog} onClick={() => setShowLog(s => !s)}>Server log</button>
          {showLog && <div className="card lv-log" style={{ marginTop: 8 }}>
            {st.log.slice(0, 60).map((l, i) => (
              <div key={i} style={{ color: l.kind === "error" || l.kind === "loss" ? "var(--neg)" : l.kind === "win" ? "var(--pos)" : "var(--text-2)" }}><span className="ts">{new Date(l.ts).toLocaleTimeString()}</span>{l.msg}</div>))}
          </div>}
        </div>)}
    </>
  );
}


// Your own Kalshi positions, read from your account by the server. Tick one to hand it over with your sell rules.
function MyPositions({ st, busy, call, isLive, running }) {
  const list = (st.myPositions || []).filter(p => !p.botOwned);
  const [edit, setEdit] = useState({});
  if (!st.credentials) return <><UI.H2>Your Kalshi positions</UI.H2><div className="note">Your Kalshi positions show here once the server has your Kalshi key.</div></>;
  const age = st.myPositionsTs ? Math.round((Date.now() - st.myPositionsTs) / 1000) : null;
  const draft = (p) => edit[p.ticker] || (p.rules ? { tp: p.rules.tpPrice || "", sl: p.rules.slPrice || "", arm: p.rules.trailArm || "", give: p.rules.trailGive || "" }
    : { tp: Math.min(95, p.avgCost + 15), sl: Math.max(1, p.avgCost - 15), arm: "", give: "" });
  const set = (p, k, v) => setEdit(e => ({ ...e, [p.ticker]: { ...draft(p), [k]: v } }));
  const save = (p) => { const d = draft(p); call("manage", { ticker: p.ticker, rules: { tpPrice: d.tp, slPrice: d.sl, trailArm: d.arm, trailGive: d.give } }); setEdit(e => { const n = { ...e }; Reflect.deleteProperty(n, p.ticker); return n; }); };
  const num = (v) => v === "" || v == null || !isFinite(+v) ? null : +v;
  const field = (p, k, label, unit, ph) => (
    <label className="lv-mini"><span>{label}</span>
      <span className="lv-unit"><input className="field" inputMode="decimal" placeholder={ph} value={draft(p)[k]} onChange={e => set(p, k, e.target.value)} /><i>{unit}</i></span></label>);
  return (
    <>
      <UI.H2 aside={age != null ? `read ${age}s ago` : null}>Your Kalshi positions <span className="count">{list.length}</span></UI.H2>
      <div className="lv-intro">{isLive ? "Live: when a rule hits, the trader really sells." : "Paper: rules only record what would have sold. Nothing is sold."} Set a sell price and a stop, then tap Manage to hand a position over.</div>
      {list.length === 0 && <div className="note">No positions in your account right now.</div>}
      <div className="lv-plist">
        {list.map(p => {
          const d = draft(p), dirty = !!edit[p.ticker];
          return (
            <PositionCard key={p.ticker} title={p.label} side={p.side} meta={p.game} count={p.count} entry={p.avgCost} bid={p.bid} tp={num(d.tp)} sl={num(d.sl)}
              tag={p.rules ? <span className="chip"><span className="d" style={{ background: "var(--pos)" }} />Managed</span> : null}>
              <div className="lv-rules">
                {field(p, "tp", "Sell at", "¢")}
                {field(p, "sl", "Stop at", "¢")}
                {field(p, "give", "Trailing stop gives back", "¢", "off")}
                {field(p, "arm", "…once it's up", "+¢", "0")}
              </div>
              <div className="lv-actions" style={{ marginTop: 0 }}>
                {(!p.rules || dirty) && <button className="btn btn-primary" disabled={busy} onClick={() => save(p)}>{p.rules ? "Save rules" : "Manage"}</button>}
                {p.rules && <button className="btn" disabled={busy} onClick={() => call("manage", { ticker: p.ticker, rules: null })}>Stop managing</button>}
              </div>
              {p.rules && !isLive && p.shadowDone && <div className="note warn">Paper: its rule hit; see "Would have sold" under Profit and loss. Save the rules again to keep watching.</div>}
              {p.rules && !p.live && <div className="tiny muted">Acts once the game is live{running ? "" : " and the auto trader is started"}.</div>}
            </PositionCard>);
        })}
      </div>
    </>
  );
}

function ConfigPanel({ cfg, setCfg, mode, onResetPaper, server }) {
  const set = (k, v) => setCfg(c => ({ ...c, [k]: v }));
  const sw = (label, help, on, onClick) => (
    <div className="lv-field"><div className="fl">{label}</div>{help && <div className="fh">{help}</div>}<div className="fc"><Toggle on={on} onClick={onClick} label={label} /></div></div>);
  return (
    <div className="card lv-form">
      {CFG_FIELDS.map(([title, fields]) => (
        <div key={title}>
          <h3>{title}</h3>
          <div className="gsub">{CFG_GROUP_HELP[title]}</div>
          {fields.map(([k, label, step]) => (
            <label key={k} className="lv-field">
              <span className="fl">{label}</span>
              {CFG_HELP[k] && <span className="fh">{CFG_HELP[k]}</span>}
              <span className="fc"><input className="field" type="number" inputMode="decimal" step={step || 1} value={cfg[k] ?? ""} onChange={e => set(k, e.target.value === "" ? "" : Number(e.target.value))} /></span>
            </label>
          ))}
        </div>
      ))}
      <h3>Markets and feed</h3>
      <div className="gsub">Which Kalshi markets it trades and where the score comes from.</div>
      {["win", "spread", "total"].map(k => sw(`Trade ${k === "win" ? "moneylines" : k === "spread" ? "spreads" : "totals"}`, k === "win" ? "Who wins the game." : k === "spread" ? "Win by more than a number of points." : "Total points over a number.", !!cfg.kinds[k], () => set("kinds", { ...cfg.kinds, [k]: !cfg.kinds[k] })))}
      {sw("Rest a take-profit sell on Kalshi", "After each buy, leave a sell order at the take-profit price. It still fires if this tab closes.", !!cfg.restingTakeProfit, () => set("restingTakeProfit", !cfg.restingTakeProfit))}
      {sw("Also manage positions I opened myself", `Live mode only: apply these cash-out rules to ${SPORT === "nfl" ? "NFL" : "college football"} positions you bought yourself.`, !!cfg.manageManual, () => set("manageManual", !cfg.manageManual))}
      <label className="lv-field">
        <span className="fl">Game feed</span>
        <span className="fh">Where the live score comes from. Auto picks whichever is furthest along.</span>
        <span className="fc"><select className="field" value={cfg.liveFeed || "auto"} onChange={e => set("liveFeed", e.target.value)}><option value="auto">Auto (fastest)</option><option value="core">ESPN core</option><option value="kalshi">Kalshi (Stats Perform)</option><option value="espn">ESPN scoreboard</option></select></span>
      </label>
      <div className="lv-actions" style={{ borderTop: "1px solid var(--line)", paddingTop: 12 }}>
        <button className="btn" onClick={() => setCfg({ ...CFB.DEFAULT_CONFIG })}>Reset rules to defaults</button>
        {mode === "paper" && <button className="btn lv-danger" onClick={onResetPaper}>Reset paper account</button>}
      </div>
      {server && !server.credentials && (
        <div className="note" style={{ marginTop: 12 }}>
          <b>Live setup:</b> create an API key at kalshi.com → Account → API Keys, then in Cloudflare Pages → Settings → Environment variables add secrets
          <code> KALSHI_API_KEY_ID</code>, <code>KALSHI_PRIVATE_KEY</code> (paste the whole PEM), <code>KALSHI_TRADING_ENABLED=1</code> and <code>KALSHI_MAX_ORDER_DOLLARS</code> (server-side cap per order), then redeploy.
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
