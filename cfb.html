<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharp Sim — College Football</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/sharp.css">
<meta name="theme-color" content="#0b0d10">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="js/cfb-engine.js"></script>
<script src="js/bets.js"></script>
<script src="js/ui.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo } = React;
const CFB = window.CFB;

const ESPN = "https://site.api.espn.com/apis/site/v2/sports/football/college-football";
const SERIES = ["KXNCAAFGAME", "KXNCAAFSPREAD", "KXNCAAFTOTAL"];
const SEASON = 2026;
const RATINGS_KEY = "sharp_cfb_ratings_" + new Date().toLocaleDateString("en-CA");
const SIMS = 100000;
// blend weights for the final spread/total (the closing market carries most of the information)
const W = { results: 0.20, fpi: 0.15, market: 0.65 };
const WT = { results: 0.25, market: 0.75 };
const HFA = 2.3;

const UI = window.SharpUI;

async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status + " " + url); return r.json(); }
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// ── Ratings from this season's results ───────────────────────────────────────
// Points model: homePts = mu + O_h + D_a + HFA/2, awayPts = mu + O_a + D_h - HFA/2
// (O = points scored above average, D = points allowed above average), ridge-shrunk toward 0.
function fitRatings(games) {
  const ids = new Set(); games.forEach(g => { ids.add(g.h); ids.add(g.a); });
  const O = {}, D = {}, n = {}; ids.forEach(i => { O[i] = 0; D[i] = 0; n[i] = 0; });
  games.forEach(g => { n[g.h]++; n[g.a]++; });
  const mu = games.reduce((s, g) => s + g.hs + g.as, 0) / (2 * games.length);
  const lambda = 2.5;
  const cap = (x) => Math.max(-35, Math.min(35, x)); // dampen blowouts
  for (let it = 0; it < 120; it++) {
    const so = {}, sd = {}; ids.forEach(i => { so[i] = 0; sd[i] = 0; });
    for (const g of games) {
      const hfa = g.neutral ? 0 : HFA / 2;
      const rh = cap(g.hs - mu - hfa), ra = cap(g.as - mu + hfa);
      so[g.h] += rh - D[g.a]; sd[g.a] += rh - O[g.h];
      so[g.a] += ra - D[g.h]; sd[g.h] += ra - O[g.a];
    }
    ids.forEach(i => { O[i] = so[i] / (n[i] + lambda); D[i] = sd[i] / (n[i] + lambda); });
  }
  return { O, D, mu, n };
}

async function loadRatings(setStatus) {
  try { const c = JSON.parse(localStorage.getItem(RATINGS_KEY) || "null"); if (c) return c; } catch (e) {}
  const games = [];
  for (let wk = 1; wk <= 16; wk++) {
    setStatus(`Fitting ratings: week ${wk}…`);
    let d; try { d = await getJSON(`${ESPN}/scoreboard?groups=80&limit=300&seasontype=2&dates=${SEASON}&week=${wk}`); } catch (e) { continue; }
    let any = false;
    for (const e of d.events || []) {
      const c = e.competitions[0]; if (!e.status.type.completed) continue;
      const h = c.competitors.find(x => x.homeAway === "home"), a = c.competitors.find(x => x.homeAway === "away");
      games.push({ h: h.team.id, a: a.team.id, hs: +h.score, as: +a.score, neutral: !!c.neutralSite }); any = true;
    }
    if (!any && wk > 3) break;
    await sleep(60);
  }
  const fit = fitRatings(games);
  const out = { ...fit, nGames: games.length };
  try { localStorage.setItem(RATINGS_KEY, JSON.stringify(out)); } catch (e) {}
  return out;
}

function resultsProjection(rt, g) {
  const ok = (id) => rt && rt.n[id] >= 3;
  if (!ok(g.home.id) || !ok(g.away.id)) return null;
  const hfa = g.neutral ? 0 : HFA / 2;
  const hp = rt.mu + rt.O[g.home.id] + rt.D[g.away.id] + hfa;
  const ap = rt.mu + rt.O[g.away.id] + rt.D[g.home.id] - hfa;
  return { spreadHome: hp - ap, total: hp + ap, hp, ap };
}

function blend(g, res, fpiHome) {
  const mk = g.spreadHome != null ? { spreadHome: g.spreadHome, total: g.total } : null;
  const fpiSpread = fpiHome != null ? CFB.P.SIGMA_MARGIN * CFB.PhiInv(Math.min(0.995, Math.max(0.005, fpiHome))) : null;
  let num = 0, den = 0;
  if (mk) { num += W.market * mk.spreadHome; den += W.market; }
  if (res) { num += W.results * res.spreadHome; den += W.results; }
  if (fpiSpread != null) { num += W.fpi * fpiSpread; den += W.fpi; }
  const spread = den ? num / den : 0;
  let tn = 0, td = 0;
  if (mk && mk.total) { tn += WT.market * mk.total; td += WT.market; }
  if (res) { tn += WT.results * res.total; td += WT.results; }
  const total = td ? tn / td : 55;
  return { spreadHome: spread, total, fpiSpread, market: mk, results: res };
}

const SB = window.SharpBets;
const SPORT = "cfb";
const wide = (r) => r.yesAsk - r.yesBid > 6;   // quotes this far apart aren't real prices
// grade of a row's best side: model chance to cash vs the price of that side
const gradeRow = (r, st) => r.ask != null ? SB.grade(r.pSide, r.ask, st) : null;

// The best side of a row in plain words: "BAL -6.5" / "CIN +6.5", "BAL to win" / "BAL doesn't win", "Over 44.5" / "Under 44.5"
function betLabel(r, g) {
  const nm = (s) => s === "home" ? g.home.abbr : g.away.abbr, other = (s) => s === "home" ? "away" : "home";
  const yes = r.side === "yes";
  if (r.kind === "win") return yes ? `${nm(r.team)} to win` : `${nm(r.team)} doesn't win`;
  if (r.kind === "spread") return yes ? `${nm(r.team)} -${r.line}` : (r.line % 1 ? `${nm(other(r.team))} +${r.line}` : `${nm(r.team)} doesn't cover -${r.line}`);
  return yes ? `Over ${r.line}` : `Under ${r.line}`;
}
// One line saying what has to happen for the bet to cash
function betMeaning(r, g) {
  const nm = (s) => s === "home" ? g.home.abbr : g.away.abbr;
  const yes = r.side === "yes";
  if (r.kind === "win") return yes ? `${nm(r.team)} wins the game` : `${nm(r.team)} loses or ties`;
  if (r.kind === "spread") { const by = Math.floor(r.line) + 1; return yes ? `${nm(r.team)} wins by ${by}+` : `${nm(r.team)} doesn't win by ${by}+`; }
  return yes ? `${Math.floor(r.line) + 1}+ total points` : `${Math.ceil(r.line) - 1} or fewer total points`;
}
const pickOf = (r, g, gr) => ({ ticker: r.ticker, side: r.side, price: r.ask, chance: r.pSide * 100, label: betLabel(r, g), sub: `${betMeaning(r, g)} · ${g.away.abbr} @ ${g.home.abbr}`, sport: SPORT, grade: gr });

// ── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [status, setStatus] = useState("Loading games…");
  const [games, setGames] = useState([]);
  const [rt, setRt] = useState(null);
  const [extra, setExtra] = useState({});     // gameId -> {fpiHome, markets}
  const [sims, setSims] = useState({});       // gameId -> sim summary
  const [tab, setTab] = useState("picks");
  const [kx, setKx] = useState(null);
  const [kxDown, setKxDown] = useState(false);   // Kalshi prices unreachable (site API over Cloudflare's daily limit)

  useEffect(() => { (async () => {
    try {
      const sb = await getJSON(`${ESPN}/scoreboard?groups=80&limit=300&_=${Date.now()}`);
      const all = (sb.events || []).map(CFB.parseEspnEvent).filter(Boolean);
      const today = new Date().toLocaleDateString("en-CA");
      const list = all.filter(g => g.state === "pre" && (new Date(g.date) - Date.now()) < 7 * 86400e3)
        .sort((a, b) => new Date(a.date) - new Date(b.date));
      setGames(list);
      fetch("/api/kx/_status").then(r => r.json()).then(setKx).catch(() => {});
      const r = await loadRatings(setStatus); setRt(r);
      setStatus("Matching Kalshi markets…");
      const ev = await getJSON("/api/kx/events?series_ticker=KXNCAAFGAME&status=open&limit=200").catch(() => { setKxDown(true); return { events: [] }; });
      for (const g of list) {
        const x = {};
        try { const s = await getJSON(`${ESPN}/summary?event=${g.id}`); const p = s.predictor; if (p && p.homeTeam && p.homeTeam.gameProjection) x.fpiHome = parseFloat(p.homeTeam.gameProjection) / 100; } catch (e) {}
        let best = null; for (const e of ev.events || []) { const sc = CFB.matchEventScore(e.title, g); if (!best || sc > best.sc) best = { sc, e }; }
        if (best && best.sc >= 0.6) {
          const suffix = best.e.event_ticker.split("-").slice(1).join("-");
          const lists = [];
          for (const s of SERIES) { lists.push(await getJSON(`/api/kx/markets?limit=200&event_ticker=${s}-${suffix}`).catch(() => ({ markets: [] }))); await sleep(120); }
          x.markets = lists.flatMap(l => l.markets || []).map(m => CFB.parseKalshiMarket(m, g)).filter(Boolean);
          x.suffix = suffix;
        }
        setExtra(prev => ({ ...prev, [g.id]: x }));
      }
      setStatus("");
    } catch (e) { setStatus("Error: " + e.message); }
  })(); }, []);

  // run sims as data arrives
  useEffect(() => {
    if (!games.length) return;
    let cancelled = false;
    (async () => {
      for (const g of games) {
        if (cancelled) return;
        const x = extra[g.id]; if (!x || sims[g.id] && sims[g.id].v === (x.markets || []).length + (rt ? 1 : 0)) continue;
        const res = resultsProjection(rt, g);
        const b = blend(g, res, x.fpiHome);
        const dist = CFB.pregameSim(b.spreadHome, b.total, SIMS);
        const rows = (x.markets || []).filter(m => !m.half && m.status === "active").map(m => {
          const p = m.kind === "win" ? (m.side === "home" ? dist.pHome : 1 - dist.pHome) : m.kind === "spread" ? dist.pCover(m.side, m.line) : dist.pOver(m.line);
          const fair = p * 100;
          const fee = (c) => 0.07 * (c / 100) * (1 - c / 100) * 100;
          const yesEdge = m.yesAsk != null && m.yesAsk < 100 ? fair - m.yesAsk - fee(m.yesAsk) : null;
          const noEdge = m.noAsk != null && m.noAsk < 100 ? (100 - fair) - m.noAsk - fee(m.noAsk) : null;
          const side = (yesEdge ?? -99) >= (noEdge ?? -99) ? "yes" : "no";
          const edge = side === "yes" ? yesEdge : noEdge;
          const pSide = side === "yes" ? p : 1 - p;
          return { ...m, team: m.side, fair, side, edge, pSide, ask: side === "yes" ? m.yesAsk : m.noAsk };
        });
        // final-margin histogram in 3-point bins, for the chart on the game tab
        const bins = {}; let pTie = 0; for (const m of dist.margins) { const k = Math.round(m / 3); bins[k] = (bins[k] || 0) + 1; if (m === 0) pTie++; }
        const marginBins = []; for (let k = -12; k <= 12; k++) marginBins.push([k * 3, (bins[k] || 0) / dist.n]);
        setSims(prev => ({ ...prev, [g.id]: { v: (x.markets || []).length + (rt ? 1 : 0), b, pHome: dist.pHome, pAway: 1 - dist.pHome - pTie / dist.n, pTie: pTie / dist.n, marginBins, rows } }));
        await sleep(10);
      }
    })();
    return () => { cancelled = true; };
  }, [games, extra, rt]);

  const st = SB.useSettings();
  const picks = useMemo(() => {
    const out = [];
    for (const g of games) {
      const s = sims[g.id]; if (!s) continue;
      // best pick per market type per game, liquid quotes only
      const byKind = {};
      for (const r of s.rows) {
        if (r.ask == null || r.ask < 10 || r.ask > 90 || wide(r) || r.volume < 1000) continue;
        const gr = gradeRow(r, st);
        if (!gr || gr.rank > 2) continue;   // STRONG, GOOD, SMALL only
        if (!byKind[r.kind] || gr.edge > byKind[r.kind].gr.edge) byKind[r.kind] = { r, gr };
      }
      Object.values(byKind).forEach(({ r, gr }) => out.push({ g, r, gr }));
    }
    return out.sort((a, b) => a.gr.rank - b.gr.rank || b.gr.edge - a.gr.edge);
  }, [games, sims, st]);

  // add STRONG and GOOD picks to the win/loss record (deduped by ticker|side in the shared module)
  const logKey = picks.filter(p => p.gr.rank <= 1).map(p => p.r.ticker + "|" + p.r.side).join(",");
  useEffect(() => {
    if (!logKey) return;
    SB.logPicks(picks.filter(p => p.gr.rank <= 1).map(({ g, r, gr }) => ({
      sport: SPORT, gameId: g.id, gameDate: new Date(g.date).toLocaleDateString("en-CA"), home: g.home.name, away: g.away.name,
      market: betLabel(r, g), ticker: r.ticker, side: r.side, chance: gr.chance, price: r.ask, tier: gr.key })));
  }, [logKey]);

  const tabs = [["picks", "Top picks", { count: picks.length }], ...games.map(g => ["g" + g.id, `${g.away.abbr} @ ${g.home.abbr}`, { pending: !sims[g.id] }])];
  const active = games.find(g => "g" + g.id === tab);

  return (
    <UI.Shell active="cfb">
      <UI.PageHead eyebrow={<>College football · FBS · priced on Kalshi <a href="live.html" className="chip" style={{ marginLeft: 4 }}><span className="live-dot" style={{ width: 6, height: 6, borderRadius: 3, background: "var(--avoid)" }} />Live trader</a></>}
        title="College football picks"
        sub={`Every FBS game this week simulated ${SIMS.toLocaleString()} times from team ratings, then compared with Kalshi's price on every market.`} />
      <UI.Tabs tabs={tabs} value={tab} onChange={setTab} />
      {status && <UI.Status>{status}</UI.Status>}
      {tab === "picks" && <>
        <SB.GradeLegend sport={SPORT} />
        {kxDown
          ? <div className="note warn">Kalshi prices couldn't be loaded, so there's nothing to compare the model with. The site's data service is over Cloudflare's free daily request limit; it resets at 7 PM Eastern. The model's own lines are still on each game tab.</div>
          : <Picks picks={picks} st={st} loading={!!status} />}
        <UI.H2>Pick record</UI.H2>
        <SB.RecordCard sport={SPORT} />
      </>}
      {active && <GameView g={active} s={sims[active.id]} x={extra[active.id]} rt={rt} st={st} />}
      <div className="ss-foot">
        {rt && <div>Ratings fit on {rt.nGames} completed {SEASON} games. The final line blends {W.market * 100}% market, {W.results * 100}% results and {W.fpi * 100}% ESPN FPI, with {HFA} points for home field.</div>}
        <div style={{ marginTop: 6 }}>Edge is the model's chance minus Kalshi's price in cents, before Kalshi's small trading fee. The market carries most of the model's weight, so a very big edge usually means a thin or stale quote: check the price before buying. Not betting advice.</div>
      </div>
    </UI.Shell>
  );
}

const kickoff = (g) => new Date(g.date).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" });

function Picks({ picks, st, loading }) {
  if (!picks.length) return loading ? null : <div className="note">No bets worth making right now. A bet shows up here once the model's chance to cash beats Kalshi's price by at least {st.small.minEdge}¢ on a market that trades.</div>;
  const best = picks.filter(p => p.gr.rank <= 1), rest = picks.filter(p => p.gr.rank > 1);
  return (
    <div>
      <UI.H2 aside={best.length ? `${best.length} strong or good` : null}>Best bets right now</UI.H2>
      {best.length ? <div className="picks-grid">
        {best.map(({ g, r, gr }, i) => (
          <UI.PickCard key={r.ticker} top={i === 0} g={gr} title={betLabel(r, g)} meaning={betMeaning(r, g)}
            when={kickoff(g)} meta={`${g.away.name} @ ${g.home.name}`} pick={pickOf(r, g, gr)} />
        ))}
      </div> : <div className="note">No STRONG or GOOD bets right now. The smaller edges below are close calls: bet small or skip.</div>}
      {rest.length > 0 && <>
        <UI.H2 aside={`${rest.length}`}>Smaller edges</UI.H2>
        <UI.PickList>
          {rest.map(({ g, r, gr }) => <UI.PickRow key={r.ticker} g={gr} title={betLabel(r, g)} meaning={betMeaning(r, g)} meta={`${g.away.abbr} @ ${g.home.abbr} · ${kickoff(g)}`} pick={pickOf(r, g, gr)} />)}
        </UI.PickList>
      </>}
    </div>
  );
}

// Win chances as one split bar: away on the left, home on the right
function WinSplit({ g, s }) {
  const a = s.pAway * 100, hm = s.pHome * 100, t = Math.max(0, 100 - a - hm);
  return (
    <div>
      <div className="row" style={{ justifyContent: "space-between", marginBottom: 6 }}>
        <div><div className="num" style={{ fontSize: 22, fontWeight: 700 }}>{a.toFixed(0)}%</div><div className="tiny muted">{g.away.abbr} win</div></div>
        <div style={{ textAlign: "right" }}><div className="num" style={{ fontSize: 22, fontWeight: 700 }}>{hm.toFixed(0)}%</div><div className="tiny muted">{g.home.abbr} win</div></div>
      </div>
      <div role="img" aria-label={`${g.away.abbr} ${a.toFixed(0)}%, ${g.home.abbr} ${hm.toFixed(0)}%`} style={{ display: "flex", gap: 2, height: 10 }}>
        <div style={{ width: a + "%", background: "var(--series-b)", borderRadius: "999px 0 0 999px" }} />
        {t > 0.4 && <div style={{ width: t + "%", background: "var(--faint)" }} title={`Tie ${t.toFixed(1)}%`} />}
        <div style={{ width: hm + "%", background: "var(--series-a)", borderRadius: "0 999px 999px 0" }} />
      </div>
    </div>
  );
}

function GameView({ g, s, x, rt, st }) {
  const [sort, setSort] = useState({ k: "edge", dir: -1 });
  if (!s) return <UI.Status>Simulating {g.away.abbr} @ {g.home.abbr}…</UI.Status>;
  const b = s.b;
  const fmtLine = (sp) => sp == null ? "—" : `${sp >= 0 ? g.home.abbr : g.away.abbr} −${Math.abs(sp).toFixed(1)}`;
  const winRow = s.rows.find(r => r.kind === "win" && r.team === "home");
  const all = s.rows.map(r => ({ r, gr: gradeRow(r, st) }));
  const hidden = st.hideWide ? all.filter(o => wide(o.r)).length : 0;
  const shown = st.hideWide ? all.filter(o => !wide(o.r)) : all;
  const val = (o, k) => k === "bet" ? betLabel(o.r, g) : k === "chance" ? o.r.pSide * 100 : k === "price" ? o.r.ask : k === "edge" ? (o.gr ? o.gr.edge : null) : null;
  const rows = SB.sortRows(shown, sort, val);
  const kxHome = winRow ? CFB.mid(winRow) : null;
  return (
    <div>
      <div className="card" style={{ marginBottom: 12 }}>
        <div style={{ fontSize: 19, fontWeight: 700, letterSpacing: -0.3 }}>{g.away.rank ? <span className="muted">#{g.away.rank} </span> : null}{g.away.name} <span className="muted" style={{ fontWeight: 400 }}>@</span> {g.home.rank ? <span className="muted">#{g.home.rank} </span> : null}{g.home.name}</div>
        <div className="small muted" style={{ margin: "2px 0 14px" }}>{new Date(g.date).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })} · {g.venue}{g.neutral ? " (neutral)" : ""}{g.broadcast ? " · " + g.broadcast : ""}</div>
        <WinSplit g={g} s={s} />
        {kxHome != null && <div className="tiny muted" style={{ marginTop: 6 }}>Kalshi has {g.home.abbr} at {kxHome.toFixed(0)}%{s.pTie > 0.002 ? ` · tie ${(s.pTie * 100).toFixed(1)}%` : ""}</div>}
      </div>
      <div className="tiles" style={{ marginBottom: 12 }}>
        <UI.Tile label="Model spread" value={fmtLine(b.spreadHome)} sub={`Market ${b.market ? fmtLine(b.market.spreadHome) : "—"}`} />
        <UI.Tile label="Model total" value={b.total.toFixed(1)} sub={`Market ${b.market && b.market.total || "—"}`} />
        <UI.Tile label="Results rating" value={b.results ? fmtLine(b.results.spreadHome) : "n/a"} sub={b.results ? `total ${b.results.total.toFixed(1)}` : "needs 3+ games"} />
        <UI.Tile label="ESPN FPI" value={b.fpiSpread != null ? fmtLine(b.fpiSpread) : "n/a"} sub={`results total ${b.results ? b.results.total.toFixed(1) : "n/a"}`} />
      </div>
      <MarginChart g={g} s={s} />
      <UI.H2 aside={`${rows.length} markets`}>Every Kalshi market</UI.H2>
      {!x || !x.markets ? <div className="note">No Kalshi markets found for this game.</div> : <>
        <div className="row" style={{ marginBottom: 10, flexWrap: "wrap" }}>
          <span className="small muted">Sort by</span>
          <UI.Seg options={[["edge", "Best edge"], ["chance", "Most likely"], ["price", "Cheapest"]]} value={sort.k} onChange={k => setSort({ k, dir: k === "price" ? 1 : -1 })} />
        </div>
        <UI.PickList>
          {rows.map(({ r, gr }) => <UI.PickRow key={r.ticker} g={gr} title={betLabel(r, g)} meaning={betMeaning(r, g)} badge={gr && gr.rank <= 2}
            note={wide(r) ? "wide quote" : null} dim={wide(r)} pick={gr && gr.rank <= 2 ? pickOf(r, g, gr) : null} />)}
        </UI.PickList>
        {hidden > 0 && <div className="tiny muted" style={{ marginTop: 8 }}>{hidden} market{hidden > 1 ? "s" : ""} hidden: buy and sell prices more than 6¢ apart, so the price isn't real. Show them in <a href="settings.html" className="link">Settings</a>.</div>}
      </>}
    </div>
  );
}

// How often each final margin happens in the sim, in 3-point buckets
function MarginChart({ g, s }) {
  if (!s.marginBins) return null;
  const bars = s.marginBins.map(([m, p]) => ({ v: p * 100, m, color: m > 0 ? "var(--series-a)" : m < 0 ? "var(--series-b)" : "var(--faint)",
    tip: m === 0 ? `Within 1 point: ${(p * 100).toFixed(1)}%` : `${m > 0 ? g.home.abbr : g.away.abbr} by ${Math.abs(m) - 1}–${Math.abs(m) + 1}: ${(p * 100).toFixed(1)}%` }));
  return (
    <div className="card" style={{ marginBottom: 12 }}>
      <div style={{ fontWeight: 650, marginBottom: 2 }}>How the game ends</div>
      <div className="small text-2" style={{ marginBottom: 10 }}>Final margin across every simulated game, in 3-point steps. The taller the bar, the more often the game ends there.</div>
      <UI.BarChart bars={bars} height={140} yFmt={v => v + "%"} ariaLabel="Final margin distribution" labelOf={(i, b) => b.m % 12 === 0 && b.m ? Math.abs(b.m) : b.m === 0 ? "0" : null} />
      <div className="legend"><span><i style={{ background: "var(--series-b)" }} />{g.away.abbr} wins by</span><span><i style={{ background: "var(--series-a)" }} />{g.home.abbr} wins by</span></div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
